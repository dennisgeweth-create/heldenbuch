<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werkbank &middot; Der echte Planer</title>
<link rel="stylesheet" href="../planer/planer.css?v=dev">
<style>
  /* Wie dev/echt.html: der Bericht unten, die Seite darueber in voller
     Groesse. */
  #bericht { position:fixed; inset:auto 0 0 0; z-index:99999; max-height:42vh; overflow:auto;
    padding:12px 16px; background:#10100e; border-top:2px solid var(--gold-dim);
    font-family:'Roboto Condensed',sans-serif; font-size:13px; line-height:1.6; }
  #bericht h3 { margin:0 0 8px; color:var(--gold); font-size:15px; }
  #bericht .z { display:flex; gap:8px; align-items:baseline; }
  #bericht .gut { color:#7fd39b; } #bericht .weg { color:#e88; } #bericht .lauf { color:var(--text-muted); }
  #bericht .grund { color:var(--text-muted); font-size:12px; }
  #bericht .summe { margin-top:10px; padding-top:8px; border-top:1px solid var(--border); font-size:14px; }
  body { padding-bottom:42vh; }
  /* Das Tischfenster, klein in der Ecke statt ueber dem ganzen Schirm. */
  #tisch-probe { position:fixed; right:8px; top:8px; width:420px; height:280px; overflow:hidden; z-index:9999;
    border:2px solid #7fd39b; pointer-events:none; }
  #tisch-probe .pl-tisch, #tisch-probe .pl-tisch-leer, #tisch-probe .pl-tisch-handout { position:absolute; }
  #tisch-probe .pl-tisch .pl-leinwand-karte { height:280px; }
</style>

<body>
  <div id="root"></div>
  <div id="tisch-probe" hidden></div>
  <div id="bericht"><h3>Der echte Planer &mdash; Durchgang l&auml;uft&hellip;</h3><div id="zeilen"></div></div>

  <script>
    // ── Ein Server im Gedaechtnis ───────────────────────────────────
    // Dieselben Regeln wie api.php, so knapp wie moeglich: die
    // Spielleitung darf schreiben, ein Spieler sieht nur, was sichtbar
    // ist, und nie das Feld dm. Geprueft wird hier die Seite, nicht der
    // Server — der hat dev/test-api.php.
    const FAKE = {
      angemeldet: true, rolle: 'dm', stand: { strahd: 1, eberron: 1 },
      karten: new Map(), objekte: new Map(), ablagen: new Map(), aufrufe: [], gespeichert: [], logs: [],
      begegnungen: [{ id: 'enc_woelfe', name: 'Wolfsrudel', difficulty: 'Mittel', enemies: [{ enemyId: 'g1', count: 4 }], adventure: 'strahd' },
                    { id: 'enc_eberron', name: 'Nur in Eberron', difficulty: 'Leicht', enemies: [], adventure: 'eberron' }],
    };
    // Die Ablage einer Anfrage: der Ordner einer Karte oder eines Eintrags mit eigenem Ordner.
    const ablageVon = (p, adv) => {
      if (p.obj_id && !p.karte_id) {
        const o = FAKE.objekte.get(p.obj_id);
        if (!o || !o.daten.ablage) throw fakeFehler(404, 'Eintrag mit eigener Ablage nicht gefunden.');
        return o.daten.ablage;
      }
      const k = FAKE.karten.get(p.karte_id);
      if (!k || k.adv !== adv) throw fakeFehler(404, 'Karte nicht gefunden.');
      return k.ablage;
    };
    const hex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
    const ohneDm = (o) => { const { dm, ...r } = o; return r; };
    const fakeFehler = (status, text) => { const e = new Error(text); e.status = status; return e; };

    const planerZugang = () => FAKE.angemeldet ? { url: 'http://fake', code: 'TEST', token: 'x'.repeat(64) } : { url: '', code: '', token: '' };
    async function planerApi(action, p) {
      await new Promise(r => setTimeout(r, 5));
      if (FAKE.netzWeg) throw new Error('Server nicht erreichbar.');
      FAKE.aufrufe.push(action);
      const dm = FAKE.rolle === 'dm';
      const adv = p.adv_id;
      const hoch = () => { FAKE.stand[adv] = (FAKE.stand[adv] || 0) + 1; return FAKE.stand[adv]; };
      const karteVon = (id) => { const k = FAKE.karten.get(id); if (!k || k.adv !== adv) throw fakeFehler(404, 'Karte nicht gefunden.'); return k; };
      const nurDm = () => { if (!dm) throw fakeFehler(403, 'Das darf nur die Spielleitung.'); };
      switch (action) {
        case 'planer_start':
          return { ok: true, nutzer: { id: dm ? 7 : 8, name: dm ? 'Meisterin' : 'Armin' }, rolle: FAKE.rolle,
                   abenteuer: [{ id: 'strahd', name: 'Fluch des Strahd', leitest: dm }, { id: 'eberron', name: 'Eberron', leitest: dm }] };
        case 'planer_stand': return { ok: true, stand: FAKE.stand[adv] || 0 };
        case 'planer_laden': {
          const karten = [...FAKE.karten.values()].filter(k => k.adv === adv && (dm || k.daten.sichtbar))
            .map(k => ({ ...(dm ? k.daten : ohneDm(k.daten)), ablage: k.ablage }));
          const offen = new Set(karten.map(k => k.id));
          const objekte = [...FAKE.objekte.values()].filter(o => o.adv === adv && (dm || o.daten.sichtbar)
              && (o.daten.art === 'handout' ? (dm || !(o.daten.an || []).length || o.daten.an.includes(8))
                  : ['quest', 'hinweis', 'fraktion'].includes(o.daten.art) && !o.daten.karteId ? true : offen.has(o.daten.karteId)))
            .map(o => dm ? o.daten : ohneDm(o.daten));
          return { ok: true, dm, stand: FAKE.stand[adv] || 0, karten, objekte };
        }
        case 'planer_karte_speichern': {
          nurDm();
          const k = p.karte;
          if (!String(k.name || '').trim()) throw fakeFehler(400, 'Die Karte braucht einen Namen.');
          const alt = FAKE.karten.get(k.id);
          const { ablage, ...daten } = k;
          const neu = { adv, ablage: alt ? alt.ablage : hex(16), daten: { ...daten, sichtbar: !!k.sichtbar } };
          FAKE.karten.set(k.id, neu);
          hoch();
          return { ok: true, karte: { ...neu.daten, ablage: neu.ablage } };
        }
        case 'planer_karte_loeschen': {
          nurDm();
          const k = karteVon(p.karte_id);
          FAKE.karten.delete(p.karte_id);
          for (const [id, o] of FAKE.objekte) if (o.daten.karteId === p.karte_id) FAKE.objekte.delete(id);
          FAKE.ablagen.delete(k.ablage);
          return { ok: true, stand: hoch() };
        }
        case 'planer_obj_speichern': {
          nurDm();
          const o = { ...p.obj };
          if (o.art === 'handout') {
            const alt = FAKE.objekte.get(o.id);
            o.ablage = alt && alt.daten.ablage ? alt.daten.ablage : hex(16);
          } else if (!(['quest', 'hinweis', 'fraktion'].includes(o.art) && !o.karteId)) karteVon(o.karteId);
          FAKE.objekte.set(o.id, { adv, daten: o });
          return { ok: true, stand: hoch(), ablage: o.ablage || null };
        }
        case 'planer_obj_loeschen': {
          nurDm();
          const o = FAKE.objekte.get(p.obj_id);
          if (!o) throw fakeFehler(404, 'Nicht gefunden.');
          FAKE.objekte.delete(p.obj_id);
          if (o.daten.ablage) FAKE.ablagen.delete(o.daten.ablage);
          return { ok: true, stand: hoch() };
        }
        case 'member_list': nurDm(); return { ok: true, mitglieder: [{ id: 7, name: 'Meisterin', rolle: 'dm' }, { id: 8, name: 'Armin', rolle: 'spieler' }, { id: 9, name: 'Bea', rolle: 'spieler' }] };
        case 'planer_dateien_hoch': {
          nurDm();
          const k = { ablage: ablageVon(p, adv) };
          if (!FAKE.ablagen.has(k.ablage)) FAKE.ablagen.set(k.ablage, new Map());
          for (const d of p.dateien) {
            if (!PLAN_PFAD_RE.test(d.pfad)) throw fakeFehler(400, 'Ungültiger Dateiname: ' + d.pfad);
            FAKE.ablagen.get(k.ablage).set(d.pfad, Uint8Array.from(atob(d.daten), c => c.charCodeAt(0)));
          }
          return { ok: true, anzahl: p.dateien.length };
        }
        case 'dm_load_encounters': nurDm(); return { ok: true, encounters: FAKE.begegnungen };
        case 'dm_load_chronik': nurDm(); return { ok: true, chronik: { zeit: { strahd: 50 }, ereignisse: [] } };
        case 'save_log': FAKE.logs.push(p.entry); return { ok: true };
        case 'planer_dateien_weg': {
          nurDm();
          const k = { ablage: ablageVon(p, adv) };
          const ab = FAKE.ablagen.get(k.ablage) || new Map();
          if (p.pfade) p.pfade.forEach(pf => ab.delete(pf));
          else if (p.praefix) [...ab.keys()].filter(pf => pf.startsWith(p.praefix + '/')).forEach(pf => ab.delete(pf));
          else ab.clear();
          return { ok: true };
        }
        case 'planer_dateien_liste': {
          nurDm();
          const k = { ablage: ablageVon(p, adv) };
          const dateien = [...(FAKE.ablagen.get(k.ablage) || new Map())].map(([pfad, b]) => ({ pfad, bytes: b.length })).sort((a, b) => a.pfad < b.pfad ? -1 : 1);
          return { ok: true, ablage: k.ablage, dateien, bytes: dateien.reduce((s, d) => s + d.bytes, 0) };
        }
      }
      throw fakeFehler(400, 'Unbekannte Aktion: ' + action);
    }
    async function planerDateiHolen(ablage, pfad) {
      const b = (FAKE.ablagen.get(ablage) || new Map()).get(pfad);
      if (!b) throw new Error('Die Datei ' + pfad + ' ließ sich nicht holen (404).');
      return b;
    }
    function planerSpeichern(blob, name) { FAKE.gespeichert.push({ blob, name }); }
    // Bilder aus dem Gedaechtnis: je Datei eine Blob-Adresse.
    const fakeUrls = new Map();
    const planerDateiUrl = (ablage, pfad) => {
      const b = (FAKE.ablagen.get(ablage) || new Map()).get(pfad);
      if (!b) return 'data:,fehlt';
      const alt = fakeUrls.get(ablage + '/' + pfad);
      if (alt && alt.bytes === b) return alt.url;
      const typ = /\.png$/.test(pfad) ? 'image/png' : /\.jpe?g$/.test(pfad) ? 'image/jpeg' : 'image/webp';
      const url = URL.createObjectURL(new Blob([b], { type: typ }));
      fakeUrls.set(ablage + '/' + pfad, { bytes: b, url });
      return url;
    };
  </script>
  <script src="../planer/planer.js?v=dev"></script>
  <script>
    (async () => {
      const zeilen = document.getElementById('zeilen');
      let gut = 0, weg = 0;
      const melden = (art, wort, grund) => {
        const z = document.createElement('div');
        z.className = 'z ' + art;
        z.textContent = (art === 'gut' ? '✓ ' : art === 'weg' ? '✗ ' : '· ') + wort;
        if (grund) { const g = document.createElement('span'); g.className = 'grund'; g.textContent = grund; z.appendChild(g); }
        zeilen.appendChild(z);
      };
      const ja = (wort, bedingung, grund) => {
        if (bedingung) { gut++; melden('gut', wort); } else { weg++; melden('weg', wort, grund === undefined ? '' : String(grund)); }
        return !!bedingung;
      };
      const ruhe = (ms) => new Promise(r => setTimeout(r, ms || 60));
      const warte = async (bedingung, ms) => {
        const bis = Date.now() + (ms || 3000);
        while (Date.now() < bis) { const x = bedingung(); if (x) return x; await ruhe(30); }
        return null;
      };
      const root = document.getElementById('root');
      const knopf = (muster, wo) => [...(wo || root).querySelectorAll('button, a')].find(b => muster.test(b.textContent) || muster.test(b.getAttribute('aria-label') || ''));
      const tippe = (el, wert) => {
        const proto = el.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
        Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, wert);
        el.dispatchEvent(new Event('input', { bubbles: true }));
      };
      const waehle = (el, wert) => {
        Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value').set.call(el, wert);
        el.dispatchEvent(new Event('change', { bubbles: true }));
      };
      const legeDatei = (eingabe, blob, name) => {
        const dt = new DataTransfer();
        dt.items.add(blob instanceof File ? blob : new File([blob], name));
        eingabe.files = dt.files;
        eingabe.dispatchEvent(new Event('change', { bubbles: true }));
      };
      const textDa = (muster) => muster.test(root.textContent);
      const starten = async (einstellen) => { einstellen(); planerStarten(root); await ruhe(80); };
      const png = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='), c => c.charCodeAt(0));
      const testbild = async (b, h) => {
        const c = document.createElement('canvas');
        c.width = b; c.height = h;
        const x = c.getContext('2d');
        const verlauf = x.createLinearGradient(0, 0, b, h);
        verlauf.addColorStop(0, '#2d4a37'); verlauf.addColorStop(1, '#8b6c3a');
        x.fillStyle = verlauf; x.fillRect(0, 0, b, h);
        x.strokeStyle = 'rgba(255,255,255,.4)';
        for (let i = 0; i < b; i += b / 10) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
        const blob = await new Promise(r => c.toBlob(r, 'image/png'));
        return new File([blob], 'karte-' + b + '.png', { type: 'image/png' });
      };
      const leinwand = () => root.querySelector('.pl-leinwand-karte');
      const zeiger = (el, art, x, y) => el.dispatchEvent(new PointerEvent(art, { clientX: x, clientY: y, pointerId: 7, bubbles: true, button: 0, isPrimary: true }));
      const tippeKarte = (dx, dy) => {
        const el = leinwand(), r = el.getBoundingClientRect();
        const x = r.left + r.width / 2 + (dx || 0), y = r.top + r.height / 2 + (dy || 0);
        zeiger(el, 'pointerdown', x, y); zeiger(el, 'pointerup', x, y);
      };
      const karteVon = (name) => [...FAKE.karten.values()].find(k => k.daten.name === name);
      const bildEingabe = () => root.querySelector('input[type=file][accept^="image/png"]');

      try {
        // ── Ohne Anmeldung ─────────────────────────────────────────
        melden('lauf', 'Ohne Anmeldung');
        await starten(() => { FAKE.angemeldet = false; });
        ja('ohne Anmeldung steht der Hinweis auf das Heldenbuch da', !!(await warte(() => textDa(/zuerst im Heldenbuch anmelden/))));
        const zurueck = knopf(/Zum Heldenbuch/);
        ja('  … mit einem Weg zurück', zurueck && zurueck.getAttribute('href') === '../', zurueck && zurueck.getAttribute('href'));
        ja('  … und ohne einen einzigen Serveraufruf', FAKE.aufrufe.length === 0, FAKE.aufrufe.join(','));

        // ── Die Spielleitung ──────────────────────────────────────
        melden('lauf', 'Die Spielleitung');
        await starten(() => { FAKE.angemeldet = true; FAKE.rolle = 'dm'; });
        ja('die Seite laedt und nennt die Rolle', !!(await warte(() => root.querySelector('.pl-rolle.dm'))));
        const wahl = root.querySelector('.pl-adv select');
        ja('beide Abenteuer stehen zur Wahl', wahl && wahl.options.length === 2, wahl && wahl.options.length);
        ja('ohne Karten steht, was zu tun ist', textDa(/Noch keine Karte/));
        ja('Exportieren ist ohne Karten gesperrt', knopf(/Exportieren/) && knopf(/Exportieren/).disabled);

        knopf(/Neue Karte/).click();
        await ruhe();
        const feld = root.querySelector('.pl-neu input');
        ja('„Neue Karte“ oeffnet ein Namensfeld', !!feld);
        tippe(feld, 'Barovia');
        root.querySelector('.pl-neu button[type=submit]').click();
        const angelegt = await warte(() => root.querySelector('.pl-buehne-kopf h1'));
        ja('die Karte ist angelegt und gewaehlt', angelegt && angelegt.textContent === 'Barovia', angelegt && angelegt.textContent);
        ja('  … zunaechst fuer Spieler verborgen', textDa(/für Spieler verborgen/));
        const kId = [...FAKE.karten.keys()][0];
        ja('  … mit einer Kennung nach der Regel', /^k_[0-9a-f]{16}$/.test(kId || ''), kId);
        knopf(/Sichtbar machen/).click();
        ja('das Auge macht sie sichtbar', !!(await warte(() => textDa(/für Spieler sichtbar/))));
        knopf(/Umbenennen/).click();
        await ruhe();
        const um = root.querySelector('.pl-eintrag .pl-neu input');
        tippe(um, 'Barovia-Tal');
        um.form.requestSubmit();
        ja('umbenennen geht', !!(await warte(() => root.querySelector('.pl-buehne-kopf h1').textContent === 'Barovia-Tal')));

        // ── Das Kartenbild ─────────────────────────────────────────
        melden('lauf', 'Das Kartenbild');
        ja('ohne Bild bietet die Karte das Hochladen an', textDa(/Noch kein Kartenbild/) && !!knopf(/Kartenbild wählen/));
        ja('  … Ort setzen und Messen gibt es erst mit Bild', !knopf(/Ort setzen/) && !knopf(/Messen/));
        legeDatei(bildEingabe(), await testbild(1000, 700));
        ja('das Bild wird geschnitten und übernommen', !!(await warte(() => textDa(/Kartenbild übernommen: 1000 × 700 Pixel, 17 Kacheln/), 20000)),
           root.querySelector('.pl-meldung') && root.querySelector('.pl-meldung').textContent);
        const ab = karteVon('Barovia-Tal').ablage;
        const dateienB1 = [...FAKE.ablagen.get(ab).keys()];
        ja('  … 17 Kacheln und eine Vorschau liegen im Ordner b1', dateienB1.filter(p => /^b1\/\d+\/\d+\/\d+\.webp$/.test(p)).length === 17 && dateienB1.includes('b1/vorschau.webp'), dateienB1.length);
        const bild1 = karteVon('Barovia-Tal').daten.bild;
        ja('  … die Karte kennt ihr Bild', bild1 && bild1.breite === 1000 && bild1.hoehe === 700 && bild1.ordner === 'b1' && bild1.stufen === 2 && bild1.endung === 'webp', JSON.stringify(bild1));
        const kachel = FAKE.ablagen.get(ab).get('b1/2/3/2.webp');
        ja('  … eine Kachel ist ein echtes WebP', !!kachel && String.fromCharCode(...kachel.subarray(8, 12)) === 'WEBP');
        const kachelBild = await createImageBitmap(new Blob([kachel], { type: 'image/webp' }));
        ja('  … und die Randkachel hat die Randgröße (232 × 188)', kachelBild.width === 232 && kachelBild.height === 188, kachelBild.width + '×' + kachelBild.height);
        ja('die Leinwand zeigt Kacheln', !!(await warte(() => root.querySelectorAll('.pl-kacheln img').length > 0)));
        ja('  … die Liste zeigt die Vorschau', !!root.querySelector('.pl-eintrag img.pl-vorschau'));
        // Die Breite einer Kachel der vorderen Stufe zeigt, wie nah man dran ist.
        const kachelBreite = () => Math.max(...[...root.querySelectorAll('.pl-kacheln img:not(.hinten)')].map(i => parseFloat(i.style.width)));
        const breiteVorher = kachelBreite();
        knopf(/Näher heran/).click(); await ruhe(60); knopf(/Näher heran/).click();
        await ruhe(120);
        ja('＋ zoomt heran', kachelBreite() > breiteVorher * 1.5, breiteVorher + ' → ' + kachelBreite());
        knopf(/Ganze Karte/).click();
        await ruhe(120);
        ja('⤢ zeigt wieder die ganze Karte', Math.abs(kachelBreite() - breiteVorher) < 0.5, kachelBreite());

        // ── Maßstab und Lineal ─────────────────────────────────────
        melden('lauf', 'Maßstab und Lineal');
        knopf(/Messen/).click();
        await ruhe();
        tippeKarte(-100, 0); tippeKarte(100, 0);
        ja('ohne Maßstab sagt das Lineal, was fehlt', !!(await warte(() => textDa(/Ohne Maßstab lässt sich nicht messen/))));
        knopf(/Maßstab/).click();
        await ruhe();
        tippeKarte(0, 0); await ruhe(); tippeKarte(150, 0);
        const md = await warte(() => root.querySelector('form.pl-dialog'));
        ja('zwei Klicks öffnen die Frage nach der Entfernung', !!md);
        tippe(md.querySelector('input'), '30');
        md.requestSubmit();
        ja('der Maßstab ist gespeichert', !!(await warte(() => { const m = karteVon('Barovia-Tal').daten.massstab; return m && m.laenge === 30 && m.a.y === m.b.y && m.b.x > m.a.x; })),
           JSON.stringify(karteVon('Barovia-Tal').daten.massstab));
        ja('  … die Leiste unten zeigt ihn', !!(await warte(() => root.querySelector('.pl-massstab-leiste'))));
        knopf(/Messen/).click();
        await ruhe();
        tippeKarte(0, 0); await ruhe(); tippeKarte(150, 0);
        ja('das Lineal misst die 30 km nach', !!(await warte(() => /30 km · ≈ 6,5 Std\. zu Fuß/.test((root.querySelector('.pl-strecke') || {}).textContent || ''))),
           (root.querySelector('.pl-strecke') || {}).textContent);
        ja('  … und zeichnet die Strecke', root.querySelectorAll('.pl-ueberlage circle').length === 2);
        knopf(/^Fertig$/).click();

        // ── Orte ───────────────────────────────────────────────────
        melden('lauf', 'Orte');
        knopf(/Ort setzen/).click();
        await ruhe();
        tippeKarte(0, 0);
        const tafel = await warte(() => root.querySelector('.pl-tafel'));
        ja('ein Klick setzt einen Ort und öffnet seine Tafel', !!tafel && /Neuer Ort/.test(tafel.textContent));
        const ortId = [...FAKE.objekte.keys()].find(id => FAKE.objekte.get(id).daten.name === 'Neuer Ort');
        const mA = karteVon('Barovia-Tal').daten.massstab.a;
        // Die Marke sitzt mit ihrer Spitze dort, wohin geklickt wurde.
        const neueMarke = await warte(() => [...root.querySelectorAll('.pl-ort')].find(b => /Neuer Ort/.test(b.textContent)));
        // Genau nachmessen laesst sich das in der verkleinerten Vorschau nicht
        // (Rechteck und Layout rechnen dort in verschiedenen Massen); der Ort
        // muss aber dort liegen, wo vorher der Maßstab begann — beide Klicks
        // gingen auf die Mitte der Karte.
        ja('  … dort, wo geklickt wurde', !!neueMarke && Math.abs(FAKE.objekte.get(ortId).daten.x - mA.x) < 40 && Math.abs(FAKE.objekte.get(ortId).daten.y - mA.y) < 40,
           JSON.stringify(FAKE.objekte.get(ortId).daten) + ' / ' + JSON.stringify(mA));
        tippe(tafel.querySelector('input.pl-feld'), 'Dorf Barovia');
        tippe(tafel.querySelectorAll('textarea')[0], 'Nebel liegt über den Dächern.');

        zeiger(spMarke, 'pointerup', smr.left + 5, smr.top + 5);
        const spTafel = await warte(() => root.querySelector('.pl-tafel'));
        ja('  … seine Tafel zum Lesen', !!spTafel && /Nebel liegt über den Dächern/.test(spTafel.textContent) && !spTafel.querySelector('input, textarea'));
        ja('  … ohne die Notiz der Spielleitung', !/Ireena/.test(root.textContent));
        ja('  … und ohne Weg zur verborgenen Burg', !knopf(/Burg Ravenloft/));
        const xVorher = [...FAKE.objekte.values()].find(o => o.daten.art === 'ort').daten.x;
        const marke2 = [...root.querySelectorAll('.pl-ort')].find(b => /Dorf Barovia/.test(b.textContent));
        zeiger(marke2, 'pointerdown', smr.left + 5, smr.top + 5); await ruhe(40);
        zeiger(marke2, 'pointermove', smr.left + 90, smr.top + 5); await ruhe(40);
        zeiger(marke2, 'pointerup', smr.left + 90, smr.top + 5); await ruhe(200);
        ja('  … ein Spieler kann keinen Ort verschieben', [...FAKE.objekte.values()].find(o => o.daten.art === 'ort').daten.x === xVorher);
        ja('  … die verborgene Route und die verborgene Reise sieht er nicht', !root.querySelector('.pl-route') && !root.querySelector('.pl-gruppe'));
        ja('  … die verborgene Region auch nicht', !root.querySelector('.pl-region') && !root.querySelector('.pl-region-name'));
        ja('  … keine verborgene Figur', !root.querySelector('.pl-figur'));
        ja('  … aber die sichtbare Quest', [...root.querySelectorAll('.pl-liste[aria-label="Geschichte"] .pl-eintrag-name')].some(b => /Gruppe nach Vallaki/.test(b.textContent)));
        ja('  … und keine Dateien vom Rechner der Spielleitung', !root.querySelector('.pl-dateien'));
      } catch (e) {
        weg++;
        melden('weg', 'Abbruch: ' + e.message, e.stack);
      }
      const s = document.createElement('div');
      s.className = 'summe ' + (weg ? 'weg' : 'gut');
      s.textContent = gut + ' gut, ' + weg + ' schlecht';
      zeilen.appendChild(s);
      document.querySelector('#bericht h3').textContent = 'Der echte Planer — ' + (weg ? 'es gibt Fehler' : 'alles gut');
      window.PLANER_ECHT = { gut, weg };
    })();
  </script>
</body>
</html>
