<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Werkbank &middot; Die echte Seite</title>
<link rel="stylesheet" href="../styles.css?v=dev">
<style>
  /* Der Bericht liegt unter der Anwendung, nicht neben ihr: die
     Anwendung soll den Schirm fuellen, wie sie es im Ernstfall tut. */
  #bericht { position:fixed; inset:auto 0 0 0; z-index:99999; max-height:46vh;
    overflow:auto; padding:12px 16px; background:#10100e; border-top:2px solid var(--gold-dim);
    font-family:'Roboto Condensed',sans-serif; font-size:13px; line-height:1.65; }
  #bericht h3 { margin:0 0 8px; font-family:'Cinzel',serif; color:var(--gold); font-size:15px; }
  #bericht .z { display:flex; gap:8px; align-items:baseline; }
  #bericht .gut  { color:#7fd39b; }
  #bericht .weg  { color:#e88; }
  #bericht .lauf { color:var(--text-muted); }
  #bericht .grund { color:var(--text-muted); font-size:12px; font-style:normal; }
  #bericht .summe { margin-top:10px; padding-top:8px; border-top:1px solid var(--border);
    font-size:14px; }
  #bericht .summe.gut { color:#7fd39b; } #bericht .summe.weg { color:#e88; }
  body { padding-bottom:46vh; }
</style>
</head>
<body>
  <!-- Genau die beiden Behaelter, die die index.html mitbringt. Die
       Anwendung faehrt damit hier auf demselben Weg hoch wie dort —
       sonst pruefte diese Seite nicht die echte Seite. -->
  <div id="loading"></div>
  <div id="root" style="display:none"></div>
  <div id="bericht"><h3>Die echte Seite &mdash; Durchgang l&auml;uft&hellip;</h3><div id="zeilen"></div></div>

  <script>
    // ── Der Speicher ────────────────────────────────────────────────
    // Ein eigener, nur im Arbeitsspeicher. Die Anwendung legt ihre Helden
    // unter demselben Schluessel ab wie die echte auf demselben Rechner —
    // ohne diesen Austausch wuerde diese Seite die Helden ueberschreiben,
    // an denen jemand gerade arbeitet.
    (function () {
      const fach = Object.create(null);
      const ersatz = {
        getItem: (k) => (k in fach ? fach[k] : null),
        setItem: (k, v) => { fach[k] = String(v); },
        removeItem: (k) => { delete fach[k]; },
        clear: () => { for (const k in fach) delete fach[k]; },
        key: (i) => Object.keys(fach)[i] || null,
        get length() { return Object.keys(fach).length; },
      };
      try {
        Object.defineProperty(window, 'localStorage', {configurable: true, value: ersatz});
      } catch (e) {
        document.getElementById('zeilen').innerHTML =
          '<div class="z weg">Der Speicher liess sich nicht austauschen — diese Seite '
          + 'wuerde echte Helden ueberschreiben und bricht deshalb ab.</div>';
        throw e;
      }
      window.wbSpeicher = fach;
    })();

    // ── Der Held, an dem geprueft wird ─────────────────────────────
    // Ein voller Bogen: Attribute, Uebungen, eine Waffe, getragene
    // Ruestung, ein Merkmal. Wer weniger hinstellt, prueft weniger.
    const WB_HELD = {
      id: 'wb1', name: 'Brunhilde Eisenfaust', race: 'Zwergin',
      charClass: 'Kämpfer', subclass: 'Champion', level: 5, multiclasses: [],
      background: 'Soldatin',
      hp: 31, maxHp: 44, tempHp: 0, ac: 10, speed: 7.5, initiative: 0, profBonus: 3,
      inspiration: 0, inspirationMax: 1,
      str: 16, dex: 12, con: 15, int: 10, wis: 12, cha: 8,
      portrait: '', notes: 'Sucht den Hammer ihres Vaters.', notesList: [],
      features: [{id: 'f1', name: 'Aktionsschub', source: 'Kämpfer 2',
        description: 'Einmal je Rast eine <b>zusätzliche Aktion</b>.',
        effects: [], effectsActive: true},
        // Ein Merkmal, das einen Zauber auslöst und davon zehrt.
        {id: 'f2', name: 'Bannstrahl', source: 'Werkbank',
         description: 'Löst Person festhalten aus.', effects: [], effectsActive: true,
         ressource: 'r1', ressourceKosten: 1, zauber: 'Person festhalten'}],
      weapons: [{id: 'w1', name: 'Kriegshammer', attrKey: 'str', proficient: true,
        range: '1,5 m', attackBonus: 0, damage: '1W8', damageType: 'Wucht',
        description: 'Der Hammer ihres Vaters, nachgeschmiedet.',
        properties: ['Vielseitig'], equipped: false, imageData: '', effects: []}],
      // Kein Zauberwirker, aber fuer die Werkbank einer: der Zauber traegt
      // eine Wirkung mit Rettungswurf und Zustand.
      spells: [{id: 's1', name: 'Person festhalten', level: 2, school: 'Verzauberung',
        castingTime: '1 Aktion', range: '18 m', duration: 'Konzentration, bis zu 1 Minute',
        components: 'V, G, M', description: 'Das Ziel ist gelähmt.', prepared: true,
        wirkung: {art: '', wuerfel: '', rettung: 'wis', halb: false, zustaende: ['Gelähmt']}}],
      skillProfs: ['athletik', 'einschuechtern'], expertiseProfs: [],
      jackOfAllTrades: false, languages: ['Gemeinsprache', 'Zwergisch'],
      toolProfs: ['Schmiedewerkzeug'], weaponProfs: ['Kriegswaffen'],
      armorProfs: ['Schwer'], savingThrowProfs: ['str', 'con'],
      sorceryPoints: {max: 0, used: 0}, wsFavorites: [],
      resources: [{id: 'r1', name: 'Kanalisieren', max: 1, used: 0, color: '#c9a84c', restType: 'kurz'}],
      inventory: [{id: 'i1', name: 'Kettenhemd', qty: 1, weight: '25', wert: 5000,
        rarity: 'gewöhnlich', description: '', tags: [], source: '', effects: [],
        effectsActive: false, kampf: false, gearKind: 'ruestung',
        armorType: 'heavy', baseAC: 16, acBonus: 0}],
      currency: {pp: 0, gp: 12, ep: 0, sp: 0, cp: 0}, equipment: [], acBonuses: [],
      gear: {ruestung: {k: 'i', id: 'i1'}, haupthand: {k: 'w', id: 'w1'}},
      gearMigrated: 3, adventure: '',
      spellSlots: {1:{max:0,used:0},2:{max:2,used:0},3:{max:0,used:0},4:{max:0,used:0},
                   5:{max:0,used:0},6:{max:0,used:0},7:{max:0,used:0},8:{max:0,used:0},
                   9:{max:0,used:0}},
    };
    localStorage.setItem('dnd_chars', JSON.stringify([WB_HELD]));
    // Ein Abenteuer, damit alles, was je Abenteuer gilt — Laden, Post —,
    // einen Ort hat. Der Held steht ohne eigenes darin.
    localStorage.setItem('hb_library', JSON.stringify({_adventures: [{id: 'wb', name: 'Werkbank', rastRegel: 'grr'}]}));
    localStorage.setItem('hb_adventure', 'wb');
    // Die Fensterleiste vom „letzten Mal": die Datenbank war offen und
    // lag minimiert in der Leiste. Nach dem Start muss sie dort wieder stehen.
    localStorage.setItem('hb_fensterleiste', JSON.stringify({offen: ['datenbank'], versteckt: {datenbank: true}, vorne: ['datenbank']}));

    // ── Ein laufender Kampf ────────────────────────────────────────
    // Brunhilde ist am Zug, ein Goblin steht gegenüber. Liegt er schon im
    // Speicher, faehrt der Tracker damit hoch wie nach einem Neuladen
    // mitten im Kampf — der Weg dahin ist nicht, worum es hier geht.
    localStorage.setItem('hb_kampf', JSON.stringify({
      aktiv: true, phase: 'kampf', name: 'Werkbank', runde: 1, zug: 0, zwischen: null,
      teilnehmer: [
        {id: 'held-wb1', art: 'held', charId: 'wb1', ini: 15, zustaende: [],
         erschoepfung: 0, vorteil: false, nachteil: false},
        {id: 'wb-goblin', art: 'gegner', vorlageId: 'goblin', name: 'Goblin',
         ac: 15, hpMax: 7, hp: 7, tempHp: 0, ini: 10, dex: 14,
         zustaende: [], erschoepfung: 0, notiz: '', bild: null},
      ],
      log: [{art: 'start', wer: 'Werkbank', r: 1}],
    }));

    // ── Die Schnittstelle ──────────────────────────────────────────
    // Kein Server, und nichts, wogegen man sich anmelden koennte. Was
    // Daten liefern muss, damit die Spielleitung hineinkommt, liefert
    // sie hier aus der Luft; alles andere schweigt.
    const wbStumm = () => Promise.reject(new Error('Werkbank: kein Server'));
    const apiAdvDmSetzen = wbStumm;
    const apiBesitzerSetzen = wbStumm;
    const apiBeuteNehmen = wbStumm;
    const apiBeuteSetzen = wbStumm;
    const apiBeuteStand = wbStumm;
    const apiDeleteChar = wbStumm;
    const apiDeleteItem = wbStumm;
    const apiDmDeleteEncounter = wbStumm;
    const apiDmDeleteEnemy = wbStumm;
    const apiDmImportEnemies = wbStumm;
    const apiDmLoadChronik = wbStumm;
    const apiDmSaveChronik = wbStumm;
    const apiDmSaveEncounter = wbStumm;
    const apiDmSaveEnemy = wbStumm;
    const apiDmSaveLibrary = wbStumm;
    const apiGruppeNeu = wbStumm;
    const apiKampfAnsage = wbStumm;
    const apiKampfAnsagen = wbStumm;
    const apiKampfSetzen = wbStumm;
    const apiKampfStand = wbStumm;
    const apiKontoListe = wbStumm;
    const apiKontoLoeschen = wbStumm;
    const apiKontoNeu = wbStumm;
    const apiKontoReset = wbStumm;
    const apiLoadChars = wbStumm;
    const apiLoadLogs = wbStumm;
    const apiLogFrist = wbStumm;
    const apiLogin = wbStumm;
    const apiLogout = wbStumm;
    const apiMeineDaten = wbStumm;
    const apiMitglieder = wbStumm;
    const apiPassAendern = wbStumm;
    const apiPoll = wbStumm;
    const apiProbeAntwort = wbStumm;
    const apiProbeNachricht = wbStumm;
    const apiProbeSetzen = wbStumm;
    const apiProbeStand = wbStumm;
    // Post: die Werkbank hat einen Briefkasten im Arbeitsspeicher, damit
    // sich das Fenster der Spielleitung pruefen laesst.
    const wbPost = [{id: 1, charId: 'wb1', name: 'Brunhilde Eisenfaust',
                     text: 'Ich stecke den Schlüssel heimlich ein.', gelesen: false,
                     zeit: Math.floor(Date.now() / 1000)}];
    const apiPostListe = () => Promise.resolve({post: wbPost.map(p => ({...p})), dm: true});
    const apiPostGelesen = (u, c, a, id, gelesen) => {
      const p = wbPost.find(x => x.id === id); if (p) p.gelesen = !!gelesen;
      return Promise.resolve({});
    };
    const apiPostLoeschen = (u, c, a, id) => {
      const i = wbPost.findIndex(x => x.id === id); if (i >= 0) wbPost.splice(i, 1);
      return Promise.resolve({});
    };
    const apiPostSenden = wbStumm;
    // Die Rast: angesagt wird in den Arbeitsspeicher, und was dort steht,
    // bekommt die Anwendung beim naechsten Fragen zurueck.
    let wbRast = null, wbRastStand = 0;
    const apiRastSetzen = (u, c, a, r) => {
      wbRast = r ? {...r, id: 'rast' + (++wbRastStand), zeit: Math.floor(Date.now() / 1000), antworten: []} : null;
      wbRastStand++;
      return Promise.resolve(wbRast ? {rast: wbRast} : {});
    };
    const apiRastStand = (u, c, a, seit) => Promise.resolve(seit === wbRastStand
      ? {stand: wbRastStand} : {stand: wbRastStand, rast: wbRast});
    const apiRastAntwort = (u, c, a, rastId, charId, name, text) => {
      if (wbRast) wbRast.antworten = [...wbRast.antworten.filter(x => x.charId !== charId), {charId, name, text}];
      wbRastStand++;
      return Promise.resolve({});
    };
    const apiRequest = wbStumm;
    const apiRolleSetzen = wbStumm;
    const apiSaveChar = wbStumm;
    const apiSaveChars = wbStumm;
    const apiSaveItem = wbStumm;
    const apiSaveLibrary = wbStumm;
    const apiSaveLog = wbStumm;
    const apiSetDmPassword = wbStumm;
    const apiSetupNoetig = wbStumm;
    // Die Rolle haengt an der Gruppe, nicht am Konto — deshalb die
    // Liste, und deshalb muss der Code derselbe sein wie in serverCreds.
    const apiMe = () => Promise.resolve({user: {
      id: 'wb-dm', name: 'Werkbank', ist_admin: false,
      gruppen: [{session_code: 'WB', rolle: 'dm'}],
    }});
    const apiDmLoad = () => Promise.resolve({dm_library: {}});
    const apiDmLoadEnemies = () => Promise.resolve({enemies: []});
    // Eine Begegnung, damit der Auftrag aus dem Abenteuerplaner etwas zu
    // laden hat. Ihr Gegner fehlt in der Sammlung — geladen wird also
    // nichts, gefragt wird trotzdem.
    const apiDmLoadEncounters = () => Promise.resolve({encounters: [
      {id: 'enc_wb', name: 'Wolfsrudel', difficulty: 'Mittel', description: '', enemies: [{enemyId: 'g_fehlt', count: 2}], adventure: ''}]});
    // Eine Adresse muss dastehen, sonst haelt sich die Anwendung fuer
    // unverbunden und liest ihre Helden gar nicht erst aus dem Speicher.
    // Angerufen wird sie nie: jede Anfrage geht an die Stummen oben.
    const serverCreds = () => ({url: 'http://werkbank.ungueltig',
                                code: 'WB', pass: '', token: 'werkbank'});
    const safeSetItem = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  </script>
  <script src="../js/data.js?v=dev"></script>
  <script src="../js/util.js?v=dev"></script>
  <script src="../js/zip.js?v=dev"></script>
  <script src="../vendor/react.production.min.js?v=dev"></script>
  <script src="../vendor/react-dom.production.min.js?v=dev"></script>
  <script src="../js/app.js?v=dev"></script>
  <script>
    // ── Der Durchgang ──────────────────────────────────────────────
    // Geklickt wird, was ein Mensch klicken wuerde: gesucht wird nach
    // Aufschrift, nicht nach Klassennamen. Und geprueft wird, was auf
    // dem Schirm steht — nicht, was die Rechnung dahinter meint.
    (function () {
      const zeilen = document.getElementById('zeilen');
      let gut = 0, schlecht = 0;

      const melden = (art, wort, grund) => {
        const d = document.createElement('div');
        d.className = 'z ' + art;
        const zeichen = art === 'gut' ? '✓' : art === 'weg' ? '✕' : '·';
        const kopf = document.createElement('span'); kopf.textContent = zeichen;
        const leib = document.createElement('span'); leib.textContent = wort;
        if (grund) {
          const i = document.createElement('i');
          i.className = 'grund'; i.textContent = '  ' + grund;
          leib.appendChild(i);
        }
        d.appendChild(kopf); d.appendChild(leib);
        zeilen.appendChild(d);
        d.scrollIntoView({block: 'nearest'});
      };
      const ja = (wort, bedingung, grund) => {
        if (bedingung) { gut++; melden('gut', wort); }
        else { schlecht++; melden('weg', wort, grund || ''); }
        return !!bedingung;
      };

      // Warten, bis etwas da ist: die Anwendung baut sich in Schritten
      // auf, und ein Klick ins Leere waere kein Fehler der Anwendung.
      const warten = (suche, ms) => new Promise((fertig) => {
        const bis = Date.now() + (ms || 5000);
        const sehen = () => {
          let t = null;
          try { t = suche(); } catch (e) {}
          if (t) return fertig(t);
          if (Date.now() > bis) return fertig(null);
          setTimeout(sehen, 40);
        };
        sehen();
      });
      const knopfMit = (wort) => [...document.querySelectorAll('button')]
        .find(b => (b.textContent || '').includes(wort)) || null;
      const ruhe = (ms) => new Promise(r => setTimeout(r, ms || 60));

      // Ein Fehler beim Zeichnen reisst sonst nur den Baum herunter und
      // hinterlaesst eine graue Flaeche — genau das Bild, das v5.1.1
      // bot. Hier wird er eingesammelt.
      const kaputt = [];
      window.addEventListener('error', (e) => kaputt.push(String(e.message || e.error)));
      window.addEventListener('unhandledrejection', (e) => {
        const g = String((e.reason && e.reason.message) || e.reason || '');
        if (!/kein Server/.test(g)) kaputt.push(g);
      });

      const schluss = () => {
        const d = document.createElement('div');
        d.className = 'summe ' + (schlecht ? 'weg' : 'gut');
        d.textContent = schlecht
          ? gut + ' gut, ' + schlecht + ' SCHLECHT'
          : gut + ' Prüfungen gut, 0 schlecht.';
        zeilen.appendChild(d);
        document.querySelector('#bericht h3').textContent =
          'Die echte Seite — ' + (schlecht ? 'da stimmt etwas nicht' : 'alles in Ordnung');
        window.wbErgebnis = {gut: gut, schlecht: schlecht, kaputt: kaputt};
        console.log('[Werkbank] ' + gut + ' gut, ' + schlecht + ' schlecht');
      };

      (async () => {
        melden('lauf', 'Die Anwendung fährt hoch');
        const wurzel = await warten(() => {
          const r = document.getElementById('root');
          return r && r.querySelector('*') ? r : null;
        });
        if (!ja('Die Anwendung zeichnet sich', !!wurzel,
                'nichts im #root — in der Konsole steht, warum')) return schluss();
        ja('Das Ladebild ist weg',
           document.getElementById('loading').style.display === 'none');

        // ── Die Spielleitung ──
        const dm = await warten(() => knopfMit('🔮 DM'));
        if (!ja('Der Knopf für die Spielleitung steht da', !!dm)) return schluss();
        dm.click();
        if (!ja('Der DM-Modus geht auf', !!(await warten(() => knopfMit('🔮 aus')))))
          return schluss();

        // ── Die Fensterleiste vom letzten Mal ──
        const eintragL = (t) => [...document.querySelectorAll('.fl-eintrag')].find(e => e.textContent.includes(t));
        const dbE = await warten(() => eintragL('Datenbank'), 4000);
        ja('Die Datenbank vom letzten Mal steht wieder in der Leiste', !!dbE,
           (document.querySelector('.fl-leiste') || {}).textContent || 'keine Leiste');
        ja('  … minimiert, wie sie lag', !!dbE && dbE.classList.contains('zu'));
        if (dbE) {
          dbE.querySelector('.fl-knopf').click(); await ruhe(200);
          ja('  … zurückgeholt ist sie ein schwebendes Fenster',
             !!document.querySelector('.fl-huelle:not([hidden]) > .form-overlay.schwebend'));
          eintragL('Datenbank').querySelector('.fl-x').click(); await ruhe(200);
          ja('  … und über die Leiste geschlossen', !eintragL('Datenbank'));
        }

        // ── Abenteuerlog und Patchnotes: schwebend, in der Leiste ──
        melden('lauf', 'Abenteuerlog und Patchnotes');
        const logK = knopfMit('📖 Abenteuerlog');
        if (ja('Das Abenteuerlog lässt sich öffnen', !!logK)) {
          logK.click();
          const logOv = await warten(() => [...document.querySelectorAll('.form-overlay')]
            .find(o => /Abenteuerlog/.test(o.textContent)));
          ja('  … ohne Schleier, als schwebendes Fenster', !!logOv && logOv.classList.contains('schwebend'),
             logOv ? logOv.className : 'kein Fenster');
          ja('  … und steht in der Leiste', !!eintragL('Abenteuerlog'));
          const suche = logOv && logOv.querySelector('input');
          if (suche) {
            const setzI = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
            setzI.call(suche, 'Hammer'); suche.dispatchEvent(new Event('input', {bubbles: true}));
            await ruhe(80);
            // Die Anwendung zeichnet neu — hier über den DM-Schalter hin und zurück.
            knopfMit('🔮 aus').click(); await ruhe(150);
            knopfMit('🔮 DM').click(); await ruhe(250);
            const suche2 = [...document.querySelectorAll('.form-overlay')].find(o => /Abenteuerlog/.test(o.textContent));
            ja('  … die Suche übersteht ein Neuzeichnen der Anwendung',
               !!suche2 && suche2.querySelector('input').value === 'Hammer',
               suche2 ? '„' + suche2.querySelector('input').value + '"' : 'Fenster weg');
          }
          const miniL = document.querySelector('.form-overlay.schwebend .fl-mini');
          if (miniL) { miniL.click(); await ruhe(150); }
          ja('  … minimiert', eintragL('Abenteuerlog') && eintragL('Abenteuerlog').classList.contains('zu'));
          knopfMit('📖 Abenteuerlog').click(); await ruhe(150);
          ja('  … der Knopf in der Seitenleiste holt es zurück',
             eintragL('Abenteuerlog') && eintragL('Abenteuerlog').classList.contains('offen'));
          const xL = eintragL('Abenteuerlog') && eintragL('Abenteuerlog').querySelector('.fl-x');
          if (xL) { xL.click(); await ruhe(150); }
          ja('  … und über die Leiste geschlossen', !eintragL('Abenteuerlog'));
        }
        const verK = document.querySelector('.app-version');
        if (verK) {
          verK.click();
          const pn = await warten(() => document.querySelector('.form-overlay .pn-fenster'));
          ja('„Was sich geändert hat" schwebt und steht in der Leiste',
             !!pn && pn.closest('.form-overlay').classList.contains('schwebend') && !!eintragL('Was sich geändert'));
          const xP = eintragL('Was sich geändert') && eintragL('Was sich geändert').querySelector('.fl-x');
          if (xP) { xP.click(); await ruhe(150); }
        }

        // ── Der Held ──
        const held = await warten(() =>
          [...document.querySelectorAll('*')].find(e =>
            e.children.length === 0 && (e.textContent || '').trim() === WB_HELD.name));
        if (!ja('Der Held steht in der Liste', !!held)) return schluss();
        held.click();
        if (!ja('Sein Bogen geht auf', !!(await warten(() => document.querySelector('.sheet')))))
          return schluss();

        // ── Und jetzt der Knopf, um den es geht ──
        const alsText = await warten(() => knopfMit('Als Text'));
        if (!ja('„Als Text" steht im Kopf des Bogens', !!alsText,
                'er steht nur im DM-Modus')) return schluss();

        const vorher = kaputt.length;
        alsText.click();
        await ruhe(150);
        ja('Der Klick wirft keinen Fehler', kaputt.length === vorher,
           kaputt.slice(vorher).join(' · '));

        const feld = await warten(() => document.querySelector('.hb-text-feld'));
        ja('„Als Text" schwebt und steht in der Leiste',
           !!document.querySelector('.form-overlay.schwebend .hb-text-feld') && !!eintragL('Als Text'));
        if (!ja('Das Textfenster geht auf', !!feld,
                'genau das tat es bis v5.3.5 nicht')) return schluss();

        // ── Was darin steht ──
        const text = feld.value || '';
        ja('Der Text nennt den Helden', text.indexOf(WB_HELD.name.toUpperCase()) >= 0);
        ja('  … und trägt die Ausgabe', text.indexOf(HB_VERSION) >= 0,
           (text.split('\n')[7] || '').trim());
        // Kettenhemd 16, schwere Ruestung — Geschick zaehlt nicht mit.
        ja('  … die Rüstungsklasse ist gerechnet, nicht abgeschrieben',
           /Rüstungsklasse\s+16/.test(text),
           ((text.match(/Rüstungsklasse.*/) || [''])[0]).trim());
        ja('  … alle achtzehn Fertigkeiten stehen da',
           SKILLS.every(s => text.indexOf(s.label) >= 0));
        ja('  … die Waffe mit Angriff und Schaden',
           /Kriegshammer/.test(text) && /Angriff \+6 · Schaden 1W8 \+ 3/.test(text),
           ((text.match(/Angriff.*/) || [''])[0]).trim());
        ja('  … das Merkmal mit seinem ganzen Text',
           text.indexOf('Einmal je Rast eine zusätzliche Aktion.') >= 0);
        ja('  … das Getragene', text.indexOf('Kettenhemd') >= 0);
        ja('  … und das Inventar nicht', text.indexOf('INVENTAR') < 0);

        // ── Markiert, ohne dass jemand etwas tut ──
        ja('Der ganze Text ist markiert',

        // ── Der Kopierknopf ──
        // Die Zwischenablage laesst sich hier nicht verlaesslich

        const kopf = knopfMit('Alles kopieren');
        if (ja('Der Kopierknopf steht da', !!kopf)) {
          const echt = Object.getOwnPropertyDescriptor(navigator, 'clipboard');
          const echtExec = document.execCommand;
          const stellen = (klappt) => {
            Object.defineProperty(navigator, 'clipboard', {configurable: true,
              value: {writeText: () => klappt ? Promise.resolve()
                                              : Promise.reject(new Error('abgelehnt'))}});
            document.execCommand = () => klappt;
          };

          stellen(true);
          kopf.click(); await ruhe(200);
          ja('Klappt es, wird er grün und sagt es',
             /Zwischenablage/.test(kopf.textContent) && kopf.className.indexOf('gut') >= 0,

          await ruhe(4300);
          ja('  … und fällt danach zurück', /Alles kopieren/.test(kopf.textContent),
             kopf.textContent.trim());

          stellen(false);
          kopf.click(); await ruhe(200);
          ja('Klappt es nicht, sagt er auch das',
             /Ging nicht/.test(kopf.textContent) && kopf.className.indexOf('weg') >= 0,
             kopf.textContent.trim());
          ja('  … und nennt den Weg über die Tastatur',
             !!document.querySelector('.hb-text-weg'));

          document.execCommand = echtExec;
          if (echt) { try { Object.defineProperty(navigator, 'clipboard', echt); } catch (e) {} }

        // ── Minimieren und über den Knopf im Kopf zurück ──
        const miniT = document.querySelector('.form-overlay.schwebend .fl-mini');

          await ruhe(120);
          ja('  … wer „Als Text" antippt, holt es nach vorn', zVon('.hb-text-feld') > zVon('.automat-schirm'),
             zVon('.hb-text-feld') + ' / ' + zVon('.automat-schirm'));
          const gem = JSON.parse(wbSpeicher.hb_fensterleiste || '{}');
          ja('Das Gerät merkt sich, was offen ist und was vorn liegt',
             (gem.offen || []).includes('taverne') && (gem.offen || []).includes('heldtext')
             && (gem.vorne || [])[(gem.vorne || []).length - 1] === 'heldtext', JSON.stringify(gem));
          eintragL('Taverne').querySelector('.fl-x').click(); await ruhe(150);
        }

        // ── Zu und wieder auf ──
        const zu = knopfMit('Schließen');
        if (ja('Es lässt sich schließen', !!zu)) {
          zu.click(); await ruhe(150);
          ja('  … und ist dann weg', !document.querySelector('.hb-text-feld'));
          const nochmal = knopfMit('Als Text');
          if (nochmal) { nochmal.click(); await ruhe(200); }
          ja('  … und geht ein zweites Mal auf',
             !!document.querySelector('.hb-text-feld'));
        }

        const zuText = knopfMit('Schließen');
        if (zuText) { zuText.click(); await ruhe(150); }

        // ── Der Laden ──────────────────────────────────────────────
        // Dieselbe Frage wie beim Bogen: kommt an, was eingefügt wird?
        // Der Leser dafür ist in laden-test.js geprüft — hier geht es
        // darum, dass das Fenster ihn auch benutzt und die Zeilen
        // hinterher dastehen.
        melden('lauf', 'Der Laden');
        const laden = await warten(() => knopfMit('🏪'));
        if (ja('Der Laden steht der Spielleitung offen', !!laden)) {
          laden.click();
          await warten(() => document.querySelector('.laden-fenster'));
          ja('  … als schwebendes Fenster in der Leiste',
             !!document.querySelector('.form-overlay.schwebend .laden-fenster') && !!eintragL('Laden'));
          const aendern = await warten(() => knopfMit('Auslage ändern'));
          if (ja('  … und lässt sich ändern', !!aendern)) {
            aendern.click();
            const einfuegen = await warten(() => knopfMit('Auslage einfügen'));
            if (ja('Der Knopf zum Einfügen steht da', !!einfuegen)) {
              einfuegen.click(); await ruhe(120);
              const feldEin = document.querySelector('.liste-roh');
              if (ja('  … und macht ein Feld auf', !!feldEin)) {
                // So schreibt React seine Felder: der Wert muss über den
                // Setter des Prototyps kommen, sonst merkt es nichts.
                const setzer = Object.getOwnPropertyDescriptor(
                  window.HTMLTextAreaElement.prototype, 'value').set;
                setzer.call(feldEin, [
                  'Laden: Bogens Krämerladen',
                  'Kauft zu 40 %',
                  'Fackel | 1 KM | brennt eine Stunde',
                  'Seil aus Hanf (15 m) | 1 GM',
                  'Trank der Heilung | 50 GM | letztes Stück',
                ].join('\n'));
                feldEin.dispatchEvent(new Event('input', {bubbles: true}));
                await ruhe(80);
                const nehmen = knopfMit('Übernehmen');
                if (ja('  … und einen Knopf zum Übernehmen', !!nehmen)) {
                  nehmen.click(); await ruhe(200);
                  const felder = [...document.querySelectorAll('.laden-bearbeiten input')]
                    .map(i => i.value);
                  ja('Die drei Waren stehen in den Zeilen',
                     felder.indexOf('Fackel') >= 0
                     && felder.indexOf('Seil aus Hanf (15 m)') >= 0
                     && felder.indexOf('Trank der Heilung') >= 0,
                     felder.filter(Boolean).join(' | '));
                  ja('  … mit ihren Preisen in Gold',
                     felder.indexOf('0,01') >= 0 && felder.indexOf('1') >= 0
                     && felder.indexOf('50') >= 0,
                     felder.filter(Boolean).join(' | '));
                  ja('  … und der Notiz dazu',
                     felder.indexOf('brennt eine Stunde') >= 0);
                  const kopfFelder = [...document.querySelectorAll('.beute-neu input')]
                    .map(i => i.value);
                  ja('Der Name des Ortes ist übernommen',
                     kopfFelder.indexOf('Bogens Krämerladen') >= 0,
                     kopfFelder.slice(0, 3).join(' | '));
                  ja('  … und der Ankauf', kopfFelder.indexOf('40') >= 0);
                }
              }
            }
          }
        }

        // ── Abräumen ───────────────────────────────────────────────
        // Der Ort muss danach wirklich weg sein — nicht nur das Fenster
        // zu. Geprüft wird deshalb, was die Leiste hinterher anbietet.
        const speichern = knopfMit('Speichern');
        if (ja('Die Auslage lässt sich speichern', !!speichern)) {
          speichern.click(); await ruhe(250);
          const name = await warten(() => knopfMit('Bogens Krämerladen'));
          ja('Der Ort steht mit seinem Namen in der Leiste', !!name,
             'gefunden: ' + [...document.querySelectorAll('.btn-tool')]
               .map(b => b.textContent.trim()).join(' · '));
          if (name) { name.click(); await ruhe(200); }

          // ── Zwei Reiter ──
          const reiter = [...document.querySelectorAll('.laden-reiter [role=tab]')];
          ja('Das Fenster hat zwei Reiter', reiter.length === 2,
             reiter.map(r => r.textContent.trim()).join(' · '));
          if (reiter.length === 2) {
            const zeilenText = () => [...document.querySelectorAll('.laden-fenster .beute-stueck')]
              .map(z => z.textContent).join(' | ');
            ja('  … „Kaufen" ist vorn und zeigt die Auslage',
               reiter[0].getAttribute('aria-selected') === 'true'
               && /Trank der Heilung/.test(zeilenText()) && !/Kettenhemd/.test(zeilenText()),
               zeilenText());
            reiter[1].click(); await ruhe(120);
            ja('  … „Verkaufen" zeigt das Inventar statt der Auslage',
               /Kettenhemd/.test(zeilenText()) && !/Trank der Heilung/.test(zeilenText()),
               zeilenText());
            ja('  … mit dem Ankauf des Ortes',
               /zahlt 40 %/.test((document.querySelector('.laden-kauft') || {}).textContent || ''));
            // Das Kettenhemd führt der Laden nicht — sein Gebot kommt aus
            // dem Wert am Stück: 50 GM, davon 40 %.
            const gebotFeld = document.querySelector('.laden-fenster .laden-preis');
            ja('  … das Gebot fürs Kettenhemd kommt aus seinem Wert',
               !!gebotFeld && gebotFeld.value === '20', gebotFeld ? gebotFeld.value : 'kein Feld');
            ja('  … und der Wert steht dabei', /Wert 50 GM/.test(zeilenText()), zeilenText());
            reiter[0].click(); await ruhe(120);
            ja('  … und zurück', /Trank der Heilung/.test(zeilenText()));
          }

          const raeumen = knopfMit('Abräumen');
          if (ja('Der Knopf zum Abräumen steht da', !!raeumen)) {
            raeumen.click(); await ruhe(150);
            // Er fragt nach, bevor eine Viertelstunde Arbeit fortfliegt.
            const frage = [...document.querySelectorAll('*')].some(
              e => e.children.length === 0 && /abräumen\?/i.test(e.textContent || ''));
            ja('  … und fragt vorher nach', frage);
            // Der Knopf in der Rückfrage heisst genauso wie der, der sie
            // ausgelöst hat. Ihn über die Aufschrift zu suchen, fände
            // wieder den ersten — und dann öffnete sich die Frage nur
            // erneut. Hier zählt, welcher es ist.
            const ok = document.querySelector('.confirm-ok');
            if (ja('  … mit einem Knopf, der sie beantwortet', !!ok)) {
              ok.click(); await ruhe(300);
            }
            ja('  … danach ist der Ort namenlos',
               !knopfMit('Bogens Krämerladen'),
               [...document.querySelectorAll('.btn-tool')]
                 .map(b => b.textContent.trim()).join(' · '));
            ja('  … das Fenster ist zu', !document.querySelector('.laden-bearbeiten')
               && !knopfMit('Auslage ändern'));
            // Fuer die Spielleitung bleibt der Weg hinein: sie stellt den
            // naechsten Ort hin. Die Runde sieht ihn nicht mehr.
            ja('  … der Weg zum nächsten Ort bleibt offen', !!knopfMit('🏪'));
            if (knopfMit('🏪')) {
              knopfMit('🏪').click(); await ruhe(200);
              const leer = [...document.querySelectorAll('.laden-ware, .beute-zeilen')].length;
              ja('  … und die Auslage ist leer', leer === 0,
                 leer + ' Zeilen noch da');
              const zuLaden = knopfMit('Schließen');
              if (zuLaden) { zuLaden.click(); await ruhe(120); }
            }
          }
        }

        // ── Beute mit Wert ─────────────────────────────────────────
        melden('lauf', 'Beute mit Wert');
        const beuteK = await warten(() => [...document.querySelectorAll('.btn-tool')]
          .find(b => /Beute/.test(b.textContent)));
        if (ja('Die Spielleitung kann Beute hinlegen', !!beuteK)) {
          beuteK.click();
          const ein = await warten(() => [...document.querySelectorAll('button')]
            .find(b => /einfügen/i.test(b.textContent) && b.closest('.form-modal')));
          if (ja('  … und eine Liste einfügen', !!ein)) {
            ein.click(); await ruhe(120);
            const feldB = document.querySelector('.liste-roh');
            const setzT = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
            setzT.call(feldB, 'Ring des Schutzes | schimmert blau | 350 GM\n8x Fackel');
            feldB.dispatchEvent(new Event('input', {bubbles: true}));
            await ruhe(80);
            knopfMit('Übernehmen').click(); await ruhe(200);
            const werte = [...document.querySelectorAll('.beute-wert')].map(i => i.value);
            ja('Der Wert steht in der Zeile des Rings', werte[0] === '350', werte.join(' | '));
            ja('  … die Fackeln bleiben ohne', werte[1] === '', werte.join(' | '));
          }
          const abb = [...document.querySelectorAll('.form-modal button')].find(b => /Abbrechen/.test(b.textContent));
          if (abb) { abb.click(); await ruhe(120); }
        }

        // ── Der Kampf: das Zugfenster ──────────────────────────────
        // Zwei Dinge vom Spielabend: ein Merkmal ohne Ziel kommt ins
        // Protokoll, und ein Zustand am Gegner lässt sich gleich im
        // Zugfenster setzen. Geprüft wird am Speicher, denn dorthin
        // schreibt der Tracker — und am Schirm.
        melden('lauf', 'Der Kampf');
        const kampfStand = () => JSON.parse(wbSpeicher.hb_kampf || 'null') || {};
        const logText = () => (kampfStand().log || []).map(e => protokollZeile(e, true)).join('\n');
        const kampfKnopf = await warten(() => knopfMit('⚔ Kampf'));
        if (ja('Der Tracker steht der Spielleitung offen', !!kampfKnopf)) {
          kampfKnopf.click();
          const zug = await warten(() => knopfMit('Zug eintragen'));
          if (ja('Brunhilde ist am Zug, der Knopf steht da', !!zug)) {
            zug.click();
            const merkmal = await warten(() => knopfMit('⭐ Merkmal'));
            if (ja('Das Zugfenster bietet Merkmale an', !!merkmal && !merkmal.disabled)) {
              merkmal.click(); await ruhe(80);
              const eintrag = await warten(() => [...document.querySelectorAll('.zug-zeile')]
                .find(z => /Aktionsschub/.test(z.textContent)));
              if (ja('  … Aktionsschub steht zur Wahl', !!eintrag)) {
                eintrag.click(); await ruhe(100);
                const besch = document.querySelector('.zug-beschreibung');
                ja('Die Beschreibung des Merkmals steht im Fenster',
                   !!besch && /zusätzliche Aktion/.test(besch.textContent));
                const ueber = document.querySelector('.zug-fuss .btn-save');
                ja('Ohne Ziel lässt es sich trotzdem übernehmen', !!ueber && !ueber.disabled,
                   'bis v5.4.1 blieb der Knopf grau');
                ja('  … die Vorschau nennt es',
                   /Merkmal: Aktionsschub/.test((document.querySelector('.zug-vorschau') || {}).textContent || ''));
                if (ueber && !ueber.disabled) {
                  ueber.click(); await ruhe(300);
                  ja('  … und es steht im Protokoll', /Merkmal: Aktionsschub/.test(logText()),
                     logText().split('\n').slice(-3).join(' / '));
                }
              }
            }
          }

          // Derselbe Zug, zweite Handlung: der Goblin geht zu Boden.
          const zug2 = await warten(() => knopfMit('Zug eintragen'));
          if (zug2) {
            zug2.click();
            const ziel = await warten(() => [...document.querySelectorAll('.zug-ziel')]
              .find(z => /Goblin/.test(z.textContent)));
            if (ja('Der Goblin lässt sich als Ziel wählen', !!ziel)) {
              ziel.click(); await ruhe(100);
              const zk = await warten(() => document.querySelector('.zug-zust-knopf'));
              if (ja('  … und hat einen Knopf für Zustände', !!zk)) {
                zk.click(); await ruhe(80);
                const liegend = [...document.querySelectorAll('.zug-zustaende .zust-chip')]
                  .find(b => b.textContent.trim() === 'Liegend');
                if (ja('  … „Liegend" steht zur Wahl', !!liegend)) {
                  liegend.click(); await ruhe(80);
                  ja('  … angetippt ist er markiert',
                     liegend.classList.contains('an') && liegend.classList.contains('neu'));
                  ja('  … und die Vorschau sagt es',
                     /Goblin ist Liegend/.test((document.querySelector('.zug-vorschau') || {}).textContent || ''));
                  liegend.click(); await ruhe(60);
                  // Der Knopf bleibt dabei offen: ein angekreuztes Ziel ist im
                  // Angriff schon „Treffer" — also zählt die Vorschau.
                  ja('Zweimal angetippt ist nichts geändert',
                     !liegend.classList.contains('an')
                     && !/Liegend/.test((document.querySelector('.zug-vorschau') || {}).textContent || ''));
                  liegend.click(); await ruhe(60);
                  const ueber2 = document.querySelector('.zug-fuss .btn-save');
                  ja('Nur ein Zustand reicht zum Übernehmen', !!ueber2 && !ueber2.disabled);
                  if (ueber2 && !ueber2.disabled) {
                    ueber2.click(); await ruhe(300);
                    const gob = (kampfStand().teilnehmer || []).find(t => t.id === 'wb-goblin') || {};
                    ja('  … der Goblin liegt jetzt', (gob.zustaende || []).indexOf('Liegend') >= 0,
                       JSON.stringify(gob.zustaende));
                    ja('  … einmal, nicht doppelt', (gob.zustaende || []).length === 1);
                    ja('  … und das Protokoll sagt es einmal',
                       (logText().match(/Goblin ist Liegend/g) || []).length === 1,
                       logText().split('\n').slice(-3).join(' / '));
                    ja('  … die Kampfzeile zeigt ihn',
                       [...document.querySelectorAll('.kampf-zustand')].some(b => /Liegend/.test(b.textContent)));
                  }
                }
              }
            }
          }
          // ── Die Frage vor dem Eintragen ──
          // Ein angekreuztes Ziel ohne Schaden: der Zug geht durch, aber
          // erst, nachdem einmal gefragt wurde.
          melden('lauf', 'Plausibilität');
          const zugP = await warten(() => knopfMit('Zug eintragen'));
          if (ja('Das Zugfenster geht wieder auf', !!zugP)) {
            zugP.click();
            const zielP = await warten(() => [...document.querySelectorAll('.zug-ziel')]
              .find(z => /Goblin/.test(z.textContent)));
            if (ja('Ein Ziel lässt sich ankreuzen', !!zielP)) {
              zielP.click(); await ruhe(150);
              // Ein Ziel allein wäre gar kein Eintrag — der Knopf bliebe
              // grau. Mit einem Satz daneben wird es einer, nur eben
              // einer, bei dem am Ziel nichts geschieht.
              const freiF = document.querySelector('.zug-frei');
              const setzT = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
              setzT.call(freiF, 'Er holt aus.'); freiF.dispatchEvent(new Event('input', {bubbles: true}));
              await ruhe(150);
              ja('  … der Fuß sagt schon, dass etwas fehlt',
                 /unfertig/.test(document.querySelector('.zug-fuss .zug-hinweis').textContent),
                 document.querySelector('.zug-fuss .zug-hinweis').textContent);
              const zeilenVorher = logText().split('\n').length;
              document.querySelector('.zug-fuss .btn-save').click(); await ruhe(200);
              const frage = document.querySelector('.zug-pruefung');
              ja('Ohne Schaden wird erst gefragt', !!frage && /Goblin/.test(frage.textContent),
                 frage ? frage.textContent.slice(0, 90) : 'keine Frage');
              ja('  … und nichts steht im Protokoll', logText().split('\n').length === zeilenVorher);
              const zurueckP = [...document.querySelectorAll('.zug-pruefung button')]
                .find(b => /Zurück/.test(b.textContent));
              if (ja('  … „Zurück" lässt die Eingabe stehen', !!zurueckP)) {
                zurueckP.click(); await ruhe(150);
                ja('  … die Frage ist weg, das Ziel noch angekreuzt',
                   !document.querySelector('.zug-pruefung')
                   && !!document.querySelector('.zug-ziel.an'));
              }
              document.querySelector('.zug-fuss .btn-save').click(); await ruhe(200);
              const trotzdem = [...document.querySelectorAll('.zug-pruefung button')]
                .find(b => /Trotzdem/.test(b.textContent));
              if (ja('Daneben steht „Trotzdem eintragen"', !!trotzdem)) {
                trotzdem.click(); await ruhe(300);
                ja('  … und dann geht der Zug durch',
                   !document.querySelector('.zug-fenster'),
                   'das Fenster steht noch offen');
                // Der Probezug war nur zum Vorführen: zurücknehmen, damit
                // die nächsten Prüfungen denselben Stand vorfinden.
                const rueckP = document.querySelector('.kampf-rueck');
                if (rueckP && !rueckP.disabled) { rueckP.click(); await ruhe(400); }
                ja('  … und er lässt sich wieder zurücknehmen',
                   /Zurückgenommen: „Er holt aus/.test(logText()),
                   logText().split('\n').slice(-2).join(' / '));
              }
            }
          }

          // ── Rückgängig ──
          melden('lauf', 'Rückgängig');
          const rueck = document.querySelector('.kampf-rueck');
          if (ja('Der Knopf zum Zurücknehmen steht im Kopf', !!rueck && !rueck.disabled)) {
            rueck.click(); await ruhe(300);
            const gob2 = (kampfStand().teilnehmer || []).find(t => t.id === 'wb-goblin') || {};
            ja('Der Goblin liegt nicht mehr', (gob2.zustaende || []).length === 0,
               JSON.stringify(gob2.zustaende));
            ja('  … und das Protokoll sagt, was zurückgenommen wurde',
               /Zurückgenommen: .*Goblin ist Liegend/.test(logText()),
               logText().split('\n').slice(-2).join(' / '));
            ja('  … die Zeile „ist Liegend" selbst ist fort',
               !/^\s*Goblin ist Liegend/m.test(logText()));
          }
          // Schaden an einem Helden geht in den Bogen — und von dort zurück.
          const tpHeld = () => (JSON.parse(wbSpeicher.dnd_chars || '[]')[0] || {}).hp;
          const zeileHeld = [...document.querySelectorAll('.kampf-liste > *')]
            .find(z => /Brunhilde/.test(z.textContent));
          const minus5 = zeileHeld && [...zeileHeld.querySelectorAll('button')]
            .find(b => b.textContent.trim() === '-5' || b.textContent.trim() === '−5');
          if (ja('Brunhilde hat ihre Schnelltasten', !!minus5)) {
            const vorher = tpHeld();
            minus5.click();
            const nach = await warten(() => tpHeld() !== vorher ? tpHeld() : null, 3000);
            ja('  … −5 kommt im Bogen an', nach === vorher - 5, vorher + ' → ' + nach);
            document.querySelector('.kampf-rueck').click();
            const wieder = await warten(() => tpHeld() === vorher ? true : null, 3000);
            ja('  … und Zurücknehmen stellt die TP im Bogen wieder her', !!wieder,
               'jetzt ' + tpHeld() + ', vorher ' + vorher);
            ja('  … ohne Rückfrage, denn niemand sonst hat gedreht',
               // Die Werkbank meldet daneben, dass sie nichts speichern
               // kann — gesucht wird deshalb nach dem Wortlaut der Frage.
               ![...document.querySelectorAll('#root *')].some(e => e.children.length === 0
                 && /Trotzdem auf den Stand davor/.test(e.textContent || '')));
          }
          // ── Ein Zauber, der lähmt ──
          melden('lauf', 'Zauber mit Zustand');

          // ── Ein Merkmal, das einen Zauber auslöst ──

          // ── Erschöpfung: aus dem Bogen, in den Bogen ──
          melden('lauf', 'Erschöpfung im Tracker');

              ja('  … Zurücknehmen nimmt sie aus dem Bogen', !!null0, 'Bogen: ' + bogenErsch());

          // ── Eine Wirkung läuft ab ──

          const weiterK = knopfMit('Nächster');
          if (ja('Weiter zum Goblin', !!weiterK)) {

            const zg = await warten(() => knopfMit('Zug eintragen'));

                const nameF = document.querySelector('.zug-lauf-name');
                setzI.call(nameF, 'Netz'); nameF.dispatchEvent(new Event('input', {bubbles: true}));
                const rundenF = document.querySelector('.zug-lauf .zug-zahl');

            ja('In Runde 2 bei Brunhilde läuft das Netz noch',

            knopfMit('Nächster').click(); await ruhe(300);

            ja('  … und das Protokoll sagt es', /Netz endet \(Goblin\)/.test(logText()),

            ja('Person festhalten läuft weiter',

            mini.click(); await ruhe(120);
            knopfMit('⚔ Kampf').click(); await ruhe(150);
            ja('  … auch über den Knopf in der Seitenleiste', sichtbarF(document.querySelector('.kampf-schirm')));

              eintrag('Karte').querySelector('.fl-x').click(); await ruhe(150);
              ja('  … ✕ in der Leiste schließt die Karte', !eintrag('Karte') && !document.querySelector('.sf-fenster'));
            }
          }
          const xLeiste = eintrag('Kampftracker') && eintrag('Kampftracker').querySelector('.fl-x');
          if (xLeiste) { xLeiste.click(); await ruhe(150); }
          ja('✕ in der Leiste schließt den Tracker', !document.querySelector('.kampf-schirm') && !eintrag('Kampftracker'));

          // Die Taverne: minimieren, zurückholen, über die Leiste schließen.

          if (x) { x.click(); await ruhe(150); }

        // ── Der Merkmal-Editor ─────────────────────────────────────
        // ── Waffe ansehen: schwebend, ein Kreuz, minimierbar ──

        const waffeK = await warten(() => document.querySelector('[aria-label="Kriegshammer — Details"]'));
        if (ja('Die Waffe lässt sich ansehen', !!waffeK)) {

             ov ? ov.className : 'kein Fenster');

          const box = ov && ov.querySelector('.fenster');

          if (box && box.getBoundingClientRect().width > 200) {
            ja('  … das nicht am Rand klebt (mindestens 12 Punkte)', rand >= 12, rand + ' Punkte');

            melden('lauf', '  … Abstand zum Rand nicht messbar — die Seite ist nicht sichtbar');

          ja('  … und steht in der Leiste', !!eintragW);
          const miniW = ov && ov.querySelector('.fl-mini');
          if (ja('  … lässt sich minimieren', !!miniW)) {

           && hemd.querySelector('.inv-wert').textContent.trim() === '50',
           hemd ? ((hemd.querySelector('.inv-wert') || {}).textContent || 'kein Wert') : 'keine Karte');

        if (bogen) {

          const plaetze = [...document.querySelectorAll('.gear-slot-btn')];
          ja('Beim fremden Bogen bleiben die Ausrüstungsplätze sichtbar',
             plaetze.length > 0 && plaetze.every(b => getComputedStyle(b).display !== 'none'),
             plaetze.filter(b => getComputedStyle(b).display === 'none').length + ' versteckt');
          ja('  … nur das Wechseln fällt weg',
             [...document.querySelectorAll('.gear-slot-info')].every(b => getComputedStyle(b).display === 'none'));
          bogen.classList.remove('sheet-nur-lesen');

        melden('lauf', 'Abenteuerplaner');

        ja('in der Seitenleiste steht der Weg in den Planer',
           !!planerLink && /^planer\/\?adv=.+/.test(planerLink.getAttribute('href') || ''),
           planerLink ? planerLink.getAttribute('href') : 'kein Link');

        // passende Dialog geht vorbelegt auf.
        melden('lauf', 'Aufträge aus dem Planer');
        const auftrag = (a) => {
          localStorage.setItem('hb_planer_auftrag', JSON.stringify({ zeit: Date.now(), ...a }));
          window.dispatchEvent(new StorageEvent('storage', { key: 'hb_planer_auftrag' }));
        };
        const dialogZu = async () => {
          const zu = [...document.querySelectorAll('.form-modal button')].find(b => /^Abbrechen$/.test((b.textContent || '').trim()));
          if (zu) zu.click();
          await ruhe(120);
        };
        const titelDa = (t) => [...document.querySelectorAll('.form-title')].find(x => (x.textContent || '').includes(t));
        auftrag({ id: 'a_probe1', art: 'probe', probeArt: 'rw', wert: 'con', sg: 13, text: 'Gewaltmarsch, Stunde 11' });
        const probeTitel = await warten(() => titelDa('Probe ansagen'), 3000);
        ja('ein Gewaltmarsch aus dem Planer öffnet „Probe ansagen“', !!probeTitel);
        if (probeTitel) {
          const modal = probeTitel.closest('.form-modal');
          ja('  … als KO-Rettungswurf, SG 13, mit Text',
             [...modal.querySelectorAll('select')].some(s => s.value === 'con')
             && [...modal.querySelectorAll('input')].some(i => i.value === '13')
             && [...modal.querySelectorAll('input, textarea')].some(i => i.value === 'Gewaltmarsch, Stunde 11'));
          await dialogZu();

        const quittung = JSON.parse(localStorage.getItem('hb_planer_quittung') || 'null');
        ja('  … der Planer bekommt seine Quittung, der Auftrag ist verbraucht',
           !!quittung && quittung.id === 'a_probe1' && !localStorage.getItem('hb_planer_auftrag'));
        auftrag({ id: 'a_rast1', art: 'rast', rastArt: 'lang', basis: 2, niederschlag: 'regen', temperatur: 'kalt', wind: 'stark', massnahmen: [], text: 'Lager nach Reisetag 3' });
        const rastTitel = await warten(() => titelDa('Rast ansagen'), 3000);
        ja('„Lager aufschlagen“ öffnet „Rast ansagen“ mit dem Text', !!rastTitel
           && [...rastTitel.closest('.form-modal').querySelectorAll('input, textarea')].some(i => i.value === 'Lager nach Reisetag 3'));
        if (rastTitel) {
          const sel = [...rastTitel.closest('.form-modal').querySelectorAll('select')].map(s => s.value);
          ja('  … und das Wetter des Reisetags, wo die Regel es abfragt', sel.length === 0 || (sel.includes('regen') && sel.includes('kalt') && sel.includes('stark')), sel.join(','));
          await dialogZu();
        }
        auftrag({ id: 'a_zeit1', art: 'zeit', stunden: 30 });
        const zeitTitel = await warten(() => titelDa('Zeit vergeht'), 3000);
        ja('„Chronik: +1 Tag“ öffnet „Zeit vergeht“ mit 1 Tag 6 Stunden', !!zeitTitel
           && [...zeitTitel.closest('.form-modal').querySelectorAll('input')].map(i => i.value).join(',').startsWith('1,6'),
           zeitTitel ? [...zeitTitel.closest('.form-modal').querySelectorAll('input')].map(i => i.value).join(',') : 'kein Dialog');
        if (zeitTitel) await dialogZu();
        auftrag({ id: 'a_kampf1', art: 'kampf', begegnungId: 'enc_wb', name: 'Wolfsrudel' });
        const frage = await warten(() => [...document.querySelectorAll('.confirm-msg')].find(m => /Wolfsrudel/.test(m.textContent)), 4000);
        ja('eine Zufallsbegegnung aus dem Planer öffnet den Kampftracker und fragt, ob sie geladen wird',
           !!frage && !!document.querySelector('.kampf-kopf-x'), frage ? '' : 'keine Frage');
        const abbr = document.querySelector('.confirm-cancel');
        if (abbr) { abbr.click(); await ruhe(120); }
        const kx = document.querySelector('.kampf-kopf-x');
        if (kx) { kx.click(); await ruhe(150); }
        auftrag({ id: 'a_kampf2', art: 'kampf', begegnungId: 'enc_gibtsnicht', name: 'Geister' });
        const hinweis = await warten(() => [...document.querySelectorAll('.confirm-msg')].find(m => /Geister/.test(m.textContent)), 4000);
        ja('  … eine unbekannte Begegnung wird erklärt, nicht verschluckt', !!hinweis && /nicht \(mehr\)/.test(hinweis.textContent));
        const ok = document.querySelector('.confirm-ok');
        if (ok) { ok.click(); await ruhe(120); }
        const kx2 = document.querySelector('.kampf-kopf-x');
        if (kx2) { kx2.click(); await ruhe(150); }
        auftrag({ id: 'a_alt1', art: 'zeit', stunden: 5, zeit: Date.now() - 40 * 60 * 1000 });
        await ruhe(300);
        ja('ein Auftrag älter als eine halbe Stunde bleibt liegen', !titelDa('Zeit vergeht'));
        localStorage.removeItem('hb_planer_auftrag');
        localStorage.removeItem('hb_planer_quittung');

        melden('lauf', 'Merkmal bearbeiten');
        const reiterM = await warten(() => [...document.querySelectorAll('button')]
          .find(b => /Merkmale/.test(b.textContent)));
        if (ja('Der Reiter Merkmale steht da', !!reiterM)) {
          reiterM.click(); await ruhe(200);
          const karte = [...document.querySelectorAll('.feature-card')].find(k => /Bannstrahl/.test(k.textContent));
          const sichtbar = (el) => !!el && el.offsetParent !== null;
          // ── Der Bearbeitungsmodus ──
          // Ohne ihn ist der Bogen zum Lesen: kein Stift an der Karte,
          // das Zahnrad der Leiste gesperrt, keine Abschnittsknöpfe.
          ja('Ohne Bearbeitungsmodus kein Stift an der Karte', !sichtbar(karte && karte.querySelector('.spell-edit-btn')));
          ja('  … das Zahnrad der Leiste ist gar nicht da', !document.querySelector('.leiste-zahnrad'));
          ja('  … und nichts zum Hinzufügen', !sichtbar(knopfMit('Fähigkeit hinzufügen'))
             && ![...document.querySelectorAll('.prof-neu')].some(sichtbar));
          ja('  … und es gibt keine Bearbeiten-Knöpfe in den Abschnitten',
             !document.querySelector('.sheet .panel-edit-btn'));
          const kopfB = [...document.querySelectorAll('.kopf-knopf')].find(b => /Bearbeiten/.test(b.textContent));
          if (ja('Im Kopf steht Bearbeiten', !!kopfB)) {
            kopfB.click(); await ruhe(150);
            ja('  … er schaltet auf Fertig', /Fertig/.test(kopfB.textContent));
            ja('  … daneben stehen die Stammdaten',
               [...document.querySelectorAll('.kopf-knopf')].some(b => /Stammdaten/.test(b.textContent)));
            ja('  … das Zahnrad ist da', !!document.querySelector('.leiste-zahnrad'));
            ja('  … und Hinzufügen auch', sichtbar(knopfMit('Fähigkeit hinzufügen')));
          }
          // Beschreibungen kommen aus dem Rich-Text-Editor. Bis v5.18 standen
          // die Auszeichnungen als Text im Bogen.
          const karteA = [...document.querySelectorAll('.feature-card')].find(k => /Aktionsschub/.test(k.textContent));
          if (karteA) {
            karteA.click(); await ruhe(150);
            const beschA = karteA.querySelector('.feature-card-desc');
            ja('Fettschrift im Merkmal wird gesetzt, nicht angezeigt',
               !!beschA && !!beschA.querySelector('b') && !/<b>/.test(beschA.textContent),
               (beschA || {}).textContent || 'keine Beschreibung');
            karteA.click(); await ruhe(120);
          }
          const stift = karte && karte.querySelector('.spell-edit-btn');
          if (ja('  … Bannstrahl lässt sich bearbeiten', sichtbar(stift))) {
            stift.click(); await ruhe(200);
            const selects = [...document.querySelectorAll('.form-modal select')];
            ja('Der Editor zeigt den ausgelösten Zauber',
               selects.some(x => x.value === 'Person festhalten'));
            ja('  … und die verknüpfte Ressource', selects.some(x => x.value === 'r1'));
            const ab = knopfMit('Abbrechen');
            if (ab) { ab.click(); await ruhe(120); }
          }
          const fertigB = [...document.querySelectorAll('.kopf-knopf')].find(b => /Fertig/.test(b.textContent));
          if (fertigB) { fertigB.click(); await ruhe(150); }
          ja('Fertig macht den Bogen wieder zum Lesen', !sichtbar(
            ([...document.querySelectorAll('.feature-card')].find(k => /Bannstrahl/.test(k.textContent)) || document)
              .querySelector('.spell-edit-btn')));
        }

        // ── NSC: der Bogen, der nie in der Heldenauswahl steht ──────
        melden('lauf', 'NSC');
        const listeKnopf = (t) => [...document.querySelectorAll('.char-list button')].find(b => b.textContent.includes(t));
        const nscTab = await warten(() => listeKnopf('🎭 NSC'));
        if (ja('Die Spielleitung hat einen eigenen Reiter für NSC', !!nscTab)) {
          nscTab.click(); await ruhe(150);
          const neu = await warten(() => listeKnopf('freundlich'));
          if (ja('  … und zwei Knöpfe zum Anlegen, je nach Haltung',
                 !!neu && !!listeKnopf('feindlich'))) {
            neu.click(); await ruhe(200);
            const titel = document.querySelector('.form-modal .form-title');
            ja('Der Bogen geht als NSC auf', !!titel && /Neuer NSC/.test(titel.textContent),
               (titel || {}).textContent || 'kein Titel');
            const art = [...document.querySelectorAll('.form-modal select')]
              .find(s => [...s.options].some(o => /NSC/.test(o.textContent)));
            ja('  … mit der Art „NSC, freundlich“', !!art && art.value === 'nsc-freundlich', art ? art.value : 'keine Auswahl');
            const nameFeld = document.querySelector('.form-modal input.form-input');
            if (nameFeld) {
              // React liest nicht el.value, sondern seinen eigenen Stand —
              // ein Wert von Hand kommt nur ueber den Setter des Prototyps an.
              Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set.call(nameFeld, 'Wirt Arik');
              nameFeld.dispatchEvent(new Event('input', {bubbles: true}));
              await ruhe(80);
            }
            const speichern = knopfMit('Speichern');
            if (speichern) { speichern.click(); await ruhe(400); }
            const boegen = () => JSON.parse(wbSpeicher.dnd_chars || '[]');
            const arik = boegen().find(c => c.name === 'Wirt Arik');
            ja('Der NSC ist angelegt', !!arik && arik.npc === true && arik.haltung === 'freundlich',
               JSON.stringify(arik && {npc: arik.npc, haltung: arik.haltung, dmOnly: arik.dmOnly}));
            ja('  … und verborgen wie ein Bogen der Spielleitung', !!arik && arik.dmOnly === true);
            ja('  … er steht in der NSC-Liste',
               [...document.querySelectorAll('.char-item-name')].some(e => /Wirt Arik/.test(e.textContent)));
            const aktivTab = listeKnopf('⚔ Aktiv');
            if (aktivTab) { aktivTab.click(); await ruhe(200); }
            ja('  … aber nicht bei den Helden',
               ![...document.querySelectorAll('.char-item-name')].some(e => /Wirt Arik/.test(e.textContent)));
          }
        }

        // ── Der NSC im Kampf: ein Verbündeter, kein Gegner ──
        const kampfK2 = knopfMit('⚔ Kampf');
        if (kampfK2) {
          kampfK2.click(); await ruhe(300);
          const spalte = await warten(() => document.querySelector('.kampf-seite'));
          const nscKopf = spalte && [...spalte.querySelectorAll('.kampf-seite-kopf')].find(k => /NSC/.test(k.textContent));
          if (ja('Die Spalte des Trackers führt die NSC', !!nscKopf)) {
            const zeile = [...spalte.querySelectorAll('.kampf-seite-held')].find(z => /Wirt Arik/.test(z.textContent));
            ja('  … mit dem NSC darin', !!zeile);
            const plus = zeile && zeile.querySelector('.kampf-seite-plus');
            if (ja('  … und einem Knopf, ihn dazuzunehmen', !!plus)) {
              plus.click(); await ruhe(400);
              const karteN = [...document.querySelectorAll('.kampf-zeile')].find(z => /Wirt Arik/.test(z.textContent));
              ja('Er steht als Verbündeter in der Reihe',
                 !!karteN && karteN.classList.contains('verbuendet') && karteN.classList.contains('held'),
                 karteN ? karteN.className : 'keine Zeile');
              const teil = (JSON.parse(wbSpeicher.hb_kampf || 'null') || {}).teilnehmer || [];
              const eintrag = teil.find(t => t.lager);
              ja('  … im Kampf steht sein Lager', !!eintrag && eintrag.lager === 'verbuendet' && eintrag.art === 'held',
                 JSON.stringify(eintrag || null));
            }
          }
          const zu = knopfMit('✕') || knopfMit('Schließen');
          if (zu) { zu.click(); await ruhe(200); }
        }

        // ── Bögen ein- und auslesen ────────────────────────────────
        melden('lauf', 'Bögen ein- und auslesen');
        const boegenK = knopfMit('📥 Bögen');
        if (ja('In der Seitenleiste steht „Bögen"', !!boegenK)) {
          boegenK.click();
          const fenster = await warten(() => document.querySelector('.bt-fenster'));
          if (ja('  … und öffnet das Fenster', !!fenster)) {
            // Es muss ein richtiges Fenster sein: mit Kopfknöpfen und
            // klickbar. In v5.20.0 stand eine Komponente zwischen Fenster
            // und Kasten — dann fehlten ✕ und —, und jeder Klick ging
            // durch das Fenster hindurch auf den Bogen dahinter.
            ja('  … als richtiges Fenster, mit Zuklappen und Schließen',
               fenster.classList.contains('fenster')
               && fenster.querySelectorAll('.fenster-knoepfe button').length === 2,
               fenster.className + ' · ' + fenster.querySelectorAll('.fenster-knoepfe button').length + ' Knöpfe');
            const zipProbe = [...fenster.querySelectorAll('button')].find(b => /ZIP sichern/.test(b.textContent));
            const zr = zipProbe ? zipProbe.getBoundingClientRect() : null;
            // Der Stapel unter dem Zeiger: der Knopf muss darin vorkommen.
            // Vorher kam er nicht vor — das Fenster nahm gar keinen Klick an.
            const stapelDa = zr && zr.width
              ? document.elementsFromPoint(zr.left + zr.width / 2, zr.top + zr.height / 2) : [];
            ja('  … und Klicks kommen im Fenster an, nicht dahinter',
               stapelDa.includes(zipProbe) && getComputedStyle(fenster).pointerEvents !== 'none',
               stapelDa.slice(0, 3).map(e => e.tagName + '.' + String(e.className).slice(0, 20)).join(' / ') || 'nichts getroffen');
            // Auslesen: der Knopf lädt ein ZIP herunter. Statt es zu
            // speichern, fangen wir den Blob ab und sehen hinein.
            const echtesErzeugen = URL.createObjectURL;
            let gefangen = null;
            URL.createObjectURL = (b) => { gefangen = b; return 'blob:werkbank'; };
            const zipK = knopfMit('Als ZIP sichern');
            if (ja('Es gibt einen Knopf, alle Bögen als ZIP zu sichern', !!zipK && !zipK.disabled)) {
              zipK.click();
              await warten(() => gefangen);
              URL.createObjectURL = echtesErzeugen;
              const drin = gefangen ? (await zipLesen(gefangen)).eintraege.map(e => e.name) : [];
              ja('  … darin liegt je Bogen eine Textdatei',
                 drin.includes('Brunhilde-Eisenfaust.txt') && drin.includes('Wirt-Arik.txt'), drin.join(', '));
              const zip2 = gefangen ? await zipLesen(gefangen) : null;
              const text = zip2 ? new TextDecoder().decode(await zip2.lesen(zip2.finden('Brunhilde-Eisenfaust.txt'))) : '';
              ja('  … und die trägt die Marke und die Werte des Bogens',
                 /^# Heldenbuch-Bogen 1/.test(text) && /Name: Brunhilde Eisenfaust/.test(text) && /Trefferpunkte: 31 von 44/.test(text),
                 text.split('\n').slice(0, 6).join(' / '));
            }
            URL.createObjectURL = echtesErzeugen;

            // Einlesen: ein ZIP mit zwei Bögen — einer ist schon da, einer neu.
            const einlesen = [
              {name: 'Wirt-Arik.txt', text: bogenAlsText({...newChar(), name: 'Wirt Arik', npc: true, dmOnly: true,
                haltung: 'freundlich', charClass: 'Kämpfer', level: 4, hp: 22, maxHp: 22, ac: 13})},
              {name: 'unterordner/Bote.txt', text: bogenAlsText({...newChar(), name: 'Bote Jenk', charClass: 'Schurke', level: 1})},
              {name: 'nicht-dabei.md', text: 'wird übergangen'},
            ];
            const zipBlob = await zipSchreiben(einlesen.map(e => ({name: e.name, daten: e.text, packen: true})));
            const eingabe = fenster.querySelector('input[type=file]');
            const dt = new DataTransfer();
            dt.items.add(new File([zipBlob], 'boegen.zip', {type: 'application/zip'}));
            eingabe.files = dt.files;
            eingabe.dispatchEvent(new Event('change', {bubbles: true}));
            const liste = await warten(() => document.querySelector('.bt-liste'));
            if (ja('Ein ZIP mit Textdateien wird gelesen', !!liste)) {
              const zeilen = [...document.querySelectorAll('.bt-eintrag')];
              ja('  … nur die .txt darin, nicht die Beilage', zeilen.length === 2, zeilen.length + ' Einträge');
              ja('  … der vorhandene Name ist erkannt',
                 /Wirt Arik/.test(zeilen[0].textContent) && /schon vorhanden/.test(zeilen[0].textContent),
                 zeilen[0].textContent.slice(0, 90));
              ja('  … der andere ist neu', /Bote Jenk/.test(zeilen[1].textContent) && /neu/.test(zeilen[1].textContent));
              const vorher = JSON.parse(wbSpeicher.dnd_chars || '[]').length;
              const knopfE = knopfMit('einlesen');
              if (ja('Der Knopf nennt die Zahl', !!knopfE && /2 Bögen einlesen/.test(knopfE.textContent), (knopfE || {}).textContent)) {
                knopfE.click();
                await ruhe(400);
                const boegen = JSON.parse(wbSpeicher.dnd_chars || '[]');
                const arik = boegen.filter(c => c.name === 'Wirt Arik');
                ja('Der vorhandene Bogen wird ersetzt, nicht verdoppelt', arik.length === 1 && arik[0].level === 4 && arik[0].maxHp === 22,
                   JSON.stringify(arik.map(c => [c.level, c.maxHp])));
                ja('  … und bleibt ein NSC', arik.length === 1 && arik[0].npc === true && arik[0].dmOnly === true);
                ja('  … der neue kommt dazu', boegen.length === vorher + 1 && boegen.some(c => c.name === 'Bote Jenk'),
                   vorher + ' → ' + boegen.length);
                ja('  … und steht im offenen Abenteuer',
                   (boegen.find(c => c.name === 'Bote Jenk') || {}).adventure === (boegen.find(c => c.name === 'Brunhilde Eisenfaust') || {}).adventure);
              }
            }
            const kreuz = fenster.querySelector('.fenster-knoepfe button[aria-label="Fenster schließen"]');
            if (ja('Im Kopf steht ein ✕', !!kreuz)) {
              kreuz.click(); await ruhe(250);
              ja('  … und es schließt das Fenster', !document.querySelector('.bt-fenster'));
            }
          }
        }

        // ── Post von der Runde ─────────────────────────────────────
        melden('lauf', 'Post');
        const postK = await warten(() => knopfMit('✉ Post'));
        // Im Hintergrund fragt die Anwendung nicht nach — und diese Seite
        // läuft oft in einem verborgenen Fenster. Also erst aufmachen,
        // dann zählen: beim Öffnen wird immer gefragt.
        if (ja('Die Spielleitung hat einen Postknopf', !!postK)) {
          postK.click();
          const zettel = await warten(() => document.querySelector('.post-zettel'));
          ja('  … der zählt, was ungelesen ist', /· 1/.test(knopfMit('✉ Post').textContent),
             knopfMit('✉ Post').textContent);
          ja('Der Zettel steht im Postfach', !!zettel && /Schlüssel heimlich/.test(zettel.textContent));
          const gel = zettel && [...zettel.querySelectorAll('button')].find(b => /Gelesen/.test(b.textContent));
          if (ja('  … und lässt sich abhaken', !!gel)) {
            gel.click(); await ruhe(150);
            ja('  … danach zählt der Knopf ihn nicht mehr', !/· 1/.test(knopfMit('✉ Post').textContent));
          }
          const weg = document.querySelector('.post-zettel .konz-weg');
          if (weg) {
            weg.click(); await ruhe(120);
            const okP = document.querySelector('.confirm-ok'); if (okP) { okP.click(); await ruhe(150); }
            ja('Weggeworfen ist er fort', !document.querySelector('.post-zettel'));
          }
          const zuP = knopfMit('Schließen'); if (zuP) { zuP.click(); await ruhe(100); }
        }

        // ── Die Rast ───────────────────────────────────────────────
        melden('lauf', 'Rast');
        const heldJetzt = () => JSON.parse(wbSpeicher.dnd_chars)[0];
        const rastK = await warten(() => knopfMit('☾ Rast'));
        if (ja('Die Spielleitung hat einen Rastknopf', !!rastK)) {
          rastK.click();
          const ansage = await warten(() => document.querySelector('.rast-rechner'));
          if (ja('Die Variante zeigt den Rechner', !!ansage)) {
            const sel = [...document.querySelectorAll('.rast-rechner select')];
            const setzS = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, 'value').set;
            const waehle = (i, v) => { setzS.call(sel[i], v); sel[i].dispatchEvent(new Event('change', {bubbles: true})); };
            waehle(1, 'regen'); waehle(2, 'kalt'); await ruhe(100);
            const stufeText = () => ((document.querySelector('.rast-stufe.an') || {}).textContent || '');
            ja('Kalt und Regen: erbärmlich', stufeText() === 'Erbärmlich', stufeText());
            ['Zelt', 'Schlafsack oder Bettrolle', 'Lagerfeuer'].forEach(n =>
              [...document.querySelectorAll('.rast-massnahmen .zust-chip')].find(b => b.textContent === n).click());
            await ruhe(100);
            ja('  … mit Zelt, Schlafsack und Feuer wieder ärmlich', stufeText() === 'Ärmlich', stufeText());
            ja('  … und die Posten stehen da', document.querySelectorAll('.rast-teile span').length >= 4);
            knopfMit('☾ Ansagen').click();
            const panel = await warten(() => document.querySelector('.rast-held'));
            if (ja('Nach dem Ansagen steht Brunhildes Rast da', !!panel)) {
              const vorher = heldJetzt();
              ja('  … mit dem, was sie bekommt', /\+10 TP \(Ärmlich\)/.test(panel.textContent)
                 || /\+\d+ TP \(Ärmlich\)/.test(panel.textContent), panel.querySelector('.rast-ergebnis').textContent);
              panel.querySelector('.btn-save').click();
              const nach = await warten(() => heldJetzt().hp !== vorher.hp ? heldJetzt() : null, 3000);
              ja('  … übernommen: 10 TP mehr, höchstens bis zum Maximum',
                 !!nach && nach.hp === Math.min(44, vorher.hp + 10), (vorher.hp) + ' → ' + (nach && nach.hp));
              const fertig = await warten(() => /✓ übernommen/.test((document.querySelector('.rast-fenster') || {}).textContent || ''), 3000);
              ja('Die Spielleitung sieht sie als fertig', !!fertig);
            }
            const ende = knopfMit('Rast beenden');
            if (ende) { ende.click(); await ruhe(120); const okR = document.querySelector('.confirm-ok'); if (okR) { okR.click(); await ruhe(300); } }
            ja('Beendet ist die Rast weg', !document.querySelector('.rast-fenster') && !!knopfMit('☾ Rast'));
          }

          // Die kurze Rast: ein Trefferwürfel, temporäre TP.
          knopfMit('☾ Rast').click();
          const kurz = await warten(() => [...document.querySelectorAll('.einst-option')].find(b => /Kurze Rast/.test(b.textContent)));
          if (kurz) {
            kurz.click(); await ruhe(80);
            knopfMit('☾ Ansagen').click();
            const w10 = await warten(() => [...document.querySelectorAll('.rast-held button')].find(b => /W10/.test(b.textContent)));
            if (ja('Die kurze Rast bietet den W10 an', !!w10)) {
              const tw0 = trefferwuerfelVorrat(heldJetzt())[0];
              w10.click(); await ruhe(80);
              document.querySelector('.rast-held .btn-save').click();
              const nachK = await warten(() => (+heldJetzt().tempHp || 0) > 0 ? heldJetzt() : null, 3000);
              ja('  … gibt temporäre TP', !!nachK, JSON.stringify({tempHp: heldJetzt().tempHp}));
              ja('  … und verbraucht den Würfel',
                 trefferwuerfelVorrat(heldJetzt())[0].verbraucht === tw0.verbraucht + 1);
            }
            const ende2 = knopfMit('Rast beenden');
            if (ende2) { ende2.click(); await ruhe(120); const ok2 = document.querySelector('.confirm-ok'); if (ok2) { ok2.click(); await ruhe(300); } }
          }
        }

        // ── Die Seite des Spielers ─────────────────────────────────
        // Diese Seite fährt als Spielleitung. Die beiden Fenster, die nur
        // Spieler sehen, werden deshalb für sich aufgestellt — dieselben
        // Bausteine aus derselben app.js, nur ohne den Weg dorthin.
        melden('lauf', 'Spielerseite: Post und geheime Ansage');
        const buehne = document.createElement('div');
        document.body.appendChild(buehne);
        const setzA = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
        let gesendet = null;
        ReactDOM.render(React.createElement(PostFenster, {
          helden: [WB_HELD], post: [{id: 7, name: WB_HELD.name, text: 'Alter Zettel', gelesen: true, zeit: 0}],
          onSenden: (wer, text) => { gesendet = {wer, text}; return Promise.resolve(null); },
          onZuruecknehmen: () => {}, onSchliessen: () => {},
        }), buehne);
        await ruhe(100);
        const feldP = buehne.querySelector('.post-text');
        if (ja('Das Postfenster des Spielers steht', !!feldP)) {
          setzA.call(feldP, 'Ich lenke die Wache ab.');
          feldP.dispatchEvent(new Event('input', {bubbles: true}));
          await ruhe(60);
          [...buehne.querySelectorAll('button')].find(b => /Senden/.test(b.textContent)).click();
          await ruhe(150);
          ja('  … schickt Held und Text', !!gesendet && gesendet.wer === 'wb1'
             && gesendet.text === 'Ich lenke die Wache ab.', JSON.stringify(gesendet));
          ja('  … und sagt, dass es angekommen ist', /Liegt bei der Spielleitung/.test(buehne.textContent));
          ja('  … der gelesene Zettel steht als gelesen da', /✓ gelesen/.test(buehne.textContent));
        }
        ReactDOM.unmountComponentAtNode(buehne);

        let angesagt = null;
        ReactDOM.render(React.createElement(AnsageFenster, {
          held: WB_HELD, helden: [WB_HELD], runde: 1,
          kampf: JSON.parse(wbSpeicher.hb_kampf || '{}'),
          onAbbrechen: () => {}, onPlatz: () => null,
          onSenden: (a) => { angesagt = a; return Promise.resolve({...a, id: 'x1'}); },
        }), buehne);
        await ruhe(100);
        const schloss = buehne.querySelector('.an-geheim input');
        if (ja('Die Ansage hat das Schloss', !!schloss)) {
          schloss.click();
          [...buehne.querySelectorAll('button')].find(b => /Nur beschreiben/.test(b.textContent)).click();
          await ruhe(60);
          const tx = buehne.querySelector('.zug-frei');
          setzA.call(tx, 'Ich schneide heimlich den Beutel ab.');
          tx.dispatchEvent(new Event('input', {bubbles: true}));
          await ruhe(60);
          [...buehne.querySelectorAll('button')].find(b => /An die Spielleitung/.test(b.textContent)).click();
          await ruhe(150);
          ja('  … und die Ansage geht als geheim hinaus', !!angesagt && angesagt.geheim === true,
             JSON.stringify(angesagt));
        }
        ReactDOM.unmountComponentAtNode(buehne);
        buehne.remove();

        ja('Nichts ist unterwegs abgestürzt', kaputt.length === 0, kaputt.join(' · '));
        schluss();
      })();
    })();
  </script>
</body>
</html>
