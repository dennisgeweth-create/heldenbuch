<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Taverne des Glücks</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0904;--panel:#181008;--card:#201408;--reel:#f8f6ee;
  --gold:#c9a84c;--goldb:#f5d060;--goldd:#7a5818;
  --red:#cc2020;--redb:#ff4040;--grn:#20aa20;--grnb:#44dd44;
  --txt:#0c0804;--txth:#e8d090;--muted:#8a7040;
  --bdr:#c0a050;--bdrk:#3a2808;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Cinzel',serif}
.machine{width:100%;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#241a06,#0c0904)}

/* HEADER */
.hdr{text-align:center;padding:5px 10px 3px;background:linear-gradient(180deg,#3a2008,#1a1004);border-bottom:2px solid var(--goldd);flex-shrink:0}
.hdr-t{font-family:'Cinzel Decorative',serif;font-size:clamp(11px,3vw,15px);color:var(--gold);letter-spacing:.1em;text-shadow:0 0 16px rgba(201,168,76,.5)}
.hdr-s{font-size:clamp(7px,1.6vw,9px);color:var(--goldd);letter-spacing:.18em;text-transform:uppercase;margin-top:1px}

/* INFO BAR */
.infobar{display:flex;background:#12100a;border-bottom:2px solid var(--goldd);flex-shrink:0}
.ib{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 2px;border-right:1px solid var(--bdrk)}
.ib:last-child{border-right:none}
.il{font-size:clamp(7px,1.5vw,9px);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.iv{font-family:'Cinzel Decorative',serif;font-size:clamp(13px,3.5vw,18px);color:var(--goldb);line-height:1.15}
.iv.r{color:var(--redb)}.iv.g{color:var(--grnb)}
.betrow{display:flex;align-items:center;gap:3px;margin-top:1px}
.bb{width:18px;height:18px;background:var(--card);border:1px solid var(--goldd);border-radius:3px;color:var(--gold);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.bb:hover{background:#2a1a08;border-color:var(--gold)}

/* MSG */
.msgbar{height:22px;display:flex;align-items:center;justify-content:center;background:#0a0806;border-bottom:1px solid var(--bdrk);flex-shrink:0;overflow:hidden}
.msg{font-size:clamp(8px,2vw,10px);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.msg.win{color:var(--goldb);animation:glo .5s ease-in-out infinite alternate}
.msg.info{color:var(--txth)}.msg.feat{color:var(--grnb);animation:glo .4s ease-in-out infinite alternate}
@keyframes glo{from{text-shadow:0 0 3px rgba(245,208,96,.2)}to{text-shadow:0 0 14px var(--goldb),0 0 28px rgba(245,208,96,.4)}}

/* REEL SECTION */
.rl-sec{flex:1;min-height:0;display:flex;padding:4px 4px 0;gap:0}
.side{width:clamp(20px,5.5vw,30px);display:flex;flex-direction:column;justify-content:space-around;align-items:center;flex-shrink:0}
.ln{font-size:clamp(8px,2vw,12px);font-weight:700;width:clamp(16px,4vw,22px);height:clamp(16px,4vw,22px);display:flex;align-items:center;justify-content:center;border-radius:2px;border:1px solid;transition:all .15s}
.ln.c1{color:#33dd33;border-color:#33dd33}.ln.c2{color:#33dd33;border-color:#33dd33}.ln.c3{color:#33dd33;border-color:#33dd33}
.ln.c4{color:#eedd00;border-color:#eedd00}.ln.c5{color:#ee3333;border-color:#ee3333}
.ln.lit{color:#000;background:currentColor;box-shadow:0 0 8px currentColor}

/* REEL FRAME */
.rf{flex:1;position:relative;background:var(--reel);border:3px solid var(--bdr);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),0 0 16px rgba(201,168,76,.15)}
.reels{display:flex;height:100%}
.rl{flex:1;position:relative;overflow:hidden;border-right:2px solid var(--bdr)}
.rl:last-child{border-right:none}
.rl.held{box-shadow:inset 0 0 0 3px var(--gold)}
.strip{position:absolute;left:0;right:0;top:0}
.sym{display:flex;align-items:center;justify-content:center;width:100%;flex-shrink:0;font-size:clamp(22px,6vw,38px);user-select:none;line-height:1}
/* Separators */
.sep{height:2px;background:rgba(0,0,0,.15);flex-shrink:0}
/* Win line SVG */
.lsvg{position:absolute;inset:0;pointer-events:none;z-index:10}
/* Edge fade */
.rfade{position:absolute;inset:0;pointer-events:none;z-index:5;background:linear-gradient(180deg,rgba(248,246,238,.65) 0%,transparent 20%,transparent 80%,rgba(248,246,238,.65) 100%)}

/* CONTROLS */
.ctrl{flex-shrink:0;background:#12100a;border-top:2px solid var(--goldd);padding:4px 6px 4px}
.chance-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:3px}
.clbl{font-size:clamp(6px,1.4vw,8px);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}


.btn-row{display:flex;gap:4px}
.mbtn{flex:1;height:clamp(32px,7vw,42px);border-radius:18px;font-family:'Cinzel Decorative',serif;font-size:clamp(8px,1.9vw,11px);cursor:pointer;border:2px solid;transition:all .12s;position:relative;overflow:hidden;text-transform:uppercase}
.mbtn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 50%);pointer-events:none}
.mbtn:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-1px)}
.mbtn:active:not(:disabled){transform:translateY(1px)}
.mbtn:disabled{opacity:.25;cursor:not-allowed;transform:none}
.mspin{background:linear-gradient(180deg,#d4a828,#7a5010 50%,#d4a828);border-color:var(--goldb);color:#0c0804;box-shadow:0 2px 10px rgba(201,168,76,.3)}
.mspin.go{background:linear-gradient(180deg,#3a2006,#1a1002 50%,#3a2006);color:var(--goldd);border-color:var(--goldd);box-shadow:none}
.mrisk{background:linear-gradient(180deg,#3a8020,#1a4010 50%,#3a8020);border-color:#5bcc28;color:#fff}
.mteil{background:linear-gradient(180deg,#205a90,#102840 50%,#205a90);border-color:#3898d8;color:#fff}
.mcash{background:linear-gradient(180deg,#601890,#300840 50%,#601890);border-color:#9838d8;color:#fff}

/* PAYTABLE */
#ptbtn{width:100%;background:none;border:none;border-top:1px solid var(--bdrk);color:var(--muted);font-family:'Cinzel',serif;font-size:clamp(7px,1.7vw,9px);padding:3px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}
#ptbtn:hover{color:var(--goldd)}
#ptwrap{display:none;background:#0a0804;border-top:1px solid var(--bdrk);padding:4px 8px;max-height:120px;overflow-y:auto}
#ptwrap.open{display:block}
.pt-row{display:flex;align-items:center;justify-content:space-between;padding:1px 0;border-bottom:1px solid rgba(58,40,8,.4);font-size:clamp(9px,2vw,11px)}
.pt-s{letter-spacing:3px}.pt-m{font-family:'Cinzel Decorative',serif;color:var(--goldb)}

/* LADDER OVERLAY */
#lad{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#lad.on{display:flex}
.lad-t{font-family:'Cinzel Decorative',serif;font-size:clamp(13px,4vw,18px);color:var(--goldb);text-shadow:0 0 18px rgba(245,208,96,.5)}
.lad-card{font-size:clamp(42px,11vw,64px);height:clamp(54px,13vw,74px);display:flex;align-items:center;justify-content:center}
.lad-res{font-family:'Cinzel',serif;font-size:clamp(10px,2.5vw,13px);min-height:20px;letter-spacing:.07em}
.lad-res.w{color:var(--grnb)}.lad-res.l{color:var(--redb)}
.rungs{display:flex;gap:4px;align-items:flex-end}
.rung{height:clamp(22px,5vw,30px);min-width:clamp(50px,13vw,72px);border-radius:3px;border:1px solid;display:flex;align-items:center;justify-content:center;font-family:'Cinzel Decorative',serif;font-size:clamp(8px,2vw,10px);transition:all .2s}
.rung.norm{background:#1a1204;border-color:var(--goldd);color:var(--goldd)}
.rung.cur{background:var(--gold);border-color:var(--goldb);color:#0c0804;box-shadow:0 0 12px var(--gold);animation:bob .4s ease-in-out infinite alternate}
.rung.won{background:#229022;border-color:#44cc44;color:#fff}
.rung.lost{background:#902222;border-color:#cc4444;color:#fff}
@keyframes bob{from{transform:scale(.96)}to{transform:scale(1.04)}}
.lad-btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.lbtn{padding:clamp(7px,2vw,10px) clamp(12px,3vw,20px);border-radius:16px;font-family:'Cinzel',serif;font-size:clamp(9px,2.2vw,12px);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:2px solid;transition:all .12s}
.lbtn:hover{filter:brightness(1.25);transform:translateY(-1px)}
.lbtn.r{background:rgba(192,32,32,.25);border-color:var(--red);color:#ff8888}
.lbtn.b{background:rgba(18,18,36,.6);border-color:#3a3858;color:#aaaacc}
.lbtn.t{background:rgba(28,80,18,.4);border-color:#388028;color:#88ee88}
.lbtn.c{background:rgba(80,18,100,.4);border-color:#7828a0;color:#cc88ff}

/* WHEEL OVERLAY */
#whl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:8px}
#whl.on{display:flex}
.whl-t{font-family:'Cinzel Decorative',serif;font-size:clamp(13px,4vw,18px);color:var(--grnb);text-shadow:0 0 18px rgba(68,221,68,.5)}
.whl-wrap{position:relative;width:clamp(160px,42vw,220px);height:clamp(160px,42vw,220px)}
#wc{width:100%;height:100%}
.wptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:clamp(18px,5vw,26px)}
.wres{font-family:'Cinzel',serif;font-size:clamp(11px,2.8vw,14px);color:var(--goldb);min-height:22px;letter-spacing:.07em}
</style>
</head>
<body>
<div class="machine">
  <div class="hdr">
    <div class="hdr-t">Taverne des Glücks</div>
    <div class="hdr-s">Triple Chance · D&amp;D Edition</div>
  </div>
  <div class="infobar">
    <div class="ib"><span class="il">Münzen</span><span class="iv" id="CE">100</span></div>
    <div class="ib">
      <span class="il">Einsatz</span><span class="iv g" id="BE">5</span>
      <div class="betrow"><button class="bb" id="Bd">−</button><button class="bb" id="Bu">+</button></div>
    </div>
    <div class="ib"><span class="il">Gewinn</span><span class="iv r" id="WE">0</span></div>
  </div>
  <div class="msgbar"><span class="msg info" id="ME">✦ Viel Glück, Abenteurer! ✦</span></div>
  <div class="rl-sec">
    <div class="side">
      <div class="ln c4" id="LL4">4</div>
      <div class="ln c2" id="LL2">2</div>
      <div class="ln c1" id="LL1">1</div>
      <div class="ln c3" id="LL3">3</div>
      <div class="ln c5" id="LL5">5</div>
    </div>
    <div class="rf" id="RF">
      <div class="reels">
        <div class="rl" id="R0"><div class="strip" id="S0"></div></div>
        <div class="rl" id="R1"><div class="strip" id="S1"></div></div>
        <div class="rl" id="R2"><div class="strip" id="S2"></div></div>
      </div>
      <svg class="lsvg" id="LS" viewBox="0 0 300 300" preserveAspectRatio="none"></svg>
      <div class="rfade"></div>
    </div>
    <div class="side">
      <div class="ln c5" id="LR5">5</div>
      <div class="ln c2" id="LR2">2</div>
      <div class="ln c1" id="LR1">1</div>
      <div class="ln c3" id="LR3">3</div>
      <div class="ln c4" id="LR4">4</div>
    </div>
  </div>
  <div class="ctrl">


    <div class="btn-row">
      <button class="mbtn mteil" id="BT" disabled>✂ Teilen</button>
      <button class="mbtn mspin" id="BS">⚔ Drehen</button>
      <button class="mbtn mrisk" id="BR" disabled>⚡ Risiko</button>
      <button class="mbtn mcash" id="BC" disabled>💰 Auszahlen</button>
    </div>
  </div>
  <button id="ptbtn">▼ Gewinntabelle</button>
  <div id="ptwrap"><div id="ptinner"></div></div>
</div>

<!-- Ladder overlay -->
<div id="lad">
  <div class="lad-t">⚡ Risikospiel</div>
  <div class="lad-card" id="LC">🃏</div>
  <div class="lad-res" id="LR"></div>
  <div class="rungs" id="RW"></div>
  <div class="lad-btns" id="LBT">
    <button class="lbtn r" onclick="lPick('r')">🔴 Rot</button>
    <button class="lbtn b" onclick="lPick('b')">⚫ Schwarz</button>
    <button class="lbtn t" onclick="lSplit()">✂ Teilen</button>
    <button class="lbtn c" onclick="lCash()">💰 Einsammeln</button>
  </div>
</div>

<!-- Wheel overlay -->
<div id="whl">
  <div class="whl-t">🎡 REWIN FEATURE!</div>
  <div class="whl-wrap">
    <canvas id="wc" width="220" height="220"></canvas>
    <div class="wptr">▾</div>
  </div>
  <div class="wres" id="WRes"></div>
  <button class="lbtn t" id="WBtn" onclick="spinWheel()" style="margin-top:6px">▶ Rad drehen</button>
</div>

<script>
// ── SYMBOLS ──────────────────────────────────────────────────────
// D&D versions of Merkur Triple Chance originals
const SY=[
  {id:'candle', e:'🕯', w:30,p3:10, p2:0, n:'Kerze'},
  {id:'potion', e:'🧪', w:26,p3:20, p2:0, n:'Trank'},
  {id:'gem',    e:'💎', w:22,p3:20, p2:0, n:'Edelstein'},
  {id:'orb',    e:'🔮', w:18,p3:20, p2:0, n:'Seherstein'},
  {id:'trophy', e:'🏆', w:14,p3:30, p2:0, n:'Kelch'},
  {id:'scroll', e:'📜', w:10,p3:30, p2:0, n:'Schriftrolle'},
  {id:'egg',    e:'🥚', w:8, p3:100,p2:0, n:'Drachenei'},
  {id:'star',   e:'⭐', w:4, p3:400,p2:0, n:'Schicksalsstern'},
  {id:'diamond',e:'♦',  w:18,p3:5,  p2:5, n:'Raute (2+3)'},
];
const TW=SY.reduce((a,x)=>a+x.w,0);
const rs=()=>{let r=Math.random()*TW;for(const s of SY){r-=s.w;if(r<=0)return s;}return SY[SY.length-1]};

// 5 PAYLINES: [row for reel0, row for reel1, row for reel2]  0=top,1=mid,2=bot
const PL=[[1,1,1],[0,0,0],[2,2,2],[0,1,2],[2,1,0]];
// SVG coordinates (viewBox 0 0 300 300, reel centers x=50,150,250 row centers y=50,150,250)
const PLC=[[[50,150],[250,150]],[[50,50],[250,50]],[[50,250],[250,250]],[[50,50],[250,250]],[[50,250],[250,50]]];
const PCC=['#33dd33','#33dd33','#33dd33','#eecc00','#ee3333'];

// ── STATE ─────────────────────────────────────────────────────────
let cred=100,bet=5,bidx=2;
const BETS=[1,2,5,10,20,50];
let spinning=false;
let vis=[[rs(),rs(),rs()],[rs(),rs(),rs()],[rs(),rs(),rs()]];
let pendWin=0;
let SH=80;

// ── LAYOUT ───────────────────────────────────────────────────────
function calcSH(){const f=document.getElementById('RF');if(f&&f.offsetHeight>60)SH=Math.floor(f.offsetHeight/3);}

function renderStatic(ri){
  const el=document.getElementById('S'+ri);
  const[t,m,b]=vis[ri];
  el.style.cssText=`transform:translateY(-${SH}px);transition:none`;
  el.innerHTML=
    `<div class="sym" style="height:${SH}px;opacity:.22">${rs().e}</div>`+
    `<div class="sym" style="height:${SH}px">${t.e}</div>`+
    `<div class="sym" style="height:${SH}px">${m.e}</div>`+
    `<div class="sym" style="height:${SH}px">${b.e}</div>`+
    `<div class="sym" style="height:${SH}px;opacity:.22">${rs().e}</div>`;
}

function initReels(){calcSH();for(let i=0;i<3;i++){vis[i]=[rs(),rs(),rs()];renderStatic(i);}}

// ── ANIMATION ────────────────────────────────────────────────────
function animReel(ri,done){
  calcSH();
  const nt=rs(),nm=rs(),nb=rs();
  const el=document.getElementById('S'+ri);
  const N=12+ri*2;
  let h='';
  for(let i=0;i<N;i++)h+=`<div class="sym" style="height:${SH}px">${rs().e}</div>`;
  h+=`<div class="sym" style="height:${SH}px">${nt.e}</div>`;
  h+=`<div class="sym" style="height:${SH}px">${nm.e}</div>`;
  h+=`<div class="sym" style="height:${SH}px">${nb.e}</div>`;
  h+=`<div class="sym" style="height:${SH}px;opacity:.22">${rs().e}</div>`;
  el.style.cssText='transform:translateY(0);transition:none';
  el.innerHTML=h;
  el.getBoundingClientRect();
  const dur=500+ri*200;
  el.style.cssText=`transform:translateY(-${SH*(N+1)}px);transition:transform ${dur}ms cubic-bezier(0.2,0.1,0.2,1)`;
  setTimeout(()=>{vis[ri]=[nt,nm,nb];renderStatic(ri);done();},dur+30);
}

// ── EVAL ─────────────────────────────────────────────────────────
function evalLine(rows){
  const syms=rows.map((row,ri)=>vis[ri][row]);
  const isDia=s=>s.id==='diamond';
  const dc=syms.filter(isDia).length;
  if(dc===3)return SY.find(s=>s.id==='diamond').p3;
  if(dc===2)return SY.find(s=>s.id==='diamond').p2;
  const nonD=syms.filter(s=>!isDia(s));
  if(nonD.length===0)return 0;
  const base=nonD[0];
  if(!nonD.every(s=>s.id===base.id))return 0;
  if(nonD.length===3)return base.p3;
  return 0;
}

function evalAll(){
  let total=0;const wl=[];
  for(let li=0;li<5;li++){const m=evalLine(PL[li]);if(m>0){total+=m*bet;wl.push({li,m:m*bet});}}
  return{total,wl};
}

function isRewin(){
  const f=vis.flat();
  return f.every(s=>s.id===f[0].id)&&f[0].id!=='diamond';
}

// ── DRAW LINES ────────────────────────────────────────────────────
function drawLines(wl){
  const svg=document.getElementById('LS');
  svg.innerHTML='<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  // Reset all numbers
  for(let n=1;n<=5;n++)['LL','LR'].forEach(p=>{const el=document.getElementById(p+n);if(el){const c=el.className.replace(/ lit/g,'');el.className=c;}});
  wl.forEach(({li})=>{
    const[[x1,y1],[x2,y2]]=PLC[li];
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);
    ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);
    ln.setAttribute('stroke',PCC[li]);ln.setAttribute('stroke-width','3.5');
    ln.setAttribute('stroke-linecap','round');ln.setAttribute('opacity','0.9');
    svg.appendChild(ln);
    const n=li+1;
    ['LL','LR'].forEach(p=>{const el=document.getElementById(p+n);if(el)el.className+=' lit';});
  });
}

function clearLines(){
  document.getElementById('LS').innerHTML='';
  for(let n=1;n<=5;n++)['LL','LR'].forEach(p=>{const el=document.getElementById(p+n);if(el){el.className=el.className.replace(/ lit/g,'');}});
}

// ── SPIN ─────────────────────────────────────────────────────────
function doSpin(){
  if(spinning)return;
  if(cred<bet){setMsg('❌ Nicht genug Münzen!','info');return;}
  cred-=bet;pendWin=0;
  spinning=true;clearLines();setMsg('🎲 Walzen drehen...','info');disAll();updUI();
  let done=0;
  function tryDone(){if(++done===3)afterSpin();}
  for(let i=0;i<3;i++){const ri=i;setTimeout(()=>animReel(ri,tryDone),ri*60);}
}

function afterSpin(){
  spinning=false;
  if(isRewin()){setMsg('🌟 REWIN FEATURE!','feat');setTimeout(showWheel,400);return;}
  const{total,wl}=evalAll();
  if(total>0){
    pendWin=total;cred+=total;drawLines(wl);updPips();updUI();
    document.getElementById('WE').textContent=total;
    setMsg(`${total>=bet*50?'👑 LEGENDÄR! ':total>=bet*10?'🌟 SELTEN! ':'⚔ Gewinn! '}+${total} Münzen`,'win');
    document.getElementById('BR').disabled=false;
    document.getElementById('BC').disabled=false;
    document.getElementById('BT').disabled=false;
    document.getElementById('BS').disabled=true;
  } else {
    setMsg('💀 Kein Gewinn — Nochmal!','info');
    document.getElementById('BS').disabled=false;
    if(cred<=0)setMsg('💀 Keine Münzen mehr — Seite neu laden','info');
    updUI();
  }
}

// ── UI ────────────────────────────────────────────────────────────
const updUI=()=>{document.getElementById('CE').textContent=cred;document.getElementById('BE').textContent=bet;};
const setMsg=(t,c)=>{const e=document.getElementById('ME');e.textContent=t;e.className='msg '+c;};
function disAll(){['BS','BR','BC','BT'].forEach(id=>document.getElementById(id).disabled=true);}
function resetBtnsAfterWin(){['BR','BC','BT'].forEach(id=>document.getElementById(id).disabled=true);document.getElementById('BS').disabled=false;document.getElementById('BS').textContent='⚔ Drehen';}

document.getElementById('BS').addEventListener('click',doSpin);
document.getElementById('Bd').addEventListener('click',()=>{if(bidx>0){bidx--;bet=BETS[bidx];updUI();}});
document.getElementById('Bu').addEventListener('click',()=>{if(bidx<BETS.length-1){bidx++;bet=BETS[bidx];updUI();}});
document.getElementById('BC').addEventListener('click',()=>{setMsg('💰 Eingesammelt: '+pendWin+' Münzen','win');document.getElementById('WE').textContent=pendWin;resetBtnsAfterWin();});
document.getElementById('BT').addEventListener('click',()=>{const h=Math.floor(pendWin/2);cred-=pendWin;cred+=h;pendWin=h;setMsg('✂ Hälfte gesichert: '+h+' Münzen','win');document.getElementById('WE').textContent=h;resetBtnsAfterWin();updUI();});
document.getElementById('BR').addEventListener('click',()=>{openLadder();});

// ── LADDER ────────────────────────────────────────────────────────
const LV=[1,2,3,4,6,8,12,16,24,32];
let ladBase=0,ladPos=0;
function openLadder(){ladBase=pendWin;ladPos=0;buildRungs();document.getElementById('LC').textContent='🃏';document.getElementById('LR').textContent='';document.getElementById('LBT').style.display='flex';document.getElementById('lad').classList.add('on');}
function buildRungs(){const w=document.getElementById('RW');w.innerHTML='';LV.forEach((v,i)=>{const d=document.createElement('div');d.className='rung'+(i===ladPos?' cur':i<ladPos?' won':' norm');d.id='RG'+i;d.textContent=Math.round(ladBase*v)+'🪙';w.appendChild(d);});}
const CARDS=[{e:'♥️',c:'r'},{e:'♦️',c:'r'},{e:'♠️',c:'b'},{e:'♣️',c:'b'}];
function lPick(choice){
  const card=CARDS[Math.floor(Math.random()*4)];
  const win=card.c===choice;
  document.getElementById('LBT').style.display='none';
  document.getElementById('LC').textContent=card.e;
  const nm={r:'Rot 🔴',b:'Schwarz ⚫'};
  setTimeout(()=>{
    const res=document.getElementById('LR');
    if(win){
      document.getElementById('RG'+ladPos).className='rung won';
      ladPos=Math.min(ladPos+1,LV.length-1);
      const nAmt=Math.round(ladBase*LV[ladPos]);
      const gain=nAmt-pendWin;cred+=gain;pendWin=nAmt;
      if(document.getElementById('RG'+ladPos))document.getElementById('RG'+ladPos).className='rung cur';
      res.textContent=`✅ ${nm[card.c]}! Jetzt ${nAmt} Münzen`;res.className='lad-res w';updUI();
      if(ladPos>=LV.length-1){setTimeout(()=>lCash(),1200);return;}
      setTimeout(()=>document.getElementById('LBT').style.display='flex',1300);
    } else {
      cred-=pendWin;pendWin=0;
      if(document.getElementById('RG'+ladPos))document.getElementById('RG'+ladPos).className='rung lost';
      res.textContent=`💀 ${nm[card.c]}! Alles verloren.`;res.className='lad-res l';updUI();
      setTimeout(()=>closeLad(false),1600);
    }
  },700);
}
function lSplit(){const h=Math.floor(pendWin/2);cred-=pendWin;cred+=h;pendWin=h;closeLad(true,'✂ Hälfte eingesammelt: '+h+' Münzen');}
function lCash(){closeLad(true,'💰 Eingesammelt: '+pendWin+' Münzen');}
function closeLad(keep,msg){
  document.getElementById('lad').classList.remove('on');
  resetBtnsAfterWin();
  if(msg)setMsg(msg,'win');else if(!pendWin)setMsg('💀 Risiko verloren — Neu einsetzen','info');
  document.getElementById('WE').textContent=pendWin;updUI();
}

// ── REWIN WHEEL ───────────────────────────────────────────────────
const WSEGS=[{l:'Mystery',c:'#22aa22',w:true},{l:'Mystery',c:'#22aa22',w:true},{l:'Mystery',c:'#22aa22',w:true},{l:'Stop',c:'#cc2222',w:false}];
let wAngle=0,wSpinning=false;
function drawWheel(a){
  const cv=document.getElementById('wc');const ctx=cv.getContext('2d');
  const W=cv.width,cx=W/2,cy=W/2,r=W/2-8;
  ctx.clearRect(0,0,W,W);
  const sa=Math.PI*2/WSEGS.length;
  WSEGS.forEach((seg,i)=>{
    const s=a+i*sa-Math.PI/2,e=s+sa;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e);ctx.closePath();
    ctx.fillStyle=seg.c;ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s+sa/2);
    ctx.font=`bold ${W*0.065}px Cinzel,serif`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(seg.l,r*0.55,0);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#8a5818';ctx.lineWidth=5;ctx.stroke();
  for(let i=0;i<24;i++){const a2=i/24*Math.PI*2;ctx.beginPath();ctx.arc(cx+r*Math.cos(a2),cy+r*Math.sin(a2),W*0.018,0,Math.PI*2);ctx.fillStyle='#5a3808';ctx.fill();}
}
function showWheel(){wAngle=0;drawWheel(0);document.getElementById('WRes').textContent='';document.getElementById('WBtn').style.display='';document.getElementById('whl').classList.add('on');}
function spinWheel(){
  if(wSpinning)return;wSpinning=true;document.getElementById('WBtn').style.display='none';
  const totalRot=Math.PI*2*(4+Math.random()*5);const dur=3800;const start=performance.now();const startA=wAngle;
  function frame(now){
    const p=Math.min((now-start)/dur,1);const e=1-Math.pow(1-p,3);
    wAngle=startA+totalRot*e;drawWheel(wAngle);
    if(p<1){requestAnimationFrame(frame);}
    else{
      wSpinning=false;
      const sa=Math.PI*2/WSEGS.length;
      const norm=(((-wAngle%(Math.PI*2))+Math.PI*2+Math.PI/2+sa/2)%(Math.PI*2));
      const si=Math.floor(norm/sa)%WSEGS.length;
      const seg=WSEGS[si];
      if(seg.w){
        const mult=2+Math.floor(Math.random()*9);const win=bet*mult;cred+=win;pendWin+=win;
        document.getElementById('WRes').textContent=`✨ Mystery: +${win} Münzen!`;
        document.getElementById('WRes').style.color='#f5d060';
        setTimeout(()=>closeWheel(`🎡 Rewin Feature: +${win} Münzen!`),1500);
      } else {
        document.getElementById('WRes').textContent='💀 Stop — kein Bonus';
        document.getElementById('WRes').style.color='#ff4444';
        setTimeout(()=>closeWheel('💀 Stop — Kein Rewin-Bonus'),1500);
      }
    }
  }
  requestAnimationFrame(frame);
}
function closeWheel(msg){
  document.getElementById('whl').classList.remove('on');
  setMsg(msg,'win');updUI();
  document.getElementById('WE').textContent=pendWin;
  if(pendWin>0){document.getElementById('BR').disabled=false;document.getElementById('BC').disabled=false;document.getElementById('BT').disabled=false;document.getElementById('BS').disabled=true;}
  else{document.getElementById('BS').disabled=false;document.getElementById('BS').textContent='⚔ Drehen';}
  
}

// ── PAYTABLE ─────────────────────────────────────────────────────
function buildPT(){
  const el=document.getElementById('ptinner');
  let h='';
  [...SY].sort((a,b)=>b.p3-a.p3).forEach(s=>{
    h+=`<div class="pt-row"><span class="pt-s">${s.e}${s.e}${s.e}</span><span style="font-size:9px;color:#6a5030">${s.n}</span><span class="pt-m">${s.p3}×</span></div>`;
    if(s.p2)h+=`<div class="pt-row"><span class="pt-s">${s.e}${s.e}—</span><span style="font-size:9px;color:#6a5030">2er</span><span class="pt-m">${s.p2}×</span></div>`;
  });
  h+='<div class="pt-row"><span style="font-size:9px;color:#6a5030;width:100%;text-align:center">Vollbild einer Sorte → 🎡 REWIN FEATURE</span></div>';
  el.innerHTML=h;
}
document.getElementById('ptbtn').addEventListener('click',()=>{const w=document.getElementById('ptwrap');w.classList.toggle('open');document.getElementById('ptbtn').textContent=w.classList.contains('open')?'▲ Schließen':'▼ Gewinntabelle';});

// ── INIT ─────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{calcSH();for(let i=0;i<3;i++)renderStatic(i);});
window.addEventListener('load',()=>{initReels();buildPT();updUI();drawWheel(0);});
</script>
