<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heldenbuch</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- Schriften im head statt per @import im React-Stilblock: dort startete
       der Abruf erst nach dem ersten Rendern (gemessen bei ~1150ms), bis
       dahin lief die Darstellung in der Ersatzschrift. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="styles.css?v=dev" />
  <!-- Regeldaten und reine Hilfsfunktionen liegen ausgelagert; beide sind
       klassische Skripte ohne JSX und muessen vor dem Anwendungscode laufen.
       Das ?v=dev ersetzt der Deploy durch den Commit-Kurzhash: sonst kann ein
       neues index.html auf eine zwischengespeicherte alte styles.css treffen. -->
  <script src="js/data.js?v=dev"></script>
  <script src="js/util.js?v=dev"></script>
  <!-- React liegt mit im Webspace statt beim CDN. Am Spieltisch zaehlt, dass
       die Seite auch dann laedt, wenn das Netz im Keller schwach oder cdnjs
       gestoert ist. Babel wird hier nicht mehr geladen — js/app.js ist bereits
       uebersetzt; babel braucht nur noch build.js. -->
  <script src="vendor/react.production.min.js?v=dev"></script>
  <script src="vendor/react-dom.production.min.js?v=dev"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1011; font-family: 'Roboto', sans-serif; }
    #root { height: 100vh; }
    #loading { height: 100vh; display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #e05a5a; font-size: 18px; background: #0f1011; gap: 16px; }
    #errmsg { display:none; background:#3a1010; border:1px solid #8b1a1a; border-radius:6px;
              padding:16px 24px; color:#e87070; font-size:13px; max-width:500px;
              white-space:pre-wrap; font-family:monospace; }
  </style>
</head>
<body>
  <div id="loading">
    <div>⚔ Heldenbuch lädt...</div>
    <div id="errmsg"></div>
  </div>
  <div id="root" style="display:none"></div>

  <script>
    // Fehler sichtbar machen
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('errmsg');
      el.style.display = 'block';
      el.textContent = 'Fehler: ' + msg + '\nZeile: ' + line;
    };

    // API-Client
    // Die Kennung der Anmeldung. Liegt sie im Speicher, traegt sie jede
    // Anfrage — der Server zieht sie dem Gruppenpasswort vor und leitet
    // die Rechte daraus ab. Sie wird hier zentral angehaengt, damit die
    // 23 Huellen darunter unveraendert bleiben konnten.
    //
    // login bleibt aussen vor: eine alte Kennung hat bei einer neuen
    // Anmeldung nichts verloren.
    const authToken = () => { try { return localStorage.getItem('sv_token') || ''; } catch { return ''; } };

    async function apiRequest(serverUrl, action, payload) {
      const url = serverUrl.replace(/\/+$/, '') + '/api.php';
      const koerper = { action, ...payload };
      const tok = authToken();
      if (tok && action !== 'login' && koerper.token === undefined) koerper.token = tok;
      let res;
      try {
        res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(koerper),
        });
      } catch(e) {
        throw new Error('Server nicht erreichbar. Bitte URL prüfen.');
      }
      const data = await res.json();
      if (!data.ok) {
        // Der Statuscode geht mit: 403 heisst "wird nie gehen" und darf
        // nicht endlos wiederholt werden, 500 heisst "gleich nochmal".
        const fehler = new Error(data.message || 'Serverfehler ' + res.status);
        fehler.status = res.status;
        throw fehler;
      }
      return data;
    }
    const registerGroup    = (url, code, pass, dmPass)  => apiRequest(url, 'register',        { code, password: pass, dm_password: dmPass||undefined });
    const apiLoadChars     = (url, code, pass)           => apiRequest(url, 'load',            { code, password: pass });
    const apiSaveChars     = (url, code, pass, chars)    => apiRequest(url, 'save',            { code, password: pass, chars });
    const apiSaveChar      = (url, code, pass, charId, char) => apiRequest(url, 'save_char',   { code, password: pass, char_id: charId, char });
    const apiDeleteChar    = (url, code, pass, charId)       => apiRequest(url, 'delete_char', { code, password: pass, char_id: charId });
    const apiSaveItem      = (url, code, pass, charId, itemId, item) => apiRequest(url, 'save_item',   { code, password: pass, char_id: charId, item_id: itemId, item });
    const apiDeleteItem    = (url, code, pass, charId, itemId)       => apiRequest(url, 'delete_item', { code, password: pass, char_id: charId, item_id: itemId });
    const apiSaveLibrary   = (url, code, pass, library)  => apiRequest(url, 'save_library',   { code, password: pass, library });
    // Traegt kein Passwort, sondern die abgeleitete Kennung: der Abgleich
    // laeuft im Sekundenbereich, und bcrypt bei jeder Anfrage waere die
    // teuerste Zeile der ganzen Anwendung.
    const apiPoll          = (url, code, token)  => apiRequest(url, 'poll',           { code, poll_token: token });
    const apiDmLoad        = (url, code, pass, dmPass)   => apiRequest(url, 'dm_load',         { code, password: pass, dm_password: dmPass });
    const apiDmSaveLibrary = (url, code, pass, dmPass, dmLibrary) => apiRequest(url, 'dm_save_library', { code, password: pass, dm_password: dmPass, dm_library: dmLibrary });
    const apiSetDmPassword = (url, code, pass, dmPass)   => apiRequest(url, 'set_dm_password', { code, password: pass, dm_password: dmPass });
    // Gegner liegen zeilenweise auf dem Server, nicht in der DM-Bibliothek:
    // sonst lüde jede Änderung an einem Gegner die ganze Sammlung hoch, und
    // mit Bildern wäre deren 2-MB-Grenze schnell erreicht.
    const apiDmLoadEnemies   = (url, code, pass, dmPass)          => apiRequest(url, 'dm_load_enemies',   { code, password: pass, dm_password: dmPass });
    const apiDmSaveEnemy     = (url, code, pass, dmPass, id, e)   => apiRequest(url, 'dm_save_enemy',     { code, password: pass, dm_password: dmPass, enemy_id: id, enemy: e });
    const apiDmDeleteEnemy   = (url, code, pass, dmPass, id)      => apiRequest(url, 'dm_delete_enemy',   { code, password: pass, dm_password: dmPass, enemy_id: id });
    const apiDmImportEnemies = (url, code, pass, dmPass, liste)   => apiRequest(url, 'dm_import_enemies', { code, password: pass, dm_password: dmPass, enemies: liste });
    const apiDmLoadEncounters  = (url, code, pass, dmPass)        => apiRequest(url, 'dm_load_encounters',  { code, password: pass, dm_password: dmPass });
    const apiDmSaveEncounter   = (url, code, pass, dmPass, id, e) => apiRequest(url, 'dm_save_encounter',   { code, password: pass, dm_password: dmPass, enc_id: id, encounter: e });
    const apiDmDeleteEncounter = (url, code, pass, dmPass, id)    => apiRequest(url, 'dm_delete_encounter', { code, password: pass, dm_password: dmPass, enc_id: id });
    const apiDmLoadChronik     = (url, code, pass, dmPass)       => apiRequest(url, 'dm_load_chronik',     { code, password: pass, dm_password: dmPass });
    const apiDmSaveChronik     = (url, code, pass, dmPass, ch)   => apiRequest(url, 'dm_save_chronik',     { code, password: pass, dm_password: dmPass, chronik: ch });
    // ── Konten ──────────────────────────────────────────────────
    // Alles hier traegt die Kennung von selbst, ausser login und dem
    // allerersten Konto — da gibt es noch keine.
    const apiLogin      = (url, user, pass)        => apiRequest(url, 'login',  { user, password: pass });
    const apiLogout     = (url, token)             => apiRequest(url, 'logout', { token });
    const apiMe         = (url)                    => apiRequest(url, 'me', {});
    const apiPassAendern= (url, alt, neu)          => apiRequest(url, 'password_change', { alt, neu });
    const apiKontoNeu   = (url, name, neu, admin)  => apiRequest(url, 'user_create',
                                                       { name, neu, ist_admin: !!admin });
    const apiKontoListe = (url)                    => apiRequest(url, 'user_list', {});
    const apiKontoReset = (url, userId, neu)       => apiRequest(url, 'user_reset',
                                                       { user_id: userId, neu });
    const apiRolleSetzen= (url, userId, gruppe, r) => apiRequest(url, 'member_set',
                                                       { user_id: userId, gruppe, rolle: r });

    // Wem ein Bogen gehoert, und wer ueberhaupt in der Gruppe ist.
    const apiBesitzerSetzen = (url, code, pass, dmPass, charId, owner) =>
      apiRequest(url, 'char_owner_set', { code, password: pass, dm_password: dmPass,
                                          char_id: charId, owner });
    const apiMitglieder = (url, code, pass, dmPass) =>
      apiRequest(url, 'member_list', { code, password: pass, dm_password: dmPass });

    const apiAdvDmSetzen = (url, code, advId, userIds) =>
      apiRequest(url, 'adv_dm_set', { code, adv_id: advId, user_ids: userIds });

    // Die drei Zugangsdaten der Gruppe an einer Stelle. Vorher wurden sie an
    // elf Stellen einzeln aus dem Speicher gelesen, teils ein-, teils
    // dreizeilig — jede Umbenennung haette alle elf treffen muessen.
    const serverCreds = () => ({
      url:   localStorage.getItem('sv_url')   || '',
      code:  localStorage.getItem('sv_code')  || '',
      pass:  localStorage.getItem('sv_pass')  || '',
      token: localStorage.getItem('sv_token') || '',
    });
    const safeSetItem = (key, value) => {
      try {
        if (typeof value === 'string' && value.length > 2500000) return; // >2.5MB — skip, too large
        localStorage.setItem(key, value);
      } catch(e) {
        // Quota exceeded — try to free up space by removing old library caches
        try { localStorage.removeItem('hb_library'); } catch {}
        try { localStorage.removeItem('hb_dm_library'); } catch {}
        try { localStorage.setItem(key, value); } catch {} // retry once
      }
    };
    const apiSaveLog       = (url, code, pass, entry)    => apiRequest(url, 'save_log',  { code, password: pass, entry });
    const apiLoadLogs      = (url, code, pass, charId, opts) => apiRequest(url, 'load_logs', { code, password: pass, char_id: charId||null, limit: (opts&&opts.limit)||50, offset: (opts&&opts.offset)||0, search: (opts&&opts.search)||'', tab_filter: (opts&&opts.tabFilter)||[] });
  </script>

  <!-- Uebersetzt aus js/app.jsx durch build.js. Frueher stand hier der
       gesamte Anwendungscode als <script type="text/babel">, den jeder
       Browser bei jedem Aufruf selbst uebersetzen musste. -->
  <script src="js/app.js?v=dev"></script>
</body>
</html>
