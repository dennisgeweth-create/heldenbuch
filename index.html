  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0806; font-family: serif; }
    #root { height: 100vh; }
    #loading { height: 100vh; display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #c9a84c; font-size: 18px; background: #0a0806; gap: 16px; }
    #errmsg { display:none; background:#3a1010; border:1px solid #8b1a1a; border-radius:6px;
              padding:16px 24px; color:#e87070; font-size:13px; max-width:500px;
              white-space:pre-wrap; font-family:monospace; }

<body>
  <div id="loading">
    <div>⚔ Heldenbuch lädt...</div>
    <div id="errmsg"></div>
  </div>
  <div id="root" style="display:none"></div>

  <script>
    // Fehler sichtbar machen
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('errmsg');
      el.style.display = 'block';
      el.textContent = 'Fehler: ' + msg + '\nZeile: ' + line;
    };

    // API-Client
    async function apiRequest(serverUrl, action, payload) {
      const url = serverUrl.replace(/\/+$/, '') + '/api.php';
      let res;
      try {
        res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, ...payload }),
        });
      } catch(e) {
        throw new Error('Server nicht erreichbar. Bitte URL prüfen.');
      }
      const data = await res.json();
      if (!data.ok) throw new Error(data.message || 'Serverfehler ' + res.status);
      return data;
    }
    const registerGroup    = (url, code, pass, dmPass)  => apiRequest(url, 'register',        { code, password: pass, dm_password: dmPass||undefined });
    const apiLoadChars     = (url, code, pass)           => apiRequest(url, 'load',            { code, password: pass });
    const apiSaveChars     = (url, code, pass, chars)    => apiRequest(url, 'save',            { code, password: pass, chars });
    const apiSaveChar      = (url, code, pass, charId, char) => apiRequest(url, 'save_char',   { code, password: pass, char_id: charId, char });
    const apiDeleteChar    = (url, code, pass, charId)       => apiRequest(url, 'delete_char', { code, password: pass, char_id: charId });
    const apiSaveItem      = (url, code, pass, charId, itemId, item) => apiRequest(url, 'save_item',   { code, password: pass, char_id: charId, item_id: itemId, item });
    const apiDeleteItem    = (url, code, pass, charId, itemId)       => apiRequest(url, 'delete_item', { code, password: pass, char_id: charId, item_id: itemId });
    const apiSaveLibrary   = (url, code, pass, library)  => apiRequest(url, 'save_library',   { code, password: pass, library });
    const apiDmLoad        = (url, code, pass, dmPass)   => apiRequest(url, 'dm_load',         { code, password: pass, dm_password: dmPass });
    const apiDmSaveLibrary = (url, code, pass, dmPass, dmLibrary) => apiRequest(url, 'dm_save_library', { code, password: pass, dm_password: dmPass, dm_library: dmLibrary });
    const apiSetDmPassword = (url, code, pass, dmPass)   => apiRequest(url, 'set_dm_password', { code, password: pass, dm_password: dmPass });
    const safeSetItem = (key, value) => {
      try {
        if (typeof value === 'string' && value.length > 2500000) return; // >2.5MB — skip, too large
        localStorage.setItem(key, value);
      } catch(e) {
        // Quota exceeded — try to free up space by removing old library caches
        try { localStorage.removeItem('hb_library'); } catch {}
        try { localStorage.removeItem('hb_dm_library'); } catch {}
        try { localStorage.setItem(key, value); } catch {} // retry once
      }
    };
    const apiSaveLog       = (url, code, pass, entry)    => apiRequest(url, 'save_log',  { code, password: pass, entry });
    const apiLoadLogs      = (url, code, pass, charId, opts) => apiRequest(url, 'load_logs', { code, password: pass, char_id: charId||null, limit: (opts&&opts.limit)||50, offset: (opts&&opts.offset)||0, search: (opts&&opts.search)||'', tab_filter: (opts&&opts.tabFilter)||[] });
  </script>

  <script type="text/babel" data-presets="react">

const styles = `
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .sidebar.collapsed { transform:translateX(-260px); margin-right:-260px; }

  /* Heldenwechsel im Bogenkopf (iPad + Desktop; auf dem Handy nicht gerendert) */

  .sync-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  /* Fußbereich der Seitenleiste: Primäraktion, Werkzeuge, Sync — drei

  .sidebar-footer { padding:8px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
  .sidebar-footer .btn-new { margin:0; }
  .sidebar-tools { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .btn-tool { padding:9px 4px; background:var(--bg-card); border:1px solid var(--border); border-radius:4px; color:var(--text-secondary); font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.02em; cursor:pointer; text-align:center; white-space:nowrap; }
  .btn-tool:hover { border-color:var(--border-bright); color:var(--text-primary); background:var(--bg-hover); }
  .sync-line { display:flex; align-items:center; gap:6px; padding:4px 2px 0; font-family:'Cinzel',serif; font-size:11px; color:var(--text-muted); }
  .sync-line-code { color:var(--gold); }
  .sync-line-msg { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sync-line-ver { margin-left:auto; font-size:9px; opacity:0.6; flex-shrink:0; }

  .btn-sync { padding:7px 3px; background:var(--bg-void); border:1px solid var(--border); border-radius:3px; color:var(--text-muted); font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.02em; text-transform:uppercase; cursor:pointer; text-align:center; white-space:nowrap; }
  .btn-sync:hover { border-color:var(--border-bright); color:var(--text-primary); }

  .btn-save { padding:8px 20px; background:linear-gradient(135deg,#7a5c10,var(--gold-dim)); border:1px solid var(--gold-dim); border-radius:3px; color:var(--gold-bright); font-family:'Cinzel',serif; font-size:12px; cursor:pointer; }
  .btn-save:hover { background:linear-gradient(135deg,var(--gold-dim),#a07820); }
  .btn-cancel { padding:8px 16px; background:var(--bg-card); border:1px solid var(--border); border-radius:3px; color:var(--text-muted); font-family:'Cinzel',serif; font-size:12px; cursor:pointer; }

  .form-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(4px); }

  .confirm-ok:hover { background:linear-gradient(135deg,#a02020,#8b1010); }

  .form-modal { background:var(--bg-deep); border:1px solid var(--border-bright); border-radius:8px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; padding:24px; }

  .form-title { font-family:'Cinzel Decorative',serif; font-size:18px; color:var(--gold); margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border); }

  .form-group { display:flex; flex-direction:column; gap:4px; }

  .form-input, .form-select, .form-textarea { background:var(--bg-card); border:1px solid var(--border); border-radius:3px; color:var(--text-primary); padding:8px 10px; font-family:'EB Garamond',serif; font-size:14px; outline:none; width:100%; box-sizing:border-box; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--gold-dim); }

  .mobile-topbar { display:none; }

    .mobile-back { background:none; border:1px solid var(--border); border-radius:4px; color:var(--gold-dim); padding:6px 10px; font-family:'Cinzel',serif; font-size:12px; cursor:pointer; white-space:nowrap; }

  @media (hover:none), (pointer:coarse) {

    .btn-icon { min-width:44px; min-height:44px; padding:10px 14px; }
    .chip-remove { min-width:40px; min-height:40px; padding:8px; }
    .panel-edit-btn { min-height:40px; }
    .joat-toggle { min-height:40px; padding:8px 14px; }
    .btn-tool { min-height:44px; font-size:12px; }
    .btn-sync { min-height:44px; font-size:11px; }
    .mobile-back { min-height:44px; padding:10px 14px; }
    .mobile-nav-btn { min-height:48px; }

    .wn-actions button,
    .spell-actions button,
    .feature-actions button { min-width:40px; min-height:40px; }

    /* 16px verhindert das automatische Hineinzoomen von iOS Safari

    .form-input, input, select, textarea { font-size:16px; min-height:44px; }
    textarea { min-height:96px; }
  }

  /* ── Touch-Geräte: Lesbarkeit und Luft ─────────────────────────────
     Nichts unter 11px. Gleichmäßig winzige Typografie lässt eine Seite

  @media (hover:none), (pointer:coarse) {

    .inv-card-meta,

    .form-label,
    .inv-card-rarity-label,
    .inv-rarity,
    .mobile-nav-label,
    .prop-tag,
    .resource-restore-btn,
    .save-label,
    .sidebar-subtitle,
    .skill-attr-badge,
    .slot-restore-btn,

    .spell-card-school-label,
    .spell-delete,
    .sync-box-title,
    .sync-change-btn,

    .skill-name { font-size:15px; }
    .skill-value { font-size:15px; min-width:34px; }
    .save-value { font-size:15px; }
  }
`;

// Lightweight fuzzy search: returns score > 0 if all query chars appear in order in str
const fuzzyMatch = (str, query) => {
  if (!query) return 1;
  str = str.toLowerCase(); query = query.toLowerCase();
  let si = 0, qi = 0, score = 0, consecutive = 0;
  while (si < str.length && qi < query.length) {
    if (str[si] === query[qi]) {
      consecutive++;
      score += consecutive * 2 + (si === qi ? 1 : 0);
      qi++;
    } else { consecutive = 0; }
    si++;
  }
  return qi === query.length ? score : 0;
};
const fuzzyFilter = (items, query, getStr) => {
  if (!query) return items;
  return items
    .map(item => ({ item, score: Math.max(...[].concat(getStr(item)).map(s => fuzzyMatch(s, query))) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .map(x => x.item);
};

const RichEditor = ({ value, onChange, placeholder, rows }) => {
  const ref = React.useRef(null);
  const [showEmoji, setShowEmoji] = React.useState(false);
  const savedRange = React.useRef(null);

  // Update innerHTML only when value changes from OUTSIDE and editor is not focused
  // This prevents React re-renders from stealing focus while user types
  React.useEffect(() => {
    if (!ref.current) return;
    if (document.activeElement === ref.current) return; // typing — don't interfere
    if (ref.current.innerHTML !== (value || '')) {
      ref.current.innerHTML = value || '';
    }
  }, [value]); // runs whenever value prop changes

  const saveRange = () => {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) savedRange.current = sel.getRangeAt(0).cloneRange();
  };

  const restoreRange = () => {
    const sel = window.getSelection();
    if (savedRange.current && sel) {
      sel.removeAllRanges();
      sel.addRange(savedRange.current);
    }
  };

  const exec = (cmd, val) => {
    ref.current?.focus();
    document.execCommand(cmd, false, val||null);
    onChange(ref.current?.innerHTML || '');
  };

  const isActive = (cmd) => { try { return document.queryCommandState(cmd); } catch { return false; } };

  const insertEmoji = (emoji) => {
    ref.current?.focus();
    restoreRange();
    document.execCommand('insertText', false, emoji);
    onChange(ref.current?.innerHTML || '');
    setShowEmoji(false);
  };

  const minH = rows ? rows * 24 : 80;

  return (
    <div className="rte-wrap" onClick={()=>ref.current?.focus()}>
      <div className="rte-toolbar" onMouseDown={e=>e.preventDefault()}>
        <button type="button" className={"rte-btn rte-btn-bold"+(isActive('bold')?' active':'')}
          onMouseDown={e=>{e.preventDefault();exec('bold');}}>B</button>
        <button type="button" className={"rte-btn rte-btn-italic"+(isActive('italic')?' active':'')}
          onMouseDown={e=>{e.preventDefault();exec('italic');}}>I</button>
        <button type="button" className={"rte-btn rte-btn-underline"+(isActive('underline')?' active':'')}
          onMouseDown={e=>{e.preventDefault();exec('underline');}}>U</button>
        <div style={{width:1,height:16,background:'var(--border)',margin:'0 2px'}}/>
        <button type="button" className="rte-btn"
          onMouseDown={e=>{e.preventDefault();exec('insertUnorderedList');}}>• Liste</button>
        <button type="button" className="rte-btn"
          onMouseDown={e=>{e.preventDefault();exec('insertOrderedList');}}>1. Liste</button>
        <div style={{width:1,height:16,background:'var(--border)',margin:'0 2px'}}/>
        <div className="rte-emoji-wrap">
          <button type="button" className="rte-btn"
            onMouseDown={e=>{e.preventDefault();saveRange();setShowEmoji(s=>!s);}}>😊 Emoji</button>
          {showEmoji && (
            <div className="rte-emoji-grid">
              {EMOJI_LIST.map(em=>(
                <button key={em} type="button" className="rte-emoji-item"
                  onMouseDown={e=>{e.preventDefault();insertEmoji(em);}}>{em}</button>
              ))}
            </div>
          )}
        </div>
      </div>
      <div
        ref={ref}
        className="rte-content"
        contentEditable
        suppressContentEditableWarning
        data-placeholder={placeholder||'Hier schreiben...'}
        style={{minHeight:minH}}
        onInput={()=>onChange(ref.current?.innerHTML||'')}
        onBlur={()=>{setShowEmoji(false);onChange(ref.current?.innerHTML||'');}}
      />
    </div>
  );
};

const LOG_TABS = ['charakter','zauber','inventar','waffen','attribute','rüst','notizen'];
const LOG_TAB_ICONS = {'charakter':'👤','zauber':'✨','inventar':'🎒','waffen':'⚔','attribute':'📊','rüst':'🛡','notizen':'📜'};

const LogTab = ({charId, isDmMode}) => {
  const [entries, setEntries] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [search,  setSearch]  = React.useState('');
  const [tabFilter, setTabFilter] = React.useState([]);
  const [tabExclude, setTabExclude] = React.useState([]);
  const tabFilterRef  = React.useRef([]);
  const tabExcludeRef = React.useRef([]);

  React.useEffect(() => {
    if (!charId) return;
    setLoading(true);
    const url=localStorage.getItem('sv_url')||'',code=localStorage.getItem('sv_code')||'',pass=localStorage.getItem('sv_pass')||'';
    if (!url||!code||!pass) { setLoading(false); return; }
    apiLoadLogs(url, code, pass, charId, {limit:100,offset:0,search:'',tabFilter:[]})
      .then(d => { setEntries(d.logs||[]); setLoading(false); })
      .catch(()=>setLoading(false));
  }, [charId]);

  const q = search.toLowerCase();
  // We need to know which chars are DM-only — check from the chars list via closure
  const dmCharIds = new Set(
    JSON.parse(localStorage.getItem('dnd_chars')||'[]')
      .filter(c=>c.dmOnly===true).map(c=>c.id)
  );
  const filtered = entries.filter(e => {
    if (!isDmMode && dmCharIds.has(e.char_id)) return false;
    if (tabFilter.length>0 && !tabFilter.includes(e.tab)) return false;
    if (tabExclude.length>0 && tabExclude.includes(e.tab)) return false;
    if (q && !e.action.toLowerCase().includes(q)) return false;
    return true;
  });

  const fmt = ts => new Date(ts.replace(' ','T')+'Z').toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const tabColor = t => ({'zauber':'#c060a0','inventar':'#e0a030','waffen':'#c84040','charakter':'var(--gold)'}[t]||'var(--border-bright)');

  return (
    <div>
      <div className="section-title" style={{marginBottom:10}}>📋 Änderungslog</div>
      <div style={{display:'flex',gap:6,marginBottom:8}}>
        <input className="form-input" style={{flex:1,padding:'5px 10px',fontSize:12}}
          placeholder="Suchen..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:10}}>
        {LOG_TABS.map(t=>{
          const inc = tabFilter.includes(t);
          const exc = tabExclude.includes(t);
          return (
            <button key={t} onClick={()=>{
              const curInc = tabFilterRef.current.includes(t);
              const curExc = tabExcludeRef.current.includes(t);
              if (!curInc && !curExc) {
                tabFilterRef.current = [...tabFilterRef.current, t];
                setTabFilter([...tabFilterRef.current]);
              } else if (curInc) {
                tabFilterRef.current = tabFilterRef.current.filter(x=>x!==t);
                setTabFilter([...tabFilterRef.current]);
                tabExcludeRef.current = [...tabExcludeRef.current, t];
                setTabExclude([...tabExcludeRef.current]);
              } else {
                tabExcludeRef.current = tabExcludeRef.current.filter(x=>x!==t);
                setTabExclude([...tabExcludeRef.current]);
              }
            }}
              title={inc?'Klicken zum Ausschließen':exc?'Klicken zum Zurücksetzen':'Klicken zum Einschließen'}
              style={{padding:'3px 8px',borderRadius:12,fontFamily:"'Cinzel',serif",fontSize:9,cursor:'pointer',
                textTransform:'uppercase',letterSpacing:'0.05em',border:'1px solid',
                background:inc?'var(--gold)':exc?'rgba(200,60,60,0.25)':'var(--bg-card)',
                borderColor:inc?'var(--gold)':exc?'#c83c3c':'var(--border)',
                color:inc?'var(--bg-deep)':exc?'#e07070':'var(--text-muted)',
                textDecoration:exc?'line-through':'none'}}>
              {LOG_TAB_ICONS[t]||'📌'} {t}
            </button>
          );
        })}
      </div>
      {loading && <div style={{color:'var(--text-muted)',fontStyle:'italic',fontSize:13}}>Lade...</div>}
      {!loading && filtered.length===0 && <div style={{color:'var(--text-muted)',fontStyle:'italic',fontSize:13}}>Keine Einträge gefunden.</div>}
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {filtered.map((e,i)=>(
          <div key={i} style={{display:'flex',gap:8,padding:'7px 10px',background:'var(--bg-card)',borderRadius:4,
            borderLeft:'3px solid '+tabColor(e.tab), alignItems:'flex-start'}}>
            <div style={{fontSize:13,flexShrink:0}}>{LOG_TAB_ICONS[e.tab]||'📌'}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--text-primary)',lineHeight:1.3}}>{e.action}</div>
              {e.details && Object.keys(e.details).length>0 && (
                <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>
                  {Object.entries(e.details).map(([k,v])=>k+': '+v).join(' · ')}
                </div>
              )}
            </div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:'var(--text-muted)',whiteSpace:'nowrap',flexShrink:0}}>{fmt(e.created_at)}</div>
          </div>
        ))}
      </div>
    </div>
  );
};

  const [setupBusy,  setSetupBusy]  = useState(false);
  const saveTimer = useRef(null);
  const autoSyncTimer = useRef(null);
  const charsRef = useRef([]);
  const selRef   = useRef(null);
  const pendingRef     = useRef(false);
  const pendingChars   = useRef({});       // {charId: charWithoutInventory}
  const pendingDeletes = useRef(new Set()); // charIds to delete
  const pendingItems   = useRef({});       // {charId_itemId: itemData}
  const pendingItemDel = useRef(new Set()); // "charId_itemId" to delete
  const selectChar = (id) => { selRef.current = id; setSel(id); };
  const libRef = useRef({});
  const dmLibRef = useRef({});
  const isDmRef = useRef(false);
  const dmPassRef = useRef('');

  // charsRef muss synchron mitlaufen: save() difft gegen charsRef.current und
  // stellt jeden dort vorhandenen, in der neuen Liste fehlenden Charakter zur
  // Löschung auf dem Server. Eine veraltete Referenz löscht also echte Daten.
  // Deshalb nur über applyChars setzen — nie setChars(...) allein aufrufen.
  const applyChars = (next) => { charsRef.current = next; setChars(next); };

  // charsRef is set synchronously in save() and load ops — NOT via useEffect
  // selRef is updated directly in selectChar below
  useEffect(() => { libRef.current = userLibrary; }, [userLibrary]);
  useEffect(() => { dmLibRef.current = dmLibrary; }, [dmLibrary]);
  useEffect(() => { isDmRef.current = isDmMode; }, [isDmMode]);
  useEffect(() => { dmPassRef.current = dmPass; }, [dmPass]);


  // Auto-sync every 5 seconds in background (silent)
  // Interval sync: push localStorage to server every 3 seconds if pending
  useEffect(() => {
    const tick = async () => {
      if (!pendingRef.current) return;
      const url  = localStorage.getItem('sv_url')  || '';
      const code = localStorage.getItem('sv_code') || '';
      const pass = localStorage.getItem('sv_pass') || '';
      if (!url || !code || !pass) return;

      // Snapshot and optimistically reset
      const toSave    = {...pendingChars.current};
      const toDelete  = new Set(pendingDeletes.current);
      const toSaveI   = {...pendingItems.current};
      const toDeleteI = new Set(pendingItemDel.current);
      pendingRef.current = false;
      pendingChars.current = {};
      pendingDeletes.current = new Set();
      pendingItems.current = {};
      pendingItemDel.current = new Set();

      try {
        const ops = [
          ...Object.values(toSave).map(c => apiSaveChar(url, code, pass, c.id, c)),
          ...Object.values(toSaveI).map(({charId,itemId,item}) => apiSaveItem(url, code, pass, charId, itemId, item)),
          ...[...toDelete].map(id => apiDeleteChar(url, code, pass, id)),
          ...[...toDeleteI].map(k => { const [charId,itemId]=k.split('__'); return apiDeleteItem(url, code, pass, charId, itemId); }),
        ];
        if (ops.length > 0) await Promise.all(ops);
        setSyncStatus('ok'); setSyncMsg('Gespeichert ✓');
      } catch(e) {
        // Re-queue on failure
        Object.assign(pendingChars.current, toSave);
        Object.assign(pendingItems.current, toSaveI);
        for (const id of toDelete) pendingDeletes.current.add(id);
        for (const k of toDeleteI) pendingItemDel.current.add(k);
        pendingRef.current = true;
        setSyncStatus('err'); setSyncMsg(e.message);
      }
    };
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);


  // tplData only loaded when template picker opens (openTpl)

  useEffect(() => {
    const url  = localStorage.getItem('sv_url')  || '';
    const code = localStorage.getItem('sv_code') || '';
    const pass = localStorage.getItem('sv_pass') || '';
    setSvUrl(url); setSvCode(code); setSvPass(pass);
    if (url && code && pass) {
      // Load localStorage immediately for instant display while server loads
      try { const v=localStorage.getItem('dnd_chars'); if(v) applyChars(JSON.parse(v)); } catch {}
      try { const lib=localStorage.getItem('hb_library'); if(lib) setUserLibrary(JSON.parse(lib)); } catch {}
      // Load server data on startup — but only apply if no unsaved local changes
      apiLoadChars(url, code, pass).then(d => {
        if (d.has_dm) setHasDmMode(true);
        if (d.library) { setUserLibrary(d.library); safeSetItem('hb_library', JSON.stringify(d.library)); }
        if (!pendingRef.current) {
          // No unsaved local changes — server is authoritative
          applyChars(d.chars || []);
          localStorage.setItem('dnd_chars', JSON.stringify(d.chars || []));
        }
        // If pendingRef=true: local has newer unsaved data — keep it, interval will push to server
        setSyncStatus('ok'); setSyncMsg('Verbunden ✓');
      }).catch(() => {
        setSyncStatus('ok'); setSyncMsg('Lokal ✓');
      });
    } else {
      try { const v=localStorage.getItem('dnd_chars'); if(v) applyChars(JSON.parse(v)); } catch {}
      setShowSetup(true);
    }
  }, []);

  const saveLibrary = (lib) => {
    setUserLibrary(lib);
    safeSetItem('hb_library', JSON.stringify(lib));
    const url  = localStorage.getItem('sv_url')  || '';
    const code = localStorage.getItem('sv_code') || '';
    const pass = localStorage.getItem('sv_pass') || '';
    if (!url || !code || !pass) return;
    apiSaveLibrary(url, code, pass, lib).catch(() => {});
  };

  const addToLibrary = (type, entry) => {
    const lib = {...userLibrary};
    lib[type] = [...(lib[type]||[])];
    const exists = lib[type].some(e => e.name === entry.name);
    if (!exists) lib[type].push({...entry, _custom: true});
    saveLibrary(lib);
  };

  const removeFromLibrary = (type, name) => {
    const lib = {...userLibrary, [type]: (userLibrary[type]||[]).filter(e=>e.name!==name)};
    saveLibrary(lib);
  };

  const newDbEntry = type => {
    if (type==='spell')  return {name:'',level:1,school:'Hervorrufung',castingTime:'1 Aktion',range:'9 m',duration:'Sofort',components:'V, S',description:'',classes:[],damageTags:[]};
    if (type==='item')   return {name:'',qty:1,weight:'',rarity:'gewöhnlich',description:'',tags:[],source:'',icon:'🎒',imageData:''};
    if (type==='weapon') return {name:'',damage:'1W6',damageType:'Hieb',range:'1,5 m',description:'',properties:[]};
    return {name:'',cr:'1/4',size:'Mittel',type:'Tier',ac:10,hp:10,speed:'9 m',str:10,dex:10,con:10,int:3,wis:12,cha:6,senses:'',skills:'',tagsStr:'',abilitiesStr:'',actions:[{name:'',desc:''}]};
  };

  const openDbForm = (type, entry) => {
    if (!entry) { setDbForm(newDbEntry(type)); setDbFormId(null); return; }
    const form = {...entry};
    if (type==='wildshape') {
      form.tagsStr = (entry.tags||[]).join(', ');
      form.abilitiesStr = (entry.abilities||[]).join('\n');
      if (!form.actions || form.actions.length===0) form.actions = [{name:'',desc:''}];
    }
    setDbForm(form);
    setDbFormId(entry.name);
  };

  const saveDbEntry = () => {
    if (!dbForm || !dbForm.name.trim()) { alert('Name darf nicht leer sein.'); return; }
    let entry = {...dbForm, _custom:true};
    if (dbTab==='wildshape') {
      entry.tags = (dbForm.tagsStr||'').split(',').map(t=>t.trim()).filter(Boolean);
      entry.abilities = (dbForm.abilitiesStr||'').split('\n').map(a=>a.trim()).filter(Boolean);
      entry.actions = (dbForm.actions||[]).filter(a=>a.name.trim());
      delete entry.tagsStr; delete entry.abilitiesStr;
    }
    const type = dbTab;
    const editId = dbFormId;
    const finalEntry = entry;

    const updater = prev => {
      const entries = [...(prev[type]||[])];
      if (editId !== null) {
        const idx = entries.findIndex(e=>e.name===editId);
        if (idx>=0) entries[idx]=finalEntry; else entries.push(finalEntry);
      } else {
        if (entries.some(e=>e.name===finalEntry.name)) { alert('Ein Eintrag mit diesem Namen existiert bereits.'); return prev; }
        entries.push(finalEntry);
      }
      return {...prev, [type]: entries};
    };

    const url=localStorage.getItem('sv_url')||'',code=localStorage.getItem('sv_code')||'',pass=localStorage.getItem('sv_pass')||'';
    if (isDmMode) {
      setDmLibrary(prev => {
        const lib = updater(prev);
        apiDmSaveLibrary(url, code, pass, dmPassRef.current, lib).catch(()=>{});
        return lib;
      });
    } else {
      setUserLibrary(prev => {
        const lib = updater(prev);
        safeSetItem('hb_library', JSON.stringify(lib));
        apiSaveLibrary(url, code, pass, lib).catch(()=>{});
        return lib;
      });
    }
    setDbForm(null); setDbFormId(null);
  };

  const deleteDbEntry = (type, name) => {
    appConfirm('"'+name+'" aus der Bibliothek löschen?', () => {
      const url=localStorage.getItem('sv_url')||'',code=localStorage.getItem('sv_code')||'',pass=localStorage.getItem('sv_pass')||'';
      if (isDmMode) {
        setDmLibrary(prev => {
          const lib = {...prev, [type]: (prev[type]||[]).filter(e=>e.name!==name)};
          apiDmSaveLibrary(url, code, pass, dmPassRef.current, lib).catch(()=>{});
          return lib;
        });
      } else {
        setUserLibrary(prev => {
          const lib = {...prev, [type]: (prev[type]||[]).filter(e=>e.name!==name)};
          safeSetItem('hb_library', JSON.stringify(lib));
          apiSaveLibrary(url, code, pass, lib).catch(()=>{});
          return lib;
        });
      }
    });
  };

  const doSyncLoad = async (url, code, pass) => {
    setSyncStatus('busy'); setSyncMsg('Lade vom Server...');
    try {
      const data = await apiLoad(url, code, pass);
      // User explicitly requested reload — always apply server data
      pendingRef.current = false;   // cancel any pending local saves
      applyChars(data.chars || []);
      localStorage.setItem('dnd_chars', JSON.stringify(data.chars || []));
      if (data.library) { setUserLibrary(data.library); safeSetItem('hb_library', JSON.stringify(data.library)); }
      if (data.has_dm) setHasDmMode(true);
      setSyncStatus('ok'); setSyncMsg('Geladen ✓');
    } catch(e) {
      setSyncStatus('err'); setSyncMsg(e.message);
    }
  };

  const doDmLogin = async () => {
    if (!dmLoginInput.trim()) { setDmLoginErr('Bitte DM-Passwort eingeben.'); return; }
    setDmLoginErr('');
    try {
      const url=localStorage.getItem('sv_url')||'',code=localStorage.getItem('sv_code')||'',pass=localStorage.getItem('sv_pass')||'';
      const data = await apiDmLoad(url, code, pass, dmLoginInput.trim());
      setDmLibrary(data.dm_library || {});
      setDmPass(dmLoginInput.trim());
      setIsDmMode(true);
      setShowDmLogin(false);
      setDmLoginInput('');
    } catch(e) {
      setDmLoginErr(e.message || 'Falsches DM-Passwort.');
    }
  };

  const doDmLogout = () => {
    setIsDmMode(false);
    setDmPass('');
    setDmLibrary({});
  };

  const saveDmLibrary = (lib) => {
    setDmLibrary(lib);
    const url=localStorage.getItem('sv_url')||'',code=localStorage.getItem('sv_code')||'',pass=localStorage.getItem('sv_pass')||'';
    if (!url || !code || !pass || !dmPassRef.current) return;
    apiDmSaveLibrary(url, code, pass, dmPassRef.current, lib).catch(()=>{});
  };

  const save = (u) => {
    const prev = charsRef.current;
    applyChars(u);

    const prevMap = new Map(prev.map(c => [c.id, c]));
    const newMap  = new Map(u.map(c => [c.id, c]));

    for (const [charId, c] of newMap) {
      const prevC = prevMap.get(charId);
      // Diff inventory separately
      const prevInv = new Map((prevC?.inventory||[]).map(i => [i.id, i]));
      const newInv  = new Map((c.inventory||[]).map(i => [i.id, i]));
      for (const [itemId, item] of newInv) {
        if (JSON.stringify(item) !== JSON.stringify(prevInv.get(itemId))) {
          pendingItems.current[charId+'__'+itemId] = {charId, itemId, item};
          pendingItemDel.current.delete(charId+'__'+itemId);
        }
      }
      for (const [itemId] of prevInv) {
        if (!newInv.has(itemId)) {
          pendingItemDel.current.add(charId+'__'+itemId);
          delete pendingItems.current[charId+'__'+itemId];
        }
      }
      // Diff char without inventory
      const cNoInv = {...c, inventory:[]};
      const prevNoInv = prevC ? {...prevC, inventory:[]} : null;
      if (JSON.stringify(cNoInv) !== JSON.stringify(prevNoInv)) {
        pendingChars.current[charId] = cNoInv;
        pendingDeletes.current.delete(charId);
      }
    }
    for (const [id] of prevMap) {
      if (!newMap.has(id)) {
        pendingDeletes.current.add(id);
        delete pendingChars.current[id];
      }
    }

    pendingRef.current = true;
    try { localStorage.setItem('dnd_chars', JSON.stringify(u)); } catch {}
    setSyncStatus('busy'); setSyncMsg('Speichert...');
  };

  // Logging helper — fire-and-forget, never blocks UI
  const addLog = (charId, charName, tab, action, details) => {
    const url  = localStorage.getItem('sv_url')  || '';
    const code = localStorage.getItem('sv_code') || '';
    const pass = localStorage.getItem('sv_pass') || '';
    if (!url || !code || !pass) return;
    const entry = { char_id: charId, char_name: charName, tab, action, details };
    apiSaveLog(url, code, pass, entry).catch(()=>{});
  };

  const applySetup = async () => {
    const { url, code, pass, dmPass: regDmPass } = setupForm;
    if (!url.trim()||!code.trim()||!pass.trim()) { setSetupErr('Bitte alle Felder ausfüllen.'); return; }
    if (pass.length < 6) { setSetupErr('Passwort mindestens 6 Zeichen.'); return; }
    setSetupBusy(true); setSetupErr('');
    try {
      if (setupMode === 'register') await registerGroup(url, code.toUpperCase(), pass, regDmPass||'');
      const data = await apiLoad(url, code.toUpperCase(), pass);
      localStorage.setItem('sv_url',  url);
      localStorage.setItem('sv_code', code.toUpperCase());
      localStorage.setItem('sv_pass', pass);
      setSvUrl(url); setSvCode(code.toUpperCase()); setSvPass(pass);
      applyChars(data.chars || []);
      pendingRef.current = false;
      localStorage.setItem('dnd_chars', JSON.stringify(data.chars || []));
      if (data.library) { setUserLibrary(data.library); safeSetItem('hb_library', JSON.stringify(data.library)); }
      if (data.has_dm) setHasDmMode(true);
      setSyncStatus('ok'); setSyncMsg('Verbunden ✓');
      setShowSetup(false);
    } catch(e) { setSetupErr(e.message); }
    setSetupBusy(false);
  };

  const signOut = () => {
    ['sv_url','sv_code','sv_pass'].forEach(k=>localStorage.removeItem(k));
    setSvUrl(''); setSvCode(''); setSvPass('');
    setSyncStatus('idle'); setSyncMsg('');
    setSetupForm({url:'',code:'',pass:''});
    setShowSetup(true);
  };

  const cur = chars.find(c=>c.id===sel);
  const cc  = CC[cur && cur.charClass] || CC["Kämpfer"];

  // Dieselbe Auswahl wie die Liste "Aktiv" in der Seitenleiste, damit der
  // Wechsel im Kopf keine Helden anbietet, die dort ausgeblendet sind.
  const switchList = chars.filter(c => !c.archived && (c.dmOnly !== true || isDmMode));
  const switchIndex = switchList.findIndex(c => c.id === sel);
  const stepChar = dir => {
    if (!switchList.length) return;
    // Ein archivierter Held steht nicht in der Liste (Index -1): dann zum
    // ersten aktiven springen statt stumm nichts zu tun.
    const next = switchIndex === -1
      ? switchList[0]
      : switchList[(switchIndex + dir + switchList.length) % switchList.length];
    selectChar(next.id);
    setCharMenuOpen(false);
  };

  const openNew  = () => { setEc(newChar()); setShowCF(true); };
  const openEdit = () => { setEc({...cur}); setShowCF(true); };

  const saveChar = () => {
    if (!ec.name.trim()) return;
    const exists = charsRef.current.find(c=>c.id===ec.id);
    save(exists ? charsRef.current.map(c=>c.id===ec.id?ec:c) : [...charsRef.current,ec]);
    if (exists) {
      const prev = charsRef.current.find(c=>c.id===ec.id);
      const charChanges = {};
      if (prev) {
        if (prev.name !== ec.name) charChanges['Name'] = `${prev.name}→${ec.name}`;
        if (prev.charClass !== ec.charClass) charChanges['Klasse'] = `${prev.charClass}→${ec.charClass}`;
        if (prev.level !== ec.level) charChanges['Stufe'] = `${prev.level}→${ec.level}`;
        if (prev.race !== ec.race) charChanges['Rasse'] = `${prev.race}→${ec.race}`;
        if (prev.hp !== ec.hp) charChanges['Max HP'] = `${prev.hp}→${ec.hp}`;
        if (prev.ac !== ec.ac) charChanges['RK'] = `${prev.ac}→${ec.ac}`;
        if (prev.speed !== ec.speed) charChanges['Bewegung'] = `${prev.speed}→${ec.speed}`;
      }
      addLog(ec.id, ec.name, 'charakter', 'Charakter bearbeitet',
        Object.keys(charChanges).length > 0 ? charChanges : {klasse:ec.charClass,stufe:ec.level});
    } else {
      addLog(ec.id, ec.name, 'charakter', 'Charakter erstellt',
        {klasse:ec.charClass, stufe:ec.level, rasse:ec.race});
    }
    selectChar(ec.id); setShowCF(false);
  };
  const deleteChar = () => {
    if (!confirm(cur.name+" wirklich löschen?")) return;
    save(charsRef.current.filter(c=>c.id!==selRef.current)); selectChar(null); setMv("list");
  };
  const addWeapon = () => {
    if (!wf.name.trim()) return;
    const cur2 = charsRef.current.find(c=>c.id===selRef.current);
    if (wfEditId) {
      save(charsRef.current.map(c=>c.id===selRef.current?{...c,weapons:c.weapons.map(w=>w.id===wfEditId?{...wf,id:wfEditId}:w)}:c));
      addLog(selRef.current, cur2?.name, 'waffen', `Waffe bearbeitet: ${wf.name}`, {schaden:wf.damage});
    } else {
      save(charsRef.current.map(c=>c.id===selRef.current?{...c,weapons:[...c.weapons,{...wf,id:Date.now().toString()}]}:c));
      addLog(selRef.current, cur2?.name, 'waffen', `Waffe hinzugefügt: ${wf.name}`, {schaden:wf.damage});
    }
    setWf(newWeapon()); setWfEditId(null); setShowWF(false);
  };
  const delWeapon = id => appConfirm("Waffe wirklich löschen?", () => save(charsRef.current.map(c=>c.id===selRef.current?{...c,weapons:c.weapons.filter(w=>w.id!==id)}:c)));
  const toggleEquipped = id => save(charsRef.current.map(c=>c.id===selRef.current?{...c,weapons:c.weapons.map(w=>w.id===id?{...w,equipped:!w.equipped}:w)}:c));
  const addSpell = () => {
    if (!sf.name.trim()) return;
    const curSel = selRef.current;
    const curChars = charsRef.current;
    if (sfEditId) {
      save(curChars.map(c=>c.id===curSel?{...c,spells:c.spells.map(s=>s.id===sfEditId?{...sf,id:sfEditId}:s)}:c));
    } else {
      save(curChars.map(c=>c.id===curSel?{...c,spells:[...c.spells,{...sf,id:Date.now().toString()}]}:c));
    }
    const cur2 = charsRef.current.find(c=>c.id===selRef.current);
    if (sfEditId) addLog(selRef.current, cur2?.name, 'zauber', `Zauber bearbeitet: ${sf.name}`, {grad:sf.level,schule:sf.school});
    else addLog(selRef.current, cur2?.name, 'zauber', `Zauber hinzugefügt: ${sf.name}`, {grad:sf.level,schule:sf.school});
    setSf(newSpell()); setSfEditId(null); setShowSF(false);
  };
  const delSpell = id => appConfirm("Zauber wirklich löschen?", () => {
    const cur2 = charsRef.current.find(c=>c.id===selRef.current);
    const spell = cur2?.spells?.find(s=>s.id===id);
    save(charsRef.current.map(c=>c.id===selRef.current?{...c,spells:c.spells.filter(s=>s.id!==id)}:c));
    if (spell) addLog(selRef.current, cur2?.name, 'zauber', `Zauber gelöscht: ${spell.name}`, {grad:spell.level});
  });
  const toggleSpellPrepared = id => save(charsRef.current.map(c=>c.id===selRef.current?{...c,spells:c.spells.map(s=>s.id===id?{...s,prepared:s.prepared===false?true:false}:s)}:c));
  const saveFeature = () => {
    if (!ff.name.trim()) return;
    const features = cur.features || [];
    let updated;
    if (ffEditId) {
      updated = features.map(f=>f.id===ffEditId?{...ff,id:ffEditId}:f);
    } else {
      updated = [...features, {...ff, id:Date.now().toString()}];
    }
    const cur2 = charsRef.current.find(c=>c.id===selRef.current);
    save(charsRef.current.map(c=>c.id===selRef.current?{...c,features:updated}:c));
    addLog(selRef.current, cur2?.name, 'attribute', ffEditId?`Merkmal bearbeitet: ${ff.name}`:`Merkmal hinzugefügt: ${ff.name}`, {quelle:ff.source||undefined});
    setFf({name:'',source:'',description:''}); setFfEditId(null); setShowFF(false);
  };
  const delFeature = id => appConfirm("Merkmal wirklich löschen?", () => save(charsRef.current.map(c=>c.id===selRef.current?{...c,features:(c.features||[]).filter(f=>f.id!==id)}:c)));
  const addItem = () => {
    if (!itf.name.trim()) return;
    const cur2 = charsRef.current.find(c=>c.id===selRef.current);
    if (itfEditId) {
      save(charsRef.current.map(c=>c.id===selRef.current?{...c,inventory:(c.inventory||[]).map(i=>i.id===itfEditId?{...itf,id:itfEditId}:i)}:c));
      addLog(selRef.current, cur2?.name, 'inventar', `Gegenstand bearbeitet: ${itf.name}`, {seltenheit:itf.rarity,menge:itf.qty});
    } else {
      save(charsRef.current.map(c=>c.id===selRef.current?{...c,inventory:[...(c.inventory||[]),{...itf,id:Date.now().toString()}]}:c));
      addLog(selRef.current, cur2?.name, 'inventar', `Gegenstand hinzugefügt: ${itf.name}`, {seltenheit:itf.rarity,menge:itf.qty});
    }
    setItf(newItem()); setItfEditId(null); setShowIF(false);
  };
  const delItem = id => appConfirm("Gegenstand wirklich löschen?", () => {
    const cur2 = charsRef.current.find(c=>c.id===selRef.current);
    const item = (cur2?.inventory||[]).find(i=>i.id===id);
    save(charsRef.current.map(c=>c.id===selRef.current?{...c,inventory:(c.inventory||[]).filter(i=>i.id!==id)}:c));
    if (item) addLog(selRef.current, cur2?.name, 'inventar', `Gegenstand gelöscht: ${item.name}`, {seltenheit:item.rarity});
  });
  const doTransfer = (targetId, ids) => {
    const items = (cur.inventory||[]).filter(i=>ids.has(i.id));
    const target = charsRef.current.find(c=>c.id===targetId);
    const updated = charsRef.current.map(c => {
      if (c.id === selRef.current) return {...c, inventory:(c.inventory||[]).filter(i=>!ids.has(i.id))};
      if (c.id === targetId) return {...c, inventory:[...(c.inventory||[]),...items.map(i=>({...i,id:Date.now().toString()+Math.random().toString(36).slice(2)}))]};
      return c;
    });
    save(updated);
    // Log transfer — only if neither char is DM-only

            {key:'light',  label:'Leichte Rüstung', hint:'Basis + GES-Mod'},
            {key:'medium', label:'Mittlere Rüstung', hint:'Basis + GES-Mod (max. +2)'},
            {key:'heavy',  label:'Schwere Rüstung',  hint:'Basis (kein GES)'},
            {key:'shield', label:'Schild',            hint:'+Bonus zur RK'},
            {key:'other',  label:'Sonstiges',         hint:'Kein RK-Einfluss'},
          ];
          const openEqForm = (item) => {
            if (item) { setEqForm({...item}); setEqEditId(item.id); }
            else { setEqForm({name:'',type:'light',baseAC:11,equipped:false,notes:''}); setEqEditId(null); }
            setShowEF(true);
          };
          const saveEqForm = () => {
            if (!eqForm.name.trim()) { alert('Name darf nicht leer sein.'); return; }
            const entry = {...eqForm, id: eqEditId || Date.now().toString()};
            if (eqEditId) {
              updEquipment(equipment.map(e=>e.id===eqEditId?entry:e));
            } else {
              // Only one armor at a time should be equipped — but allow multiple, user decides
              updEquipment([...equipment, entry]);
            }
            setShowEF(false); setEqEditId(null);
          };
          const warnMultiArmor = equippedArmors.length > 1;

          return (
            <>
              <div className="section-title" style={{marginBottom:8}}>🛡 Ausrüstung & Rüstung</div>

              {/* AC summary box */}
              <div style={{background:'var(--bg-card)',border:'1px solid '+(computedAC!==null?'var(--gold-dim)':'var(--border)'),borderRadius:6,padding:'10px 14px',marginBottom:16,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'var(--text-muted)',letterSpacing:'0.1em',textTransform:'uppercase'}}>🛡 Rüstungsklasse</span>
                  <span style={{fontFamily:"'Cinzel Decorative',serif",fontSize:26,color: computedAC!==null?'var(--gold)':'var(--text-muted)'}}>{displayAC}</span>
                </div>
                {computedAC!==null ? (
                  <div style={{fontSize:12,color:'var(--text-muted)',fontFamily:"'Cinzel',serif",lineHeight:1.7}}>
                    {(() => {
                      const dex = mod(cur.dex);
                      const parts = [];

                      // Base armor
                      if (equippedArmors.length > 0) {
                        const a = equippedArmors[0];
                        if (a.type==='heavy')  parts.push(a.name+': '+a.baseAC);
                        if (a.type==='medium') parts.push(a.name+': '+a.baseAC+' + GES '+Math.min(2,dex));
                        if (a.type==='light')  parts.push(a.name+': '+a.baseAC+' + GES '+dex);
                        if (a.type==='other')  parts.push(a.name+': '+a.baseAC);
                        if ((a.acBonus||0)!==0) parts.push('Magisch: +'+(a.acBonus));
                      } else {
                        parts.push('Unbewaffnet: 10 + GES '+dex);
                      }

                      // Shields
                      equippedShields.forEach(sh => {
                        parts.push(sh.name+': +'+(sh.baseAC||2)+(sh.acBonus?' +'+(sh.acBonus):''));
                      });

                      // Item bonuses (other equipped items with acBonus)
                      equipment.filter(e=>e.equipped && e.type==='other' && (e.acBonus||0)!==0).forEach(e=>{
                        parts.push(e.name+': +'+(e.acBonus));
                      });

                      // Talent/ability bonuses
                      acBonuses.filter(b=>b.active && (b.bonus||0)!==0).forEach(b=>{
                        parts.push(b.name+': '+(b.bonus>=0?'+':'')+b.bonus);
                      });

                      return (
                        <div>
                          {parts.map((p,i) => (
                            <div key={i} style={{color: i===0?'var(--text-secondary)':'var(--text-muted)'}}>
                              {i===0 ? '' : '+ '}{p}
                            </div>
                          ))}
                          <div style={{borderTop:'1px solid var(--border)',marginTop:4,paddingTop:4,color:'var(--gold)'}}>
                            = {displayAC} RK
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                ) : (
                  <div style={{fontSize:12,color:'var(--text-muted)',fontStyle:'italic'}}>Keine Rüstung angelegt — Basis 10 + GES-Mod ({fmod(cur.dex)})</div>
                )}
                {warnMultiArmor && <div style={{fontSize:11,color:'var(--crimson-bright)',fontFamily:"'Cinzel',serif"}}>⚠️ Mehrere Rüstungen angelegt!</div>}
              </div>

              {/* Equipment list */}
              {equipment.length===0
                ? <div style={{color:'var(--text-muted)',fontStyle:'italic',fontSize:14,marginBottom:12}}>Noch keine Ausrüstung eingetragen.</div>
                : equipment.map(item => {
                    const typeLabel = ARMOR_TYPES.find(t=>t.key===item.type)||ARMOR_TYPES[0];
                    const isArmor = item.type!=='shield' && item.type!=='other';
                    const isShield = item.type==='shield';
                    return (
                      <div key={item.id} style={{
                        background:'var(--bg-card)',
                        border:'1px solid '+(item.equipped?'var(--gold-dim)':'var(--border)'),
                        borderRadius:6,padding:'10px 14px',marginBottom:8,
                        display:'flex',alignItems:'center',gap:10,
                        boxShadow: item.equipped?'inset 0 0 0 1px rgba(201,168,76,0.15)':''
                      }}>
                        {/* Equip toggle */}
                        <button
                          onClick={()=>toggleEquipmentItem(item.id)}
                          title={item.equipped?'Ablegen':'Anlegen'}
                          style={{
                            width:36,height:36,borderRadius:4,flexShrink:0,cursor:'pointer',fontSize:18,
                            background: item.equipped?'var(--gold-dim)20':'var(--bg-panel)',
                            border:'1px solid '+(item.equipped?'var(--gold)':'var(--border)'),
                            color: item.equipped?'var(--gold)':'var(--text-muted)',
                            display:'flex',alignItems:'center',justifyContent:'center'
                          }}>
                          {item.equipped ? '🛡' : '○'}
                        </button>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontFamily:"'Cinzel',serif",fontSize:13,color:item.equipped?'var(--gold)':'var(--text-primary)'}}>
                            {item.name}
                            {item.equipped && <span style={{marginLeft:8,fontSize:9,letterSpacing:'0.1em',color:'var(--gold-dim)'}}>ANGELEGT</span>}
                          </div>
                          <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>
                            {typeLabel.label}
                            {item.type!=='other' && <span style={{marginLeft:6}}>· {isShield?'+'+(item.baseAC||2)+' RK':'Basis RK '+item.baseAC}</span>}
                          </div>
                          {item.notes && <div style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic',marginTop:2}}>{item.notes}</div>}
                        </div>
                        <button onClick={()=>openEqForm(item)} style={{background:'none',border:'1px solid var(--border)',borderRadius:3,color:'var(--text-muted)',cursor:'pointer',padding:'4px 8px',fontSize:11}}>✎</button>
                        <button onClick={()=>delEquipmentItem(item.id)} style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',padding:'4px 6px',fontSize:14}}>✕</button>
                      </div>
                    );
                  })
              }
              <button className="btn-add" style={{marginTop:4,width:'100%'}} onClick={()=>openEqForm(null)}>+ Ausrüstung hinzufügen</button>

              {/* Common armor templates */}
              <div style={{marginTop:16}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:'var(--text-muted)',letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:8}}>Vorlagen</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {[
                    {name:'Lederrüstung',type:'light',baseAC:11},{name:'Verstärkte Lederrüstung',type:'light',baseAC:12},{name:'Lederlamellenrüstung',type:'light',baseAC:13},
                    {name:'Schuppenpanzer',type:'medium',baseAC:13},{name:'Kettenhemd',type:'medium',baseAC:13},{name:'Brustpanzer',type:'medium',baseAC:14},
                    {name:'Schienenpanzer',type:'medium',baseAC:15},{name:'Halbplatte',type:'medium',baseAC:15},
                    {name:'Ringpanzerhemd',type:'heavy',baseAC:14},{name:'Kettenpanzer',type:'heavy',baseAC:16},{name:'Bänderpanzer',type:'heavy',baseAC:17},{name:'Plattenpanzer',type:'heavy',baseAC:18},
                    {name:'Schild',type:'shield',baseAC:2},
                  ].map(tpl=>(
                    <button key={tpl.name}
                      onClick={()=>{setEqForm({...tpl,id:Date.now().toString(),equipped:false,notes:''});setEqEditId(null);setShowEF(true);}}
                      style={{padding:'3px 10px',borderRadius:12,border:'1px solid var(--border)',background:'var(--bg-card)',color:'var(--text-muted)',fontFamily:"'Cinzel',serif",fontSize:9,cursor:'pointer',letterSpacing:'0.06em'}}>
                      {tpl.name}
                    </button>
                  ))}
                </div>
              </div>

              {/* RK-Boni durch Talente/Fähigkeiten */}
              <div style={{marginTop:20}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                  <div className="section-title" style={{marginBottom:0}}>✦ RK-Boni durch Talente & Fähigkeiten</div>
                </div>
                {acBonuses.length===0
                  ? <div style={{color:'var(--text-muted)',fontStyle:'italic',fontSize:13,marginBottom:8}}>Kein Bonus eingetragen (z.B. Defensiver Kampfstil, Natürliche Rüstung, Ring des Schutzes).</div>
                  : acBonuses.map(b=>(
                    <div key={b.id} style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg-card)',border:'1px solid '+(b.active?'var(--gold-dim)':'var(--border)'),borderRadius:5,padding:'7px 10px',marginBottom:6}}>
                      <button onClick={()=>updAcBonus(b.id,{active:!b.active})}
                        style={{width:28,height:28,borderRadius:4,flexShrink:0,cursor:'pointer',
                          background:b.active?'var(--gold-dim)20':'var(--bg-panel)',
                          border:'1px solid '+(b.active?'var(--gold)':'var(--border)'),
                          color:b.active?'var(--gold)':'var(--text-muted)',fontSize:13,
                          display:'flex',alignItems:'center',justifyContent:'center'}}
                        title={b.active?'Deaktivieren':'Aktivieren'}>
                        {b.active?'✦':'◇'}
                      </button>
                      <input
                        style={{flex:1,background:'transparent',border:'none',borderBottom:'1px solid var(--border)',outline:'none',fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--text-primary)',padding:'2px 4px'}}
                        defaultValue={b.name}
                        onBlur={e=>updAcBonus(b.id,{name:e.target.value})}
                        key={'bn_'+b.id}
                      />
                      <input type="number" min={-5} max={20}
                        style={{width:52,background:'transparent',border:'1px solid var(--border)',borderRadius:3,outline:'none',fontFamily:"'Cinzel Decorative',serif",fontSize:14,color:b.active?'var(--gold)':'var(--text-muted)',padding:'2px 6px',textAlign:'center'}}
                        defaultValue={b.bonus}
                        onBlur={e=>updAcBonus(b.id,{bonus:+e.target.value})}
                        key={'bv_'+b.id}
                      />
                      <span style={{fontSize:11,color:'var(--text-muted)',fontFamily:"'Cinzel',serif",minWidth:20}}>RK</span>
                      <button onClick={()=>delAcBonus(b.id)} style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',padding:'2px 4px',fontSize:13}}>✕</button>
                    </div>
                  ))
                }
                <button className="btn-add" style={{marginTop:4}} onClick={addAcBonus}>+ RK-Bonus hinzufügen</button>
                {acBonuses.filter(b=>b.active).length>0 && (
                  <div style={{marginTop:8,fontSize:12,color:'var(--text-muted)',fontStyle:'italic'}}>
                    Aktive Boni: {acBonuses.filter(b=>b.active).map(b=>(b.bonus>=0?'+':'')+b.bonus+' ('+b.name+')').join(', ')}
                  </div>
                )}
              </div>
            </>
          );
        })()}

        {tab==="waffen" && (
          <>
            <div className="section-title" style={{marginBottom:12}}>&#128481; Ausgerüstete Waffen</div>
            {cur.weapons.length===0
              ? <div style={{color:"var(--text-muted)",fontStyle:"italic",fontSize:14,marginBottom:12}}>Keine Waffen ausgerüstet. Klicke unten um eine hinzuzufügen.</div>
              : <div style={{overflowX:"auto"}}><table className="weapon-table">
                  <thead><tr>
                    <th style={{width:24}}></th>
                    <th>Angriff</th>
                    <th className="center">ÜB</th>
                    <th className="center">Attr.</th>
                    <th className="center">Reichweite</th>
                    <th className="center">Bonus</th>
                    <th className="center">Schaden</th>
                    <th className="center">Typ</th>
                    <th></th>
                  </tr></thead>
                  <tbody>
                    {[...cur.weapons]
                      .sort((a,b)=>{
                        if(!!a.equipped !== !!b.equipped) return a.equipped?-1:1;
                        return (a.name||"").localeCompare(b.name||"","de");
                      })
                      .map(w => {
                      const aKey = w.attrKey==="fin" ? (mod(cur.str)>=mod(cur.dex)?"str":"dex") : (w.attrKey||"str");
                      const attrMod = mod(cur[aKey] || 10);
                      const bonus = (w.proficient ? cur.profBonus : 0) + attrMod + (w.attackBonus||0);
                      const dmgBonus = attrMod + (w.attackBonus||0);
                      const dmgStr = w.damage + (dmgBonus!==0 ? (dmgBonus>0?" + "+dmgBonus:" - "+Math.abs(dmgBonus)) : "");
                      const attrLabel = (WATTRS.find(a=>a.key===(w.attrKey||"str")) || WATTRS[0]).label;
                      const hasDesc = (w.description && w.description.trim()) || (w.properties && w.properties.length>0);
                      const isEquipped = !!w.equipped;
                      return [
                        <tr className={"weapon-row"+(hasDesc?" expanded":"")+(isEquipped?" equipped":"")} key={w.id}>
                          <td style={{padding:"9px 4px",textAlign:"center"}}>
                            <button
                              title={isEquipped?"Ablegen":"Anlegen"}
                              onClick={()=>toggleEquipped(w.id)}
                              style={{background:"none",border:"none",cursor:"pointer",fontSize:14,lineHeight:1,
                                color:isEquipped?"var(--gold)":"var(--border-bright)",
                                opacity:isEquipped?1:0.4,
                                transition:"color 0.15s,opacity 0.15s"}}>
                              ⚔
                            </button>
                          </td>
                          <td><span className="wn-name" onClick={()=>{setWf({...w,properties:w.properties||[]});setWfEditId(w.id);setShowWF(true);}}>{w.name||"—"}</span></td>
                          <td className="wn-prof">{w.proficient ? "✓" : ""}</td>
                          <td className="wn-attr"><span style={{fontFamily:"'Cinzel',serif",fontSize:11,color:"var(--text-muted)"}}>{attrLabel}</span></td>
                          <td className="wn-range">{w.range||"—"}</td>
                          <td className="wn-bonus">{bonus>=0?"+"+bonus:bonus}</td>
                          <td className="wn-damage">{dmgStr}</td>
                          <td className="wn-dtype">{w.damageType||"—"}</td>
                          <td><div className="wn-actions">
                            <button className="wn-btn" title="Bearbeiten" onClick={()=>{setWf({...w,properties:w.properties||[]});setWfEditId(w.id);setShowWF(true);}}>&#9998;</button>
                            <button className="wn-btn del" title="Löschen" onClick={()=>delWeapon(w.id)}>✕</button>
                          </div></td>
                        </tr>,
                        hasDesc ? <tr className={"weapon-desc-row"+(isEquipped?" equipped":"")} key={w.id+"d"}><td></td><td colSpan={8}>
                          {w.description && <span style={{marginRight:6}} dangerouslySetInnerHTML={{__html:w.description}} />}
                          {(w.properties||[]).map(p=><span className="wn-prop-tag" key={p} style={{marginRight:4}}>{p}</span>)}
                        </td></tr> : null
                      ];
                    })}
                  </tbody>
                </table></div>
            }
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn-add" style={{flex:1}} onClick={()=>{setWf(newWeapon());setWfEditId(null);setShowWF(true);}}>+ Waffe hinzufügen</button>
              <button className="btn-add" style={{flex:1,borderColor:"var(--gold)",color:"var(--gold)"}} onClick={()=>openTpl('weapon')}>&#128214; Von Vorlage (SRD)</button>
            </div>
          </>
        )}

        {tab==="zauber" && (
          <>
            <div className="slots-panel">
              <div className="slots-panel-header">
                <div className="slots-title">◈ Zauberplätze</div>
                <button className={"panel-edit-btn"+(slotsEdit?" active":"")} onClick={()=>setSlotsEdit(!slotsEdit)}>{slotsEdit?"✓ Fertig":"✏️ Bearbeiten"}</button>
              </div>
              {[1,2,3,4,5,6,7,8,9].every(l=>!slots[l] || slots[l].max===0) && (
                <div style={{color:"var(--text-muted)",fontSize:13,fontStyle:"italic",marginBottom:8}}>Noch keine Slots.{!slotsEdit && ' Klicke "Bearbeiten" zum Hinzufügen.'}</div>
              )}
              <div className="slots-grid">
                {[1,2,3,4,5,6,7,8,9].map(l => {
                  const s = slots[l]||{max:0,used:0};
                  if (!slotsEdit && s.max === 0) return null;
                  return (
                    <div className="slot-row" key={l}>
                      <div className="slot-row-label">Grad {l}</div>
                      <div className="slot-pips">
                        {Array.from({length:s.max}).map((_,i) => (
                          <div key={i} className={"slot-pip "+(i<(s.max-s.used)?"available":"used")} onClick={()=>togSlot(l,i)} />
                        ))}
                        {slotsEdit && <button className="slot-max-btn" onClick={()=>chgMax(l,1)}>+</button>}
                        {slotsEdit && s.max>0 && <button className="slot-max-btn" onClick={()=>chgMax(l,-1)}>−</button>}
                        {!slotsEdit && s.max===0 && <span style={{color:"var(--text-muted)",fontSize:11}}>—</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
              {[1,2,3,4,5,6,7,8,9].some(l=>slots[l] && slots[l].max>0) && (
                <button className="slot-restore-btn" onClick={resetAll}>↺ Alle Slots wiederherstellen (lange Rast)</button>
              )}
            </div>

            {/* Zaubereipunkte */}
            {(() => {
              const isZauberer = cur.charClass === "Zauberer" || (cur.multiclasses||[]).some(m=>m.charClass==="Zauberer");
              if (!isZauberer) return null;
              return sp.max > 0 ? (
                <div className="sorcery-panel">
                  <div className="slots-panel-header" style={{marginBottom:8}}>
                    <div className="sorcery-title" style={{margin:0}}>✦ Zaubereipunkte</div>
                    <button className={"panel-edit-btn"+(spEdit?" active":"")} onClick={()=>setSpEdit(!spEdit)} style={{borderColor:"var(--arcane-bright)",color:spEdit?"var(--arcane-bright)":"var(--text-muted)",opacity: spEdit?1:0.6}}>{spEdit?"✓ Fertig":"✏️ Bearbeiten"}</button>
                  </div>
                  <div className="sorcery-pips">
                    {Array.from({length:sp.max}).map((_,i) => {
                      const avail = sp.max - sp.used;
                      return <div key={i} className={"sorcery-pip "+(i<avail?"available":"spent")} onClick={()=>togSP(i)} title={i<avail?"Punkt ausgeben":"Punkt zurück"}/>;
                    })}
                    {spEdit && <button className="slot-max-btn" onClick={()=>spChgMax(1)} title="Max erhöhen">+</button>}
                    {spEdit && sp.max>0 && <button className="slot-max-btn" onClick={()=>spChgMax(-1)} title="Max verringern">−</button>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
                    <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:18,color:"var(--arcane-bright)"}}>
                      {sp.max-sp.used} <span style={{fontSize:11,color:"var(--text-muted)"}}>/ {sp.max}</span>
                    </div>
                    {sp.used>0 && <button className="slot-restore-btn" style={{borderColor:"var(--arcane-bright)",color:"var(--arcane-bright)"}} onClick={()=>updSP({...sp,used:0})}>↺ Wiederherstellen (Lange Rast)</button>}
                  </div>
                </div>
              ) : (
                <button className="btn-add" style={{marginBottom:16}} onClick={()=>updSP({max:cur.level,used:0})}>✦ Zaubereipunkte aktivieren</button>
              );
            })()}

            {/* Ressourcen-Tracker */}
            <div className="slots-panel" style={{marginBottom:16}}>
              <div className="slots-panel-header">
                <div className="slots-title">◇ Ressourcen &amp; Sonderpunkte</div>
                <button className={"panel-edit-btn"+(resEdit?" active":"")} onClick={()=>setResEdit(!resEdit)}>{resEdit?"✓ Fertig":"✏️ Bearbeiten"}</button>
              </div>
              {resources.length === 0 && (
                <div style={{color:"var(--text-muted)",fontSize:13,fontStyle:"italic",marginBottom:8}}>Noch keine Ressourcen.{!resEdit && ' Klicke "Bearbeiten" zum Hinzufügen.'}</div>
              )}
              <div className="resource-list">
                {resources.map(res => (
                  <div className="resource-item" key={res.id}>
                    {resEdit ? (
                      <div className="resource-header">
                        <input
                          className="form-input"
                          style={{padding:"3px 6px",fontSize:13,fontFamily:"'Cinzel',serif",flex:1,background:"transparent",border:"none",borderBottom:"1px solid var(--border)",borderRadius:0,color:"var(--text-primary)"}}
                          key={`res_name_${res.id}_${res.name}`}
                          defaultValue={res.name}
                          onBlur={e=>updResource(res.id,{name:e.target.value})}
                        />
                        <input
                          className="form-input"
                          style={{padding:"3px 6px",fontSize:11,fontFamily:"'Cinzel',serif",width:52,background:"transparent",border:"none",borderBottom:"1px solid var(--border)",borderRadius:0,color:"var(--text-muted)"}}
                          key={`res_abbr_${res.id}_${res.abbr}`}
                          defaultValue={res.abbr||""}
                          placeholder="Kürzel"
                          onBlur={e=>updResource(res.id,{abbr:e.target.value})}
                          title="Abkürzung für die Ressourcen-Leiste"
                        />
                        <div style={{display:"flex",alignItems:"center",gap:4}}>
                          <input type="color"
                            defaultValue={res.color||"#c9a84c"}
                            onBlur={e=>updResource(res.id,{color:e.target.value})}
                            onChange={e=>e.target.parentElement.querySelector('.color-preview')&&(e.target.parentElement.querySelector('.color-preview').style.background=e.target.value)}
                            style={{width:22,height:22,padding:0,border:"none",borderRadius:3,cursor:"pointer",background:"none"}} title="Farbe wählen"/>
                          <select className="form-select" style={{padding:"2px 4px",fontSize:11,width:"auto"}}
                            value={res.restType||"lang"} onChange={e=>updResource(res.id,{restType:e.target.value})}>
                            <option value="lang">Lange Rast</option>
                            <option value="kurz">Kurze Rast</option>
                            <option value="tag">Täglich</option>
                          </select>
                          <button className="resource-del" onClick={()=>delResource(res.id)}>✕</button>
                        </div>
                      </div>
                    ) : (

                <input className="form-input" placeholder="z.B. Gefunden in Dungeon, Kauf beim Händler..." value={itf.source||''} onChange={e=>setItf({...itf,source:e.target.value})} />
              </div>
              <div className="form-group form-full">
                <div className="form-label">Tags (Enter oder Komma zum Hinzufügen)</div>
                <div className="tag-input-wrap" onClick={e=>e.currentTarget.querySelector('input').focus()}>
                  {(itf.tags||[]).map(t=>(
                    <span key={t} className="tag-chip">{t}<button className="tag-chip-del" onClick={()=>setItf({...itf,tags:(itf.tags||[]).filter(x=>x!==t)})}>×</button></span>
                  ))}
                  <input className="tag-text-input" placeholder={(itf.tags||[]).length===0?"z.B. Waffe, Ruestung, Quest...":""}
                    onKeyDown={e=>{
                      const v=e.target.value.trim();
                      if((e.key==="Enter"||e.key===",")&&v){e.preventDefault();const t=v.replace(/,/g,"").trim();if(t&&!(itf.tags||[]).includes(t))setItf({...itf,tags:[...(itf.tags||[]),t]});e.target.value="";}
                      if(e.key==="Backspace"&&!e.target.value&&(itf.tags||[]).length>0)setItf({...itf,tags:(itf.tags||[]).slice(0,-1)});
                    }}
                    onBlur={e=>{
                      const v=e.target.value.trim().replace(/,/g,"");
                      if(v&&!(itf.tags||[]).includes(v)){setItf({...itf,tags:[...(itf.tags||[]),v]});e.target.value="";}
                    }} />
                </div>
              </div>
              {/* Image upload */}
              <div className="form-group form-full">
                <div className="form-label">Bild (optional)</div>
                <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                  {itf.imageData && (
                    <div style={{position:'relative',flexShrink:0}}>
                      <img src={itf.imageData} alt="" style={{width:80,height:60,objectFit:'cover',borderRadius:4,border:'1px solid var(--border)'}} />
                      <button onClick={()=>setItf({...itf,imageData:''})}
                        style={{position:'absolute',top:-6,right:-6,width:18,height:18,borderRadius:'50%',background:'var(--crimson)',border:'none',color:'#fff',fontSize:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1}}>✕</button>
                    </div>
                  )}
                  <label style={{flex:1,padding:'10px 14px',background:'var(--bg-card)',border:'1px dashed var(--border)',borderRadius:6,cursor:'pointer',textAlign:'center',fontSize:12,color:'var(--text-muted)',fontFamily:"'Cinzel',serif",letterSpacing:'0.05em'}}>
                    📷 Bild auswählen
                    <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{
                      const file = e.target.files?.[0];
                      if(!file) return;
                      const reader = new FileReader();
                      reader.onload = ev => {
                        // Compress via canvas — max 600px wide, 0.75 quality → ~60-100KB
                        const img = new Image();
                        img.onload = () => {
                          const MAX = 1000;
                          const scale = img.width > MAX ? MAX / img.width : 1;
                          const canvas = document.createElement('canvas');
                          canvas.width  = Math.round(img.width  * scale);
                          canvas.height = Math.round(img.height * scale);
                          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                          const compressed = canvas.toDataURL('image/jpeg', 0.85);
                          setItf(prev=>({...prev,imageData:compressed}));
                        };
                        img.src = ev.target.result;
                      };
                      reader.readAsDataURL(file);
                    }} />
                  </label>
                </div>
              </div>
            </div>
            <div className="form-actions">
              <button className="btn-cancel" onClick={()=>{setShowIF(false);setItfEditId(null);}}>Abbrechen</button>

            </div>
          </div>
        </div>
      )}
      {/* Transfer Modal */}
      {showTransfer && cur && (() => {
        const transferItems = (cur.inventory||[]).filter(i=>transferSel.has(i.id));

        const others = chars.filter(c => {
          if (c.id === sel || c.archived) return false;

        return (
          <div className="form-overlay">

                        onMouseLeave={e=>e.currentTarget.style.borderColor=c.dmOnly?"rgba(192,96,160,0.4)":"var(--border)"}>
                        <div style={{width:8,height:8,borderRadius:"50%",background:c.dmOnly?"#c060a0":cc.bg,border:"1px solid "+(c.dmOnly?"#c060a0":cc.border),flexShrink:0}}/>
                        <div style={{flex:1}}>
                          <div style={{fontFamily:"'Cinzel',serif",fontSize:13,color:c.dmOnly?"#c060a0":"var(--text-primary)",display:"flex",alignItems:"center",gap:5}}>

                          <div style={{fontSize:11,color:"var(--text-muted)",marginTop:2}}>{c.charClass} · Stufe {c.level} · {(c.inventory||[]).length} Gegenst. im Inventar</div>

                      </button>
                    );

              )}
              <button className="btn-icon" style={{width:"100%",justifyContent:"center"}} onClick={()=>setShowTransfer(false)}>Abbrechen</button>
            </div>
          </div>
        );
      })()}

      {/* Coin Popover */}
      {coinPopover && (() => {
        const cur = coinPopover.val || 0;
        const delta = parseInt(coinDelta)||0;
        const apply = (sign) => {
          const newVal = Math.max(0, cur + sign * Math.abs(delta||0));
          updCurrency(coinPopover.key, newVal);
          setCoinPopover(prev => ({...prev, val: newVal}));
          setCoinDelta('');

        return (
          <div className="form-overlay" style={{background:'rgba(0,0,0,0.6)'}} onClick={()=>setCoinPopover(null)}>
            <div style={{background:'var(--bg-panel)',borderRadius:8,padding:'18px 20px',
              border:`2px solid ${coinPopover.color}60`,boxShadow:'0 8px 32px rgba(0,0,0,0.7)',
              minWidth:220,maxWidth:280}} onClick={e=>e.stopPropagation()}>
              {/* Header */}
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
                <span style={{fontSize:28}}>🪙</span>
                <div>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:14,color:coinPopover.color,fontWeight:700,letterSpacing:'0.08em'}}>{coinPopover.label}</div>
                  <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:20,color:'var(--text-primary)',lineHeight:1}}>{cur}</div>

                  <div style={{fontFamily:"'EB Garamond',serif",fontSize:12,color:'rgba(255,255,255,0.85)',marginTop:4,fontStyle:'italic'}}>
                    {r.label}
                    {item.qty>1?` · ×${item.qty}`:''}
                    {item.weight?` · ${item.weight} kg`:''}
                  </div>
                </div>
                <button onClick={()=>setItemViewer(null)}
                  style={{background:'rgba(0,0,0,0.2)',border:'none',color:'rgba(255,255,255,0.7)',cursor:'pointer',fontSize:16,lineHeight:1,padding:'4px 7px',borderRadius:4,flexShrink:0}}>✕</button>
              </div>

            display:'flex',flexDirection:'column'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
              padding:'10px 14px',background:'#0d0905',borderBottom:'1px solid #2a1e10',flexShrink:0}}>
              <span style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'#c9a84c',

          </div>
        </div>,
        document.body

      {/* Server Setup Modal */}
      {showDB && (() => {
        const types = [{k:'spell',label:'Zauber',icon:'📖'},{k:'weapon',label:'Waffen',icon:'⚔'},{k:'wildshape',label:'Tiere',icon:'🐺'},{k:'item',label:'Gegenstände',icon:'🎒'}];

        const DMG_TYPES = ['Hieb','Stich','Wucht','Feuer','Kälte','Blitz','Säure','Gift','Nekro','Psycho','Energie','Kraft'];
        const WPN_PROPS = ['Finesse','Weit','Leicht','Schwer','Werfbar','Zweihändig','Vielseitig','Ladezeit','Besondere'];
        return (
          <div className="form-overlay">
            <div className="form-modal" style={{maxWidth:600,height:'85vh',display:'flex',flexDirection:'column'}}>
              <div className="form-title">📚 Datenbank verwalten {isDmMode && <span style={{fontSize:11,color:'#c060a0',fontFamily:"'Cinzel',serif",marginLeft:8}}>🔮 DM-Modus</span>}</div>

              {/* Tabs */}
              <div style={{display:'flex',gap:4,marginBottom:14,flexShrink:0}}>
                {types.map(t=>(
                  <button key={t.k} onClick={()=>{setDbTab(t.k);setDbForm(null);setDbFormId(null);setDbGradeFilter('');setDbExpandedEntry(null);}}
                    style={{flex:1,padding:'7px 4px',fontFamily:"'Cinzel',serif",fontSize:11,cursor:'pointer',border:'1px solid',borderRadius:4,
                      borderColor:dbTab===t.k?'var(--gold)':'var(--border)',
                      background:dbTab===t.k?'var(--bg-panel)':'var(--bg-card)',
                      color:dbTab===t.k?'var(--gold)':'var(--text-muted)'}}>
                    {t.icon} {t.label}
                  </button>
                ))}
              </div>

              {/* Form or List */}
              {dbForm ? (
                <div style={{flex:1,overflowY:'auto'}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:'var(--gold)',marginBottom:12}}>{dbFormId?'Eintrag bearbeiten':'Neuer Eintrag'}</div>

                  {/* SPELL FORM */}
                  {dbTab==='spell' && (
                    <div className="form-grid">
                      <div className="form-group form-full">
                        <div className="form-label">Name</div>
                        <input className="form-input" value={dbForm.name} onChange={e=>setDbForm(f=>({...f,name:e.target.value}))} placeholder="Zaubername" autoFocus/>

                      <div className="form-group">

                        </select>
                      </div>
                      <div className="form-group">
                        <div className="form-label">Schule</div>
                        <select className="form-select" value={dbForm.school} onChange={e=>setDbForm(f=>({...f,school:e.target.value}))}>
                          {SCHOOLS.map(s=><option key={s}>{s}</option>)}
                        </select>
                      </div>
                      <div className="form-group">
                        <div className="form-label">Wirkzeit</div>
                        <input className="form-input" value={dbForm.castingTime} onChange={e=>setDbForm(f=>({...f,castingTime:e.target.value}))} placeholder="1 Aktion"/>
                      </div>
                      <div className="form-group">
                        <div className="form-label">Reichweite</div>
                        <input className="form-input" value={dbForm.range} onChange={e=>setDbForm(f=>({...f,range:e.target.value}))} placeholder="9 m"/>
                      </div>
                      <div className="form-group">
                        <div className="form-label">Dauer</div>
                        <input className="form-input" value={dbForm.duration} onChange={e=>setDbForm(f=>({...f,duration:e.target.value}))} placeholder="Sofort"/>
                      </div>
