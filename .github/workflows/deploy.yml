name: Deploy to SFTP

on:
  push:
    branches: [master]

env:
  SFTP_HOST: access-5019959932.webspace-host.com
  SFTP_USER: su533209
  REMOTE_DIR: /codevermittler/heldenbuch2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Die Dateiliste ist bewusst ausgeschrieben statt "alles kopieren":
      # so landen PATCHNOTES.md, .git und .github nie im Webroot.
      - name: Prepare deploy files
        run: |
          mkdir -p deploy/js deploy/vendor
          cp .htaccess api.php apple-touch-icon.png favicon.png index.html styles.css deploy/
          cp data-spells.json data-weapons.json data-wildshapes.json deploy/
          cp js/data.js js/util.js deploy/js/
          cp vendor/*.js deploy/vendor/
          # Cache-Sperre loesen: styles.css und js/*.js liegen seit der
          # Aufteilung in eigenen Dateien und wuerden sonst aus dem Cache
          # kommen, waehrend index.html schon neu ist. Der Commit-Hash macht
          # jede Auslieferung zu einer neuen URL.
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g" deploy/index.html
          echo "Asset-Version: ${GITHUB_SHA:0:8}"
          grep -o 'href="styles.css?[^"]*"' deploy/index.html
          echo "Zu übertragen:"
          find deploy -type f | sort

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp statt einer fertigen Action, weil diese still fehlschlagen kann:
      # mirror meldet jede Datei einzeln und der Exit-Code bricht den Lauf ab.
      # --env-password hält das Passwort aus der Prozessliste heraus.
      - name: Upload via SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER" --env-password "sftp://$SFTP_HOST" <<EOF
            set sftp:auto-confirm yes;
            set cmd:fail-exit yes;
            mirror --reverse --verbose --no-perms --continue ./deploy/ $REMOTE_DIR/;
            bye
          EOF

      # Seit die Oberfläche auf mehrere Dateien verteilt ist, genügt es nicht
      # mehr, nur index.html zu prüfen: bliebe eine der anderen zurück, wäre
      # die App kaputt und der Lauf trotzdem grün.
      - name: Verify deployed files
        run: |
          FAIL=0
          FILES="index.html styles.css js/data.js js/util.js data-spells.json data-weapons.json data-wildshapes.json vendor/react.production.min.js vendor/react-dom.production.min.js vendor/babel.min.js"
          for f in $FILES; do
            LOCAL=$(sha256sum "deploy/$f" | cut -d' ' -f1)
            REMOTE=$(curl -fsSL "https://codevermittler.net/heldenbuch2/$f?cachebust=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)
            if [ "$LOCAL" = "$REMOTE" ]; then
              echo "OK      $f  ($LOCAL)"
            else
              echo "ABWEICH $f"
              echo "  lokal:  $LOCAL"
              echo "  server: $REMOTE"
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then
            echo "::error::Mindestens eine ausgelieferte Datei stimmt nicht mit der hochgeladenen überein."
            exit 1
          fi
          echo "Alle geprüften Dateien stimmen überein."
