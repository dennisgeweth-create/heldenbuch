name: Deploy to SFTP

on:
  push:
    branches: [master]

# Wohin ausgeliefert wird, steht in den Secrets des Repos und nicht hier:
# das Repo ist oeffentlich, und Adresse, Benutzername und Zielpfad sind die
# halbe Zugangsangabe. Anzulegen unter Settings > Secrets and variables >
# Actions:
#
#   SFTP_HOST      Adresse des Webspace
#   SFTP_USER      Benutzername dort
#   SFTP_PASSWORD  dessen Passwort
#   REMOTE_DIR     Zielverzeichnis, ohne Schraegstrich am Ende
#   SITE_URL       oeffentliche Adresse desselben Verzeichnisses,
#                  ohne Schraegstrich am Ende
#
# Wer das Heldenbuch nur nachbaut, legt keine an: die Pruefschritte laufen
# trotzdem, die Auslieferung wird uebersprungen.
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST:  ${{ secrets.SFTP_HOST }}
      SFTP_USER:  ${{ secrets.SFTP_USER }}
      REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
      SITE_URL:   ${{ secrets.SITE_URL }}
    steps:
      # v5 laeuft auf Node 24. v4 zielte auf Node 20, das GitHub abkuendigt
      # und auf den Laeufern schon zwangsweise auf 24 hob — jeder Lauf
      # meldete das als Warnung.
      - name: Checkout
        uses: actions/checkout@v5

      # js/app.js wird mitcommittet, damit die Seite auch lokal ohne Bauschritt
      # laeuft und der Prueflauf weiter eine Datei aus dem Repo vergleicht.
      # Hier wird deshalb nur kontrolliert, dass sie zu js/src/*.jsx passt —
      # wer die Quelle aendert und das Bauen vergisst, bekommt einen roten
      # Lauf statt einer stillen alten Fassung auf dem Server.
      - name: Check built app.js is current
        run: node build.js --check

      # Die Dateiliste ist bewusst ausgeschrieben statt "alles kopieren":
      # so landen .git, .github, js/src/ und vendor/babel nie im Webroot.
      # Die PATCHNOTES.md geht seit v5.0 mit: die Ausgabe-Nummer in der
      # Heldenleiste oeffnet sie, und eine zweite Fassung im Programm
      # waere nach der ersten Auslieferung veraltet.
      - name: Prepare deploy files
        run: |
          mkdir -p deploy/js deploy/vendor
          cp .htaccess api.php apple-touch-icon.png favicon.png logo.png index.html styles.css deploy/
          cp PATCHNOTES.md deploy/
          cp data-spells.json data-weapons.json data-wildshapes.json data-merkmale.json deploy/
          cp js/data.js js/util.js js/app.js deploy/js/
          # babel.min.js bleibt absichtlich zurueck: es wird nur noch von
          # build.js gebraucht, nicht mehr im Browser.
          cp vendor/react.production.min.js vendor/react-dom.production.min.js deploy/vendor/
          # Cache-Sperre loesen: styles.css und js/*.js liegen seit der
          # Aufteilung in eigenen Dateien und wuerden sonst aus dem Cache
          # kommen, waehrend index.html schon neu ist. Der Commit-Hash macht
          # jede Auslieferung zu einer neuen URL.
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g" deploy/index.html
          echo "Asset-Version: ${GITHUB_SHA:0:8}"
          grep -o 'href="styles.css?[^"]*"' deploy/index.html
          echo "Zu übertragen:"
          find deploy -type f | sort

      - name: Install lftp
        if: env.SFTP_HOST != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp statt einer fertigen Action, weil diese still fehlschlagen kann:
      # mirror meldet jede Datei einzeln und der Exit-Code bricht den Lauf ab.
      # --env-password hält das Passwort aus der Prozessliste heraus.
      - name: Upload via SFTP
        if: env.SFTP_HOST != ''
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER" --env-password "sftp://$SFTP_HOST" <<EOF
            set sftp:auto-confirm yes;
            set cmd:fail-exit yes;
            mirror --reverse --verbose --no-perms --continue ./deploy/ $REMOTE_DIR/;
            bye
          EOF

      # Seit die Oberfläche auf mehrere Dateien verteilt ist, genügt es nicht
      # mehr, nur index.html zu prüfen: bliebe eine der anderen zurück, wäre
      # die App kaputt und der Lauf trotzdem grün.
      - name: Verify deployed files
        if: env.SFTP_HOST != ''
        run: |
          FAIL=0
          FILES="index.html styles.css PATCHNOTES.md js/data.js js/util.js js/app.js data-spells.json data-weapons.json data-wildshapes.json data-merkmale.json vendor/react.production.min.js vendor/react-dom.production.min.js"
          for f in $FILES; do
            LOCAL=$(sha256sum "deploy/$f" | cut -d' ' -f1)
            REMOTE=$(curl -fsSL "$SITE_URL/$f?cachebust=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)
            if [ "$LOCAL" = "$REMOTE" ]; then
              echo "OK      $f  ($LOCAL)"
            else
              echo "ABWEICH $f"
              echo "  lokal:  $LOCAL"
              echo "  server: $REMOTE"
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then
            echo "::error::Mindestens eine ausgelieferte Datei stimmt nicht mit der hochgeladenen überein."
            exit 1
          fi
          echo "Alle geprüften Dateien stimmen überein."
